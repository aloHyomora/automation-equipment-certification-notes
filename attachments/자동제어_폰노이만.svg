<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
  <rect width="640" height="330" rx="16" fill="#fff"/>
  <!-- CPU -->
  <rect x="30" y="30" width="250" height="150" rx="10" fill="#EAF0FA" stroke="#2F5597" stroke-width="2"/>
  <text x="155" y="56" font-size="16" font-weight="bold" text-anchor="middle" fill="#2F5597">CPU (마이크로프로세서)</text>
  <rect x="48" y="72" width="100" height="44" rx="6" fill="#fff" stroke="#2F5597"/>
  <text x="98" y="99" font-size="13" text-anchor="middle" fill="#222">제어장치</text>
  <rect x="162" y="72" width="100" height="44" rx="6" fill="#fff" stroke="#2F5597"/>
  <text x="212" y="92" font-size="13" text-anchor="middle" fill="#222">연산장치</text>
  <text x="212" y="108" font-size="11" text-anchor="middle" fill="#555">(ALU)</text>
  <rect x="48" y="126" width="214" height="40" rx="6" fill="#fff" stroke="#2F5597"/>
  <text x="155" y="151" font-size="13" text-anchor="middle" fill="#222">레지스터 (누산기·PC·플래그…)</text>
  <!-- Memory -->
  <rect x="360" y="30" width="250" height="150" rx="10" fill="#FBEFE6" stroke="#C55A11" stroke-width="2"/>
  <text x="485" y="56" font-size="16" font-weight="bold" text-anchor="middle" fill="#C55A11">메모리</text>
  <rect x="378" y="74" width="214" height="40" rx="6" fill="#fff" stroke="#C55A11"/>
  <text x="485" y="99" font-size="13" text-anchor="middle" fill="#222">명령어 (프로그램)</text>
  <rect x="378" y="124" width="214" height="40" rx="6" fill="#fff" stroke="#C55A11"/>
  <text x="485" y="149" font-size="13" text-anchor="middle" fill="#222">데이터</text>
  <!-- Bus -->
  <rect x="30" y="215" width="580" height="34" rx="8" fill="#F2F2F2" stroke="#666"/>
  <text x="320" y="237" font-size="13" text-anchor="middle" fill="#222">버스: 주소 버스 · 데이터 버스 · 제어 버스</text>
  <line x1="155" y1="180" x2="155" y2="213" stroke="#666" stroke-width="3"/>
  <line x1="485" y1="180" x2="485" y2="213" stroke="#666" stroke-width="3"/>
  <!-- IO -->
  <rect x="245" y="272" width="150" height="40" rx="8" fill="#EEF5E9" stroke="#548235" stroke-width="2"/>
  <text x="320" y="297" font-size="13" text-anchor="middle" fill="#222">입출력 장치</text>
  <line x1="320" y1="249" x2="320" y2="270" stroke="#666" stroke-width="3"/>
  <text x="475" y="202" font-size="11" text-anchor="end" fill="#555">명령어와 데이터를 한 메모리에 함께 저장</text>
</svg>
