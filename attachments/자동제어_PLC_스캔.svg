<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2F5597"/></marker></defs>
  <rect width="720" height="330" fill="#ffffff"/>
  <text x="360" y="26" font-size="16" font-weight="bold" fill="#2F5597" text-anchor="middle">PLC 스캔 사이클 (한 바퀴 = 스캔 타임)</text>
  <!-- external -->
  <rect x="20" y="130" width="110" height="70" fill="#FBE5D6" stroke="#C55A11" stroke-width="2"/>
  <text x="75" y="160" font-size="14" fill="#C55A11" text-anchor="middle">외부 입력</text>
  <text x="75" y="180" font-size="12" fill="#555" text-anchor="middle">스위치·센서</text>
  <rect x="590" y="130" width="110" height="70" fill="#FBE5D6" stroke="#C55A11" stroke-width="2"/>
  <text x="645" y="160" font-size="14" fill="#C55A11" text-anchor="middle">외부 출력</text>
  <text x="645" y="180" font-size="12" fill="#555" text-anchor="middle">램프·밸브·모터</text>
  <!-- steps -->
  <rect x="190" y="60" width="150" height="56" fill="#DAE3F3" stroke="#2F5597" stroke-width="2"/>
  <text x="265" y="84" font-size="14" font-weight="bold" fill="#2F5597" text-anchor="middle">① 입력 리프레시</text>
  <text x="265" y="103" font-size="12" fill="#555" text-anchor="middle">입력 상태를 이미지에 복사</text>
  <rect x="380" y="60" width="150" height="56" fill="#DAE3F3" stroke="#2F5597" stroke-width="2"/>
  <text x="455" y="84" font-size="14" font-weight="bold" fill="#2F5597" text-anchor="middle">② 프로그램 연산</text>
  <text x="455" y="103" font-size="12" fill="#555" text-anchor="middle">0스텝 → END 순서대로</text>
  <rect x="380" y="214" width="150" height="56" fill="#DAE3F3" stroke="#2F5597" stroke-width="2"/>
  <text x="455" y="238" font-size="14" font-weight="bold" fill="#2F5597" text-anchor="middle">③ 출력 리프레시</text>
  <text x="455" y="257" font-size="12" fill="#555" text-anchor="middle">결과를 출력 단자로</text>
  <rect x="190" y="214" width="150" height="56" fill="#DAE3F3" stroke="#2F5597" stroke-width="2"/>
  <text x="265" y="238" font-size="14" font-weight="bold" fill="#2F5597" text-anchor="middle">④ 자기진단·통신</text>
  <text x="265" y="257" font-size="12" fill="#555" text-anchor="middle">WDT 확인, 통신 처리</text>
  <g stroke="#2F5597" stroke-width="2.5" fill="none">
    <line x1="340" y1="88" x2="378" y2="88" marker-end="url(#a)"/>
    <line x1="455" y1="116" x2="455" y2="212" marker-end="url(#a)"/>
    <line x1="380" y1="242" x2="342" y2="242" marker-end="url(#a)"/>
    <line x1="265" y1="214" x2="265" y2="118" marker-end="url(#a)"/>
  </g>
  <g stroke="#C55A11" stroke-width="2" fill="none" stroke-dasharray="6 4">
    <polyline points="130,165 160,165 160,88 188,88" marker-end="url(#a)"/>
    <polyline points="532,242 645,242 645,202" marker-end="url(#a)"/>
  </g>
  <text x="360" y="168" font-size="13" fill="#555" text-anchor="middle">프로그램이 도는 동안</text>
  <text x="360" y="186" font-size="13" fill="#555" text-anchor="middle">입력 이미지는 고정된다</text>
  <text x="360" y="306" font-size="13" fill="#C00000" text-anchor="middle">프로그램이 길수록 스캔 타임이 늘고, 설정값을 넘으면 워치독(WDT)이 CPU를 정지시킨다</text>
</svg>
