<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<rect width="760" height="330" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#000"/></marker><marker id="arg" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#548235"/></marker><pattern id="hat" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#333" stroke-width="1"/></pattern></defs>
<text x="380.0" y="28.0" font-size="17" fill="#548235" text-anchor="middle" font-weight="bold" >원뿔의 전개 (방사선법) — 밑면 둘레가 부채꼴 호가 된다</text>
<polygon points="160.0,70.0 210.0,211.4 110.0,211.4" fill="#eef4e8" stroke="#000" stroke-width="2.6" stroke-linejoin="round" />
<ellipse cx="160" cy="211.4213562373095" rx="50" ry="10" fill="none" stroke="#000" stroke-width="1.4" stroke-dasharray="5 4"/>
<path d="M110,211.4213562373095 A50,10 0 0 0 210,211.4213562373095" fill="none" stroke="#000" stroke-width="2.6"/>
<line x1="160.0" y1="64.0" x2="160.0" y2="229.4" stroke="#555" stroke-width="0.8" stroke-dasharray="14 4 3 4"/>
<line x1="160.0" y1="237.4" x2="210.0" y2="237.4" stroke="#C00000" stroke-width="1.2" marker-start="url(#ar)" marker-end="url(#ar)"/>
<text x="185.0" y="253.4" font-size="12" fill="#C00000" text-anchor="middle" font-weight="bold" >r = 50</text>
<text x="198.0" y="140.0" font-size="12" fill="#548235" text-anchor="start" font-weight="bold" >L = 150</text>
<text x="198.0" y="156.0" font-size="11" fill="#555" text-anchor="start" >(모선 길이)</text>
<text x="160.0" y="300.0" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" >원뿔 (밑면 지름 100)</text>
<path d="M520,62 L649.9,137.0 A150,150 0 0 1 390.1,137.0 Z" fill="#eef4e8" stroke="#000" stroke-width="2.6"/>
<path d="M549.4,79.0 A34,34 0 0 1 490.6,79.0" fill="none" stroke="#C00000" stroke-width="1.6"/>
<text x="520.0" y="116.0" font-size="13" fill="#C00000" text-anchor="middle" font-weight="bold" >θ = 120°</text>
<text x="595.0" y="95.5" font-size="12" fill="#548235" text-anchor="start" font-weight="bold" >L = 150</text>
<text x="520.0" y="236.0" font-size="12" fill="#000" text-anchor="middle" font-weight="bold" >호 길이 = 밑면 둘레 2π × 50 ≈ 314</text>
<text x="520.0" y="270.0" font-size="14" fill="#C00000" text-anchor="middle" font-weight="bold" >θ = 360° × r / L = 360° × 50 / 150 = 120°</text>
<text x="520.0" y="296.0" font-size="12" fill="#333" text-anchor="middle" >중심각이 주어지면 거꾸로 L = 360° × r / θ</text>
<line x1="260.0" y1="160.0" x2="330.0" y2="160.0" stroke="#548235" stroke-width="1.6" marker-end="url(#arg)"/>
<text x="295.0" y="150.0" font-size="12" fill="#548235" text-anchor="middle" font-weight="bold" >펼치기</text>
</svg>