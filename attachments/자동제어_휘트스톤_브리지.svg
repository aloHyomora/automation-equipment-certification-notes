<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<rect width="760" height="340" fill="#ffffff"/>
<text x="380" y="26" font-size="16" font-weight="bold" fill="#2F5597" text-anchor="middle">휘트스톤 브리지: 대각선에 전원과 검출기</text>
<!-- source wires -->
<polyline points="300,60 80,60 80,300 300,300" fill="none" stroke="#333" stroke-width="2"/>
<!-- battery -->
<rect x="62" y="160" width="36" height="22" fill="#ffffff"/>
<line x1="62" y1="164" x2="98" y2="164" stroke="#333" stroke-width="3"/>
<line x1="70" y1="178" x2="90" y2="178" stroke="#333" stroke-width="3"/>
<text x="106" y="168" font-size="13" fill="#333">+</text>
<text x="40" y="176" font-size="14" fill="#333" text-anchor="end">E</text>
<!-- diamond edges -->
<line x1="300" y1="60" x2="180" y2="180" stroke="#333" stroke-width="2"/>
<line x1="180" y1="180" x2="300" y2="300" stroke="#333" stroke-width="2"/>
<line x1="300" y1="60" x2="420" y2="180" stroke="#333" stroke-width="2"/>
<line x1="420" y1="180" x2="300" y2="300" stroke="#333" stroke-width="2"/>
<!-- resistors -->
<rect x="215" y="111" width="50" height="18" fill="#ffffff" stroke="#2F5597" stroke-width="2.5" transform="rotate(-45 240 120)"/>
<rect x="215" y="231" width="50" height="18" fill="#ffffff" stroke="#2F5597" stroke-width="2.5" transform="rotate(45 240 240)"/>
<rect x="335" y="111" width="50" height="18" fill="#ffffff" stroke="#2F5597" stroke-width="2.5" transform="rotate(45 360 120)"/>
<rect x="335" y="231" width="50" height="18" fill="#FBE5E5" stroke="#C00000" stroke-width="2.5" transform="rotate(-45 360 240)"/>
<text x="212" y="100" font-size="15" font-weight="bold" fill="#2F5597" text-anchor="end">R₁</text>
<text x="212" y="272" font-size="15" font-weight="bold" fill="#2F5597" text-anchor="end">R₂</text>
<text x="388" y="100" font-size="15" font-weight="bold" fill="#2F5597">R₃</text>
<text x="388" y="272" font-size="15" font-weight="bold" fill="#C00000">R₄</text>
<text x="300" y="328" font-size="12" fill="#C00000" text-anchor="middle">R₄ 자리에 스트레인 게이지·RTD를 넣는다</text>
<!-- detector -->
<line x1="180" y1="180" x2="282" y2="180" stroke="#333" stroke-width="2"/>
<line x1="318" y1="180" x2="420" y2="180" stroke="#333" stroke-width="2"/>
<circle cx="300" cy="180" r="18" fill="#ffffff" stroke="#C00000" stroke-width="2.5"/>
<text x="300" y="186" font-size="16" font-weight="bold" fill="#C00000" text-anchor="middle">G</text>
<text x="300" y="218" font-size="12" fill="#C00000" text-anchor="middle">검출 전압</text>
<!-- nodes -->
<circle cx="300" cy="60" r="4" fill="#333"/><circle cx="300" cy="300" r="4" fill="#333"/>
<circle cx="180" cy="180" r="4" fill="#333"/><circle cx="420" cy="180" r="4" fill="#333"/>
<text x="166" y="176" font-size="13" fill="#333" text-anchor="end">C</text>
<text x="434" y="176" font-size="13" fill="#333">D</text>
<!-- explanation -->
<rect x="480" y="58" width="262" height="246" rx="8" fill="#EEF3FA" stroke="#2F5597"/>
<text x="496" y="84" font-size="14" font-weight="bold" fill="#2F5597">가지 ①: R₁ – R₂ (왼쪽)</text>
<text x="496" y="106" font-size="14" font-weight="bold" fill="#2F5597">가지 ②: R₃ – R₄ (오른쪽)</text>
<text x="496" y="140" font-size="14" fill="#333">C점과 D점 전위가 같으면</text>
<text x="496" y="160" font-size="14" fill="#333">G에 전류가 흐르지 않는다</text>
<text x="496" y="194" font-size="15" font-weight="bold" fill="#C00000">평형: R₁ R₄ = R₂ R₃</text>
<text x="496" y="216" font-size="14" fill="#C00000">(R₁/R₂ = R₃/R₄)</text>
<text x="496" y="248" font-size="13" fill="#333">마주 보는 저항의 곱이 같다</text>
<text x="496" y="272" font-size="13" fill="#333">R₄가 변형·온도로 바뀌면</text>
<text x="496" y="292" font-size="13" fill="#333">→ 불평형 전압이 생긴다</text>
</svg>
