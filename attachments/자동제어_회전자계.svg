<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 380" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
  <rect width="740" height="380" fill="#ffffff"/>
  <defs>
    <marker id="b" viewBox="0 0 10 10" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" refX="7" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C00000"/></marker>
    <marker id="g" viewBox="0 0 10 10" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" refX="7" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2F5597"/></marker>
  </defs>
  <text x="370" y="26" font-size="17" font-weight="bold" fill="#2F5597" text-anchor="middle">3상 권선이 만드는 회전 자계</text>

  <!-- ===== stator ===== -->
  <circle cx="160" cy="190" r="115" fill="#F3F6FB" stroke="#2F5597" stroke-width="3"/>
  <circle cx="160" cy="190" r="70" fill="#ffffff" stroke="#999" stroke-width="1.5"/>
  <text x="160" y="252" font-size="11" fill="#888" text-anchor="middle">회전자</text>
  <!-- coil axes at 90, 210, 330 deg -->
  <g stroke="#2F5597" stroke-width="1.2" stroke-dasharray="4 3">
    <line x1="160" y1="80" x2="160" y2="300"/>
    <line x1="64.7" y1="245" x2="255.3" y2="135"/>
    <line x1="255.3" y1="245" x2="64.7" y2="135"/>
  </g>
  <!-- coil blocks -->
  <g fill="#2F5597">
    <rect x="148" y="72" width="24" height="14" rx="3"/>
    <rect x="148" y="294" width="24" height="14" rx="3"/>
    <rect x="-12" y="-7" width="24" height="14" rx="3" transform="translate(61,247) rotate(60)"/>
    <rect x="-12" y="-7" width="24" height="14" rx="3" transform="translate(259,133) rotate(60)"/>
    <rect x="-12" y="-7" width="24" height="14" rx="3" transform="translate(259,247) rotate(-60)"/>
    <rect x="-12" y="-7" width="24" height="14" rx="3" transform="translate(61,133) rotate(-60)"/>
  </g>
  <g font-size="14" font-weight="bold" fill="#2F5597" text-anchor="middle">
    <text x="160" y="64">U</text><text x="160" y="330">U′</text>
    <text x="38" y="270">V</text><text x="282" y="120">V′</text>
    <text x="282" y="270">W</text><text x="38" y="120">W′</text>
  </g>
  <!-- resultant field arrow (at t1, pointing to U axis) -->
  <line x1="160" y1="190" x2="160" y2="132" stroke="#C00000" stroke-width="4" marker-end="url(#b)"/>
  <text x="168" y="168" font-size="13" font-weight="bold" fill="#C00000">B</text>
  <!-- rotation arrow ccw -->
  <path d="M 140,118 A 74 74 0 0 0 96,152" fill="none" stroke="#C00000" stroke-width="2.5" marker-end="url(#b)"/>
  <text x="160" y="358" font-size="13" fill="#333" text-anchor="middle">120° 간격의 세 권선 (U·V·W)</text>

  <!-- ===== currents ===== -->
  <line x1="340" y1="140" x2="710" y2="140" stroke="#999" stroke-width="1"/>
  <polyline fill="none" stroke="#2F5597" stroke-width="2.5" points="340,90.0 350,90.8 360,93.0 370,96.7 380,101.7 390,107.9 400,115.0 410,122.9 420,131.3 430,140.0 440,148.7 450,157.1 460,165.0 470,172.1 480,178.3 490,183.3 500,187.0 510,189.2 520,190.0 530,189.2 540,187.0 550,183.3 560,178.3 570,172.1 580,165.0 590,157.1 600,148.7 610,140.0 620,131.3 630,122.9 640,115.0 650,107.9 660,101.7 670,96.7 680,93.0 690,90.8 700,90.0"/>
  <polyline fill="none" stroke="#548235" stroke-width="2.5" points="340,165.0 350,157.1 360,148.7 370,140.0 380,131.3 390,122.9 400,115.0 410,107.9 420,101.7 430,96.7 440,93.0 450,90.8 460,90.0 470,90.8 480,93.0 490,96.7 500,101.7 510,107.9 520,115.0 530,122.9 540,131.3 550,140.0 560,148.7 570,157.1 580,165.0 590,172.1 600,178.3 610,183.3 620,187.0 630,189.2 640,190.0 650,189.2 660,187.0 670,183.3 680,178.3 690,172.1 700,165.0"/>
  <polyline fill="none" stroke="#C55A11" stroke-width="2.5" points="340,165.0 350,172.1 360,178.3 370,183.3 380,187.0 390,189.2 400,190.0 410,189.2 420,187.0 430,183.3 440,178.3 450,172.1 460,165.0 470,157.1 480,148.7 490,140.0 500,131.3 510,122.9 520,115.0 530,107.9 540,101.7 550,96.7 560,93.0 570,90.8 580,90.0 590,90.8 600,93.0 610,96.7 620,101.7 630,107.9 640,115.0 650,122.9 660,131.3 670,140.0 680,148.7 690,157.1 700,165.0"/>
  <g font-size="12" font-weight="bold">
    <text x="712" y="94" fill="#2F5597">i_U</text>
    <text x="712" y="160" fill="#548235">i_V</text>
    <text x="712" y="180" fill="#C55A11">i_W</text>
  </g>
  <!-- time markers -->
  <g stroke="#888" stroke-width="1" stroke-dasharray="3 3">
    <line x1="340" y1="70" x2="340" y2="225"/>
    <line x1="460" y1="70" x2="460" y2="225"/>
    <line x1="580" y1="70" x2="580" y2="225"/>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="340" y="64">t₁: i_U 최대</text><text x="460" y="64">t₂: i_V 최대</text><text x="580" y="64">t₃: i_W 최대</text>
  </g>
  <!-- snapshots -->
  <g fill="#ffffff" stroke="#999" stroke-width="1.5">
    <circle cx="340" cy="270" r="30"/><circle cx="460" cy="270" r="30"/><circle cx="580" cy="270" r="30"/>
  </g>
  <g stroke="#C00000" stroke-width="3.5">
    <line x1="340" y1="270" x2="340" y2="246" marker-end="url(#b)"/>
    <line x1="460" y1="270" x2="439" y2="282" marker-end="url(#b)"/>
    <line x1="580" y1="270" x2="601" y2="282" marker-end="url(#b)"/>
  </g>
  <g font-size="12" fill="#C00000" text-anchor="middle">
    <text x="340" y="318">U 방향</text><text x="460" y="318">V 방향 (+120°)</text><text x="580" y="318">W 방향 (+240°)</text>
  </g>
  <text x="525" y="350" font-size="13" fill="#333" text-anchor="middle">전류 한 주기 동안 합성 자계 B가 한 바퀴 돈다 (2극일 때)</text>
</svg>
