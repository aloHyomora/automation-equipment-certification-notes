<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
  <rect x="0" y="0" width="760" height="400" fill="#ffffff"/>
  <text x="380" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2F5597">LVDT(차동 변압기): 철심의 직선 변위 → 전압</text>
  <!-- coils -->
  <rect x="150" y="90" width="140" height="80" fill="#DEEBF7" stroke="#2F5597" stroke-width="2"/>
  <rect x="300" y="90" width="140" height="80" fill="#FBE5D6" stroke="#C00000" stroke-width="2"/>
  <rect x="450" y="90" width="140" height="80" fill="#DEEBF7" stroke="#2F5597" stroke-width="2"/>
  <text x="220" y="82" text-anchor="middle" font-size="14" fill="#2F5597" font-weight="bold">2차 코일 S₁</text>
  <text x="370" y="82" text-anchor="middle" font-size="14" fill="#C00000" font-weight="bold">1차 코일 P</text>
  <text x="520" y="82" text-anchor="middle" font-size="14" fill="#2F5597" font-weight="bold">2차 코일 S₂</text>
  <!-- winding hatch -->
  <g stroke="#2F5597" stroke-width="1" opacity="0.5">
    <line x1="165" y1="92" x2="165" y2="168"/><line x1="185" y1="92" x2="185" y2="168"/><line x1="205" y1="92" x2="205" y2="168"/><line x1="225" y1="92" x2="225" y2="168"/><line x1="245" y1="92" x2="245" y2="168"/><line x1="265" y1="92" x2="265" y2="168"/>
    <line x1="465" y1="92" x2="465" y2="168"/><line x1="485" y1="92" x2="485" y2="168"/><line x1="505" y1="92" x2="505" y2="168"/><line x1="525" y1="92" x2="525" y2="168"/><line x1="545" y1="92" x2="545" y2="168"/><line x1="565" y1="92" x2="565" y2="168"/>
  </g>
  <g stroke="#C00000" stroke-width="1" opacity="0.5">
    <line x1="315" y1="92" x2="315" y2="168"/><line x1="335" y1="92" x2="335" y2="168"/><line x1="355" y1="92" x2="355" y2="168"/><line x1="375" y1="92" x2="375" y2="168"/><line x1="395" y1="92" x2="395" y2="168"/><line x1="415" y1="92" x2="415" y2="168"/>
  </g>
  <!-- bore & core (displaced to the left) -->
  <rect x="140" y="118" width="460" height="24" fill="#ffffff" stroke="#999" stroke-width="1"/>
  <rect x="250" y="120" width="190" height="20" fill="#7F7F7F" stroke="#333" stroke-width="1.5"/>
  <line x1="60" y1="130" x2="250" y2="130" stroke="#333" stroke-width="4"/>
  <text x="95" y="120" text-anchor="middle" font-size="13" fill="#333">측정 로드</text>
  <text x="345" y="135" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">가동 철심</text>
  <!-- displacement arrow -->
  <line x1="345" y1="200" x2="275" y2="200" stroke="#C00000" stroke-width="2.5"/>
  <polygon points="268,200 280,194 280,206" fill="#C00000"/>
  <line x1="370" y1="185" x2="370" y2="215" stroke="#C00000" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="372" y="230" text-anchor="middle" font-size="12" fill="#C00000">중앙(영점)</text>
  <text x="310" y="192" text-anchor="middle" font-size="13" fill="#C00000" font-weight="bold">변위 x</text>
  <!-- excitation -->
  <text x="370" y="60" text-anchor="middle" font-size="12" fill="#C00000">교류 여자 전압 인가</text>
  <!-- outputs -->
  <text x="40" y="270" font-size="14" fill="#333" font-weight="bold">2차 코일은 서로 반대 방향으로 직렬 연결 → 출력 V = V₁ − V₂</text>
  <rect x="40" y="285" width="215" height="90" rx="8" fill="#F2F2F2" stroke="#999"/>
  <rect x="272" y="285" width="215" height="90" rx="8" fill="#FBE5D6" stroke="#C00000"/>
  <rect x="504" y="285" width="215" height="90" rx="8" fill="#F2F2F2" stroke="#999"/>
  <text x="147" y="310" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">철심이 중앙</text>
  <text x="147" y="334" text-anchor="middle" font-size="13" fill="#333">V₁ = V₂</text>
  <text x="147" y="358" text-anchor="middle" font-size="13" fill="#333">출력 0</text>
  <text x="379" y="310" text-anchor="middle" font-size="14" fill="#C00000" font-weight="bold">S₁ 쪽으로 이동 (그림)</text>
  <text x="379" y="334" text-anchor="middle" font-size="13" fill="#C00000">V₁ &gt; V₂</text>
  <text x="379" y="358" text-anchor="middle" font-size="13" fill="#C00000">크기 ∝ x, 위상 = 방향</text>
  <text x="611" y="310" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">S₂ 쪽으로 이동</text>
  <text x="611" y="334" text-anchor="middle" font-size="13" fill="#333">V₁ &lt; V₂</text>
  <text x="611" y="358" text-anchor="middle" font-size="13" fill="#333">위상 반전 (180°)</text>
</svg>
