<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#C55A11"/></marker>
<marker id="b" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#333"/></marker></defs>
<rect width="720" height="300" fill="#ffffff"/>
<text x="360" y="26" font-size="16" font-weight="bold" fill="#2F5597" text-anchor="middle">특수모듈 버퍼 메모리와 CPU의 데이터 교환</text>
<rect x="30" y="60" width="190" height="190" fill="#DAE3F3" stroke="#2F5597" stroke-width="2"/>
<text x="125" y="84" font-size="15" font-weight="bold" fill="#2F5597" text-anchor="middle">CPU</text>
<rect x="55" y="100" width="140" height="34" fill="#fff" stroke="#2F5597"/><text x="125" y="122" font-size="13" fill="#333" text-anchor="middle">D100 (읽은 값)</text>
<rect x="55" y="144" width="140" height="34" fill="#fff" stroke="#2F5597"/><text x="125" y="166" font-size="13" fill="#333" text-anchor="middle">D200 (보낼 값)</text>
<text x="125" y="214" font-size="12" fill="#555" text-anchor="middle">사용자 프로그램이</text><text x="125" y="230" font-size="12" fill="#555" text-anchor="middle">D 레지스터를 처리</text>
<rect x="300" y="60" width="200" height="190" fill="#FBE5D6" stroke="#C55A11" stroke-width="2"/>
<text x="400" y="84" font-size="15" font-weight="bold" fill="#C55A11" text-anchor="middle">특수모듈 (A/D·D/A 등)</text>
<text x="400" y="104" font-size="12" fill="#555" text-anchor="middle">버퍼 메모리 (모듈 자체 메모리)</text>
<rect x="320" y="114" width="160" height="30" fill="#fff" stroke="#C55A11"/><text x="400" y="134" font-size="13" fill="#333" text-anchor="middle">CH1 변환된 디지털 값</text>
<rect x="320" y="150" width="160" height="30" fill="#fff" stroke="#C55A11"/><text x="400" y="170" font-size="13" fill="#333" text-anchor="middle">CH2 출력할 디지털 값</text>
<rect x="320" y="186" width="160" height="30" fill="#fff" stroke="#C55A11"/><text x="400" y="206" font-size="13" fill="#333" text-anchor="middle">설정·상태(Ready)</text>
<line x1="298" y1="128" x2="222" y2="128" stroke="#C55A11" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="222" y1="162" x2="298" y2="162" stroke="#333" stroke-width="2.5" marker-end="url(#b)"/>
<text x="260" y="112" font-size="13" font-weight="bold" fill="#C55A11" text-anchor="middle">읽기</text><text x="260" y="146" font-size="11" fill="#C55A11" text-anchor="middle">GET / FROM</text>
<text x="260" y="182" font-size="13" font-weight="bold" fill="#333" text-anchor="middle">쓰기</text><text x="260" y="198" font-size="11" fill="#333" text-anchor="middle">PUT / TO</text>
<rect x="580" y="90" width="120" height="50" fill="#fff" stroke="#555"/><text x="640" y="112" font-size="13" fill="#333" text-anchor="middle">센서 4~20 mA</text><text x="640" y="128" font-size="11" fill="#555" text-anchor="middle">입력(A/D)</text>
<rect x="580" y="170" width="120" height="50" fill="#fff" stroke="#555"/><text x="640" y="192" font-size="13" fill="#333" text-anchor="middle">인버터 0~10 V</text><text x="640" y="208" font-size="11" fill="#555" text-anchor="middle">출력(D/A)</text>
<line x1="578" y1="115" x2="502" y2="115" stroke="#333" stroke-width="2.5" marker-end="url(#b)"/>
<line x1="502" y1="195" x2="578" y2="195" stroke="#333" stroke-width="2.5" marker-end="url(#b)"/>
<text x="360" y="284" font-size="13" fill="#555" text-anchor="middle">CPU는 입출력 접점이 아니라 버퍼 메모리를 읽고 써서 모듈과 데이터를 주고받는다</text>
</svg>