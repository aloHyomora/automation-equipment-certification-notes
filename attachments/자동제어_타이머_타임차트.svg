<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
  <rect width="720" height="330" fill="#ffffff"/>
  <text x="360" y="26" font-size="16" font-weight="bold" fill="#2F5597" text-anchor="middle">TON(ON 딜레이)과 TOFF(OFF 딜레이) 타임차트</text>
  <g stroke="#bbb" stroke-width="1" stroke-dasharray="4 4">
    <line x1="140" y1="45" x2="140" y2="300"/><line x1="210" y1="45" x2="210" y2="300"/>
    <line x1="320" y1="45" x2="320" y2="300"/><line x1="390" y1="45" x2="390" y2="300"/>
    <line x1="450" y1="45" x2="450" y2="300"/><line x1="520" y1="45" x2="520" y2="300"/>
  </g>
  <g font-size="14" font-weight="bold" fill="#333">
    <text x="20" y="80">입력</text><text x="20" y="165">TON 출력</text><text x="20" y="250">TOFF 출력</text>
  </g>
  <!-- input -->
  <polyline points="100,95 140,95 140,60 320,60 320,95 410,95 410,60 450,60 450,95 600,95" fill="none" stroke="#2F5597" stroke-width="3"/>
  <!-- TON -->
  <polyline points="100,180 210,180 210,145 320,145 320,180 600,180" fill="none" stroke="#C55A11" stroke-width="3"/>
  <!-- TOFF -->
  <polyline points="100,265 140,265 140,230 390,230 390,265 410,265 410,230 520,230 520,265 600,265" fill="none" stroke="#548235" stroke-width="3"/>
  <!-- delay arrows -->
  <line x1="140" y1="195" x2="210" y2="195" stroke="#C00000" stroke-width="2"/>
  <text x="175" y="212" font-size="12" fill="#C00000" text-anchor="middle">T 지연</text>
  <line x1="320" y1="280" x2="390" y2="280" stroke="#C00000" stroke-width="2"/>
  <text x="355" y="296" font-size="12" fill="#C00000" text-anchor="middle">T 지연</text>
  <line x1="450" y1="280" x2="520" y2="280" stroke="#C00000" stroke-width="2"/>
  <text x="485" y="296" font-size="12" fill="#C00000" text-anchor="middle">T 지연</text>
  <text x="430" y="132" font-size="12" fill="#555" text-anchor="middle">짧은 입력(&lt; T)은 TON 출력 안 됨</text>
  <text x="620" y="164" font-size="12" fill="#555">입력이 꺼지면</text><text x="620" y="180" font-size="12" fill="#555">즉시 OFF</text>
  <text x="620" y="245" font-size="12" fill="#555">입력이 켜지면</text><text x="620" y="261" font-size="12" fill="#555">즉시 ON</text>
</svg>
