<text x="358" y="200" font-size="13" fill="#555" text-anchor="end" font-weight="normal">Tₛ 이완측</text>
<text x="450" y="318" font-size="14" fill="#222" text-anchor="middle" font-weight="bold">Tₜ / Tₛ = e^(μθ),  제동력 f = Tₜ − Tₛ</text>
<text x="450" y="338" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">띠를 넓게 감아(θ 큼) 큰 제동력</text>
