<text x="150" y="234" font-size="14" fill="#C00000" text-anchor="middle" font-weight="bold">f = μW</text>
<text x="140" y="310" font-size="14" fill="#222" text-anchor="middle" font-weight="bold">T = f · D/2 = μW · D/2</text>
<text x="140" y="330" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">레버로 F를 키워 W로 누른다</text>
