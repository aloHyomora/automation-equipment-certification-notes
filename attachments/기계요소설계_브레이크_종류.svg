<text x="760" y="326" font-size="13" fill="#C00000" text-anchor="middle" font-weight="bold">→ 정전돼도 축이 멈춘다</text>
<text x="760" y="344" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">(서보 모터 수직축 낙하 방지)</text>

