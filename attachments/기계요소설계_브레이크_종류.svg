<path d="M 395 120 A 40 40 0 0 1 465 120" fill="none" stroke="#548235" stroke-width="2.5" marker-end="url(#ag)"/>
<path d="M 366 245 L 366 140 A 64 64 0 0 1 494 140 L 494 245" fill="none" stroke="#333" stroke-width="5"/>
<line x1="355" y1="248" x2="585" y2="248" stroke="#333" stroke-width="7" stroke-linecap="round"/>
