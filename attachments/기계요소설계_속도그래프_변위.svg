<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C00000"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#548235"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5597"/></marker>
<marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
</defs>
<rect width="900" height="390" fill="#ffffff"/>
<text x="450" y="28" font-size="18" fill="#548235" text-anchor="middle" font-weight="bold">등가속도 운동의 v–t 그래프(왼쪽)와 거리·변위(오른쪽)</text>
<line x1="470" y1="45" x2="470" y2="375" stroke="#BFBFBF"/>
<!-- LEFT graph origin (80,310) -->
<line x1="80" y1="310" x2="430" y2="310" stroke="#333" stroke-width="1.5" marker-end="url(#ax)"/>
<line x1="80" y1="310" x2="80" y2="60" stroke="#333" stroke-width="1.5" marker-end="url(#ax)"/>
<text x="436" y="314" font-size="14">t</text><text x="72" y="56" font-size="14" text-anchor="end">v</text>
<path d="M80,250 L380,110 L380,310 L80,310 Z" fill="#E2F0D9"/>
<line x1="80" y1="250" x2="380" y2="250" stroke="#548235" stroke-dasharray="4,4"/>
<line x1="80" y1="250" x2="380" y2="110" stroke="#548235" stroke-width="3"/>
<line x1="380" y1="110" x2="380" y2="310" stroke="#999" stroke-dasharray="3,3"/>
<line x1="80" y1="110" x2="380" y2="110" stroke="#999" stroke-dasharray="3,3"/>
<text x="72" y="255" font-size="14" text-anchor="end">v₀</text>
<text x="72" y="115" font-size="14" text-anchor="end">v</text>
<text x="380" y="330" font-size="14" text-anchor="middle">t</text>
<!-- slope triangle -->
<path d="M200,194 L290,194 L290,152" fill="none" stroke="#C00000" stroke-width="1.5"/>
<text x="245" y="212" font-size="12" fill="#C00000" text-anchor="middle">Δt</text>
<text x="296" y="178" font-size="12" fill="#C00000">Δv</text>
<text x="160" y="150" font-size="14" fill="#C00000" font-weight="bold">기울기 = 가속도 a</text>
<text x="230" y="282" font-size="14" fill="#548235" font-weight="bold" text-anchor="middle">넓이 = 이동 거리 s</text>
<text x="240" y="355" font-size="14" text-anchor="middle">v = v₀ + at,  s = v₀t + ½at²</text>
<text x="240" y="377" font-size="12" text-anchor="middle">(직사각형 v₀t + 삼각형 ½·t·at)</text>
<!-- RIGHT displacement vs distance, 10 px/m, start x=530 -->
<line x1="510" y1="210" x2="880" y2="210" stroke="#7F7F7F" stroke-width="2"/>
<g font-size="12" fill="#555" text-anchor="middle">
<line x1="530" y1="204" x2="530" y2="216" stroke="#555"/><text x="530" y="232">0</text>
<line x1="630" y1="204" x2="630" y2="216" stroke="#555"/><text x="630" y="232">10</text>
<line x1="730" y1="204" x2="730" y2="216" stroke="#555"/><text x="730" y="232">20</text>
<line x1="830" y1="204" x2="830" y2="216" stroke="#555"/><text x="830" y="232">30 m</text>
</g>
<circle cx="530" cy="210" r="7" fill="#548235"/><text x="530" y="192" font-size="13" text-anchor="middle" font-weight="bold">출발</text>
<circle cx="730" cy="210" r="7" fill="#C00000"/><text x="730" y="192" font-size="13" text-anchor="middle" font-weight="bold" fill="#C00000">도착</text>
<path d="M530,100 L830,100" stroke="#548235" stroke-width="2.5" marker-end="url(#ag)" fill="none"/>
<text x="680" y="90" font-size="13" text-anchor="middle" fill="#548235">① 동쪽으로 30 m</text>
<path d="M830,130 L732,130" stroke="#548235" stroke-width="2.5" marker-end="url(#ag)" fill="none"/>
<text x="781" y="152" font-size="13" text-anchor="middle" fill="#548235">② 되돌아 10 m</text>
<path d="M530,258 L728,258" stroke="#2F5597" stroke-width="3" marker-end="url(#ab)" fill="none"/>
<text x="630" y="278" font-size="13" text-anchor="middle" fill="#2F5597" font-weight="bold">변위 = 20 m (동쪽)</text>
<g font-size="14">
<text x="510" y="308">이동 거리 = 30 + 10 = <tspan fill="#548235" font-weight="bold">40 m</tspan> (스칼라)</text>
<text x="510" y="327">변위 = 시작점 → 끝점 = <tspan fill="#2F5597" font-weight="bold">20 m</tspan> (벡터)</text>
<text x="510" y="355">10초 걸렸다면</text>
<text x="510" y="377">평균 속력 4 m/s, <tspan fill="#C00000" font-weight="bold">평균 속도 2 m/s</tspan></text>
</g>
</svg>
