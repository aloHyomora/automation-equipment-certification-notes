<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
  <rect width="720" height="420" fill="#ffffff"/>
  <text x="360" y="28" font-size="17" font-weight="bold" fill="#2F5597" text-anchor="middle">V/f 일정 제어: 출력 전압과 주파수의 관계</text>

  <!-- region shading -->
  <rect x="90" y="60" width="300" height="270" fill="#F3F6FB"/>
  <rect x="390" y="60" width="240" height="270" fill="#FDF2F2"/>
  <text x="240" y="82" font-size="14" font-weight="bold" fill="#2F5597" text-anchor="middle">정토크 영역</text>
  <text x="240" y="100" font-size="12" fill="#2F5597" text-anchor="middle">V/f 일정 → 자속 일정 → 토크 일정</text>
  <text x="510" y="82" font-size="14" font-weight="bold" fill="#C00000" text-anchor="middle">정출력 영역</text>
  <text x="510" y="100" font-size="12" fill="#C00000" text-anchor="middle">전압 상한 → 자속 감소(약계자)</text>

  <!-- axes -->
  <line x1="90" y1="330" x2="660" y2="330" stroke="#333" stroke-width="1.8"/>
  <line x1="90" y1="330" x2="90" y2="50" stroke="#333" stroke-width="1.8"/>
  <polygon points="660,330 650,325 650,335" fill="#333"/>
  <polygon points="90,50 85,60 95,60" fill="#333"/>
  <text x="80" y="58" font-size="14" fill="#333" text-anchor="end">V</text>
  <text x="668" y="335" font-size="14" fill="#333">f</text>

  <!-- V/f line -->
  <polyline points="90,330 390,150 630,150" fill="none" stroke="#2F5597" stroke-width="3.5"/>
  <!-- torque boost -->
  <polyline points="90,300 160,288" fill="none" stroke="#C00000" stroke-width="2.5" stroke-dasharray="6 4"/>
  <line x1="160" y1="288" x2="190" y2="270" stroke="#C00000" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="200" y="300" font-size="13" fill="#C00000" font-weight="bold">토크 부스트</text>
  <text x="200" y="316" font-size="12" fill="#C00000">(저속에서 전압을 조금 더)</text>

  <!-- rated voltage -->
  <line x1="90" y1="150" x2="390" y2="150" stroke="#888" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="84" y="155" font-size="13" fill="#333" text-anchor="end">정격</text>
  <text x="84" y="171" font-size="13" fill="#333" text-anchor="end">전압</text>
  <!-- base freq -->
  <line x1="390" y1="150" x2="390" y2="330" stroke="#888" stroke-width="1" stroke-dasharray="3 3"/>
  <circle cx="390" cy="150" r="5" fill="#C00000"/>
  <text x="390" y="352" font-size="13" fill="#333" text-anchor="middle">기저 주파수</text>
  <text x="390" y="368" font-size="12" fill="#333" text-anchor="middle">(예: 60 Hz)</text>
  <text x="630" y="352" font-size="13" fill="#333" text-anchor="middle">최고 주파수</text>
  <line x1="630" y1="325" x2="630" y2="335" stroke="#333" stroke-width="1.5"/>
  <text x="90" y="352" font-size="13" fill="#333" text-anchor="middle">0</text>

  <!-- example points -->
  <circle cx="240" cy="240" r="4" fill="#2F5597"/>
  <text x="252" y="262" font-size="12" fill="#2F5597">30 Hz → 정격의 50 % 전압</text>

  <text x="360" y="400" font-size="13" fill="#333" text-anchor="middle">자속 Φ ∝ V / f — 주파수만 낮추고 전압을 그대로 두면 자속이 커져 과전류·과열(자기 포화)</text>
</svg>
