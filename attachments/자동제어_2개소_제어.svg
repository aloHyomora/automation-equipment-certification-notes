<text x="420" y="300" font-size="12" fill="#2F5597" text-anchor="start" font-weight="bold">병렬: 어느 쪽을 눌러도 기동</text>
<rect x="40" y="340" width="660" height="50" fill="#F2F2F2" stroke="#bbb"/>
<text x="52" y="362" font-size="12.5" fill="#333" text-anchor="start">정지는 '하나라도 열리면 끊김'(AND 조건) → 직렬, 기동은 '하나라도 닫히면 연결'(OR 조건) → 병렬.</text>
<text x="52" y="380" font-size="12.5" fill="#333" text-anchor="start">3개소 이상도 같은 규칙: 정지 b접점을 줄줄이 직렬로, 기동 a접점을 나란히 병렬로 더한다.</text>
</svg>
