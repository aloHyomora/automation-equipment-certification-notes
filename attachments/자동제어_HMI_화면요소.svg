<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
  <rect width="800" height="470" fill="#ffffff"/>
  <text x="400" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">HMI 화면의 그래픽 요소 8가지 (예시 화면)</text>
  <!-- screen bezel -->
  <rect x="20" y="40" width="760" height="420" rx="14" fill="#3A3A3A"/>
  <rect x="35" y="55" width="730" height="390" rx="4" fill="#F4F6F9"/>
  <rect x="35" y="55" width="730" height="30" fill="#2F5597"/>
  <text x="50" y="76" font-size="14" fill="#fff" font-weight="bold">공정 모니터링 - 탱크 라인</text>
  <!-- 8 data display: date/time -->
  <text x="750" y="76" text-anchor="end" font-size="13" fill="#fff" font-family="Consolas, monospace">2026-11-24 09:30:15</text>
  <text x="750" y="100" text-anchor="end" font-size="11" fill="#C00000" font-weight="bold">⑦ 데이터 표시계 (날짜·시간)</text>

  <!-- 1 general buttons -->
  <rect x="55" y="110" width="80" height="40" rx="6" fill="#70AD47" stroke="#333"/><text x="95" y="135" text-anchor="middle" font-size="14" fill="#fff">운전</text>
  <rect x="145" y="110" width="80" height="40" rx="6" fill="#C00000" stroke="#333"/><text x="185" y="135" text-anchor="middle" font-size="14" fill="#fff">정지</text>
  <text x="55" y="168" font-size="11" fill="#C00000" font-weight="bold">① 일반 버튼 (ON/OFF)</text>

  <!-- 2 multi button -->
  <rect x="55" y="185" width="56" height="34" rx="4" fill="#2F5597"/><text x="83" y="207" text-anchor="middle" font-size="12" fill="#fff">자동</text>
  <rect x="113" y="185" width="56" height="34" rx="4" fill="#fff" stroke="#2F5597"/><text x="141" y="207" text-anchor="middle" font-size="12" fill="#2F5597">반자동</text>
  <rect x="171" y="185" width="56" height="34" rx="4" fill="#fff" stroke="#2F5597"/><text x="199" y="207" text-anchor="middle" font-size="12" fill="#2F5597">수동</text>
  <text x="55" y="237" font-size="11" fill="#C00000" font-weight="bold">② 다중 버튼 (운전 모드 선택)</text>

  <!-- 3 set value button -->
  <rect x="55" y="255" width="40" height="34" rx="4" fill="#ddd" stroke="#333"/><text x="75" y="278" text-anchor="middle" font-size="16" fill="#222">−</text>
  <rect x="100" y="255" width="80" height="34" rx="2" fill="#fff" stroke="#333"/><text x="140" y="278" text-anchor="middle" font-size="14" fill="#222" font-family="Consolas, monospace">75.0 ℃</text>
  <rect x="185" y="255" width="40" height="34" rx="4" fill="#ddd" stroke="#333"/><text x="205" y="278" text-anchor="middle" font-size="16" fill="#222">+</text>
  <text x="55" y="307" font-size="11" fill="#C00000" font-weight="bold">③ 설정값 버튼 (상수 입력·증감)</text>

  <!-- 4 lamps -->
  <circle cx="75" cy="345" r="15" fill="#70AD47" stroke="#333"/><text x="75" y="378" text-anchor="middle" font-size="11" fill="#222">펌프</text>
  <circle cx="125" cy="345" r="15" fill="#bbb" stroke="#333"/><text x="125" y="378" text-anchor="middle" font-size="11" fill="#222">히터</text>
  <circle cx="175" cy="345" r="15" fill="#FFC000" stroke="#333"/><text x="175" y="378" text-anchor="middle" font-size="11" fill="#222">경고</text>
  <text x="55" y="400" font-size="11" fill="#C00000" font-weight="bold">④ 램프 (이미지로 출력 상태)</text>

  <!-- 8 status animation: tank + pump -->
  <rect x="290" y="120" width="110" height="160" rx="6" fill="#fff" stroke="#333" stroke-width="2"/>
  <rect x="292" y="190" width="106" height="88" fill="#9DC3E6"/>
  <text x="345" y="240" text-anchor="middle" font-size="12" fill="#1F3864">수위 55 %</text>
  <line x1="400" y1="260" x2="440" y2="260" stroke="#333" stroke-width="6"/>
  <circle cx="460" cy="260" r="20" fill="#70AD47" stroke="#333" stroke-width="2"/>
  <path d="M 450 252 L 472 260 L 450 268 z" fill="#fff"/>
  <line x1="480" y1="260" x2="520" y2="260" stroke="#333" stroke-width="6"/>
  <text x="345" y="300" text-anchor="middle" font-size="11" fill="#C00000" font-weight="bold">⑧ 상태 표시 (애니메이션)</text>
  <text x="345" y="315" text-anchor="middle" font-size="10" fill="#666">수위가 차오르고 펌프가 돈다</text>

  <!-- 5 gauge -->
  <path d="M 285 410 A 55 55 0 0 1 395 410" fill="none" stroke="#2F5597" stroke-width="8"/>
  <path d="M 375 372 A 55 55 0 0 1 395 410" fill="none" stroke="#C00000" stroke-width="8"/>
  <line x1="340" y1="410" x2="312" y2="372" stroke="#222" stroke-width="3"/>
  <circle cx="340" cy="410" r="5" fill="#222"/>
  <text x="340" y="432" text-anchor="middle" font-size="12" fill="#222" font-family="Consolas, monospace">3.2 bar</text>
  <text x="420" y="390" font-size="11" fill="#C00000" font-weight="bold">⑤ 계기</text>
  <text x="420" y="405" font-size="10" fill="#666">숫자·다이얼</text>

  <!-- 6 trend graph -->
  <rect x="540" y="115" width="210" height="160" fill="#fff" stroke="#333"/>
  <line x1="540" y1="145" x2="750" y2="145" stroke="#C00000" stroke-dasharray="5 3"/>
  <text x="745" y="140" text-anchor="end" font-size="10" fill="#C00000">상한</text>
  <line x1="540" y1="250" x2="750" y2="250" stroke="#C00000" stroke-dasharray="5 3"/>
  <text x="745" y="265" text-anchor="end" font-size="10" fill="#C00000">하한</text>
  <polyline points="545,225 570,215 595,220 620,195 645,190 670,170 695,180 720,165 745,172" fill="none" stroke="#2F5597" stroke-width="2.5"/>
  <text x="550" y="130" font-size="10" fill="#666">온도</text>
  <text x="745" y="290" text-anchor="end" font-size="10" fill="#666">시간 →</text>
  <text x="540" y="305" font-size="11" fill="#C00000" font-weight="bold">⑥ 트렌드 그래프 (현재값·상하한)</text>

  <!-- 7 data display numeric -->
  <rect x="540" y="330" width="210" height="80" rx="4" fill="#fff" stroke="#333"/>
  <text x="555" y="355" font-size="12" fill="#222">생산 수량</text><text x="740" y="355" text-anchor="end" font-size="13" fill="#222" font-family="Consolas, monospace">1,284 EA</text>
  <text x="555" y="380" font-size="12" fill="#222">불량 수</text><text x="740" y="380" text-anchor="end" font-size="13" fill="#C00000" font-family="Consolas, monospace">7 EA</text>
  <text x="555" y="402" font-size="12" fill="#222">모델</text><text x="740" y="402" text-anchor="end" font-size="13" fill="#222">TANK-A</text>
  <text x="540" y="428" font-size="11" fill="#C00000" font-weight="bold">⑦ 데이터 표시계 (숫자·문자)</text>
</svg>
