<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
  <rect x="0" y="0" width="760" height="330" fill="#ffffff"/>
  <text x="380" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2F5597">직선형 포텐셔미터: 위치 비율 = 전압 비율</text>
  <!-- resistive track -->
  <rect x="100" y="140" width="500" height="26" fill="#DEEBF7" stroke="#2F5597" stroke-width="2"/>
  <text x="85" y="158" text-anchor="end" font-size="14" fill="#333">0 V</text>
  <text x="615" y="158" font-size="14" fill="#333">10 V</text>
  <!-- supply bracket -->
  <line x1="100" y1="166" x2="100" y2="250" stroke="#333" stroke-width="2"/>
  <line x1="600" y1="166" x2="600" y2="250" stroke="#333" stroke-width="2"/>
  <line x1="100" y1="250" x2="330" y2="250" stroke="#333" stroke-width="2"/>
  <line x1="370" y1="250" x2="600" y2="250" stroke="#333" stroke-width="2"/>
  <line x1="330" y1="236" x2="330" y2="264" stroke="#333" stroke-width="2.5"/>
  <line x1="340" y1="242" x2="340" y2="258" stroke="#333" stroke-width="2.5"/>
  <line x1="340" y1="250" x2="370" y2="250" stroke="#333" stroke-width="2"/>
  <text x="335" y="285" text-anchor="middle" font-size="14" fill="#333">전원 10 V</text>
  <!-- wiper at 60% (x = 100 + 0.6*500 = 400) -->
  <polygon points="400,140 390,118 410,118" fill="#C00000"/>
  <line x1="400" y1="118" x2="400" y2="80" stroke="#C00000" stroke-width="2.5"/>
  <rect x="370" y="56" width="60" height="24" rx="4" fill="#C00000"/>
  <text x="400" y="73" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">슬라이더</text>
  <line x1="430" y1="68" x2="560" y2="68" stroke="#C00000" stroke-width="2"/>
  <circle cx="575" cy="68" r="15" fill="#fff" stroke="#C00000" stroke-width="2"/>
  <text x="575" y="73" text-anchor="middle" font-size="13" fill="#C00000" font-weight="bold">V</text>
  <text x="598" y="73" font-size="14" fill="#C00000" font-weight="bold">출력 6 V</text>
  <text x="598" y="92" font-size="11" fill="#C00000">(0 V 단자 기준)</text>
  <!-- distance dimension -->
  <line x1="100" y1="195" x2="400" y2="195" stroke="#2F5597" stroke-width="1.5"/>
  <polygon points="100,195 110,190 110,200" fill="#2F5597"/>
  <polygon points="400,195 390,190 390,200" fill="#2F5597"/>
  <text x="250" y="215" text-anchor="middle" font-size="14" fill="#2F5597" font-weight="bold">180 mm (60 %)</text>
  <line x1="400" y1="195" x2="600" y2="195" stroke="#999" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="500" y="215" text-anchor="middle" font-size="13" fill="#999">전체 스트로크 300 mm</text>
  <text x="380" y="315" text-anchor="middle" font-size="15" fill="#C00000" font-weight="bold">x = 300 mm × (6 V / 10 V) = 180 mm</text>
</svg>
