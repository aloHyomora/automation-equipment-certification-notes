<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
  <rect width="640" height="320" rx="16" fill="#fff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#444"/></marker></defs>
  <!-- stack container -->
  <path d="M230 70 V270 H410 V70" fill="none" stroke="#444" stroke-width="3"/>
  <rect x="240" y="216" width="160" height="44" rx="6" fill="#EAF0FA" stroke="#2F5597"/>
  <text x="320" y="244" font-size="16" text-anchor="middle" fill="#222">A (처음 넣음)</text>
  <rect x="240" y="166" width="160" height="44" rx="6" fill="#EAF0FA" stroke="#2F5597"/>
  <text x="320" y="194" font-size="16" text-anchor="middle" fill="#222">B</text>
  <rect x="240" y="116" width="160" height="44" rx="6" fill="#FBE5E5" stroke="#C00000" stroke-width="2"/>
  <text x="320" y="144" font-size="16" text-anchor="middle" fill="#C00000" font-weight="bold">C (마지막에 넣음)</text>
  <!-- push -->
  <path d="M168 40 Q 210 40 270 104" fill="none" stroke="#2F5597" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="160" y="45" font-size="15" fill="#2F5597" font-weight="bold" text-anchor="end">PUSH (넣기)</text>
  <!-- pop -->
  <path d="M370 104 Q 440 40 500 40" fill="none" stroke="#C00000" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="508" y="45" font-size="15" fill="#C00000" font-weight="bold">POP (꺼내기)</text>
  <!-- SP -->
  <line x1="520" y1="138" x2="412" y2="138" stroke="#548235" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="526" y="136" font-size="13" fill="#548235" font-weight="bold">스택 포인터</text>
  <text x="526" y="153" font-size="12" fill="#548235">(맨 위 위치)</text>
  <text x="320" y="300" font-size="14" text-anchor="middle" fill="#222">마지막에 넣은 C가 가장 먼저 나온다 → LIFO (Last In, First Out)</text>
</svg>
