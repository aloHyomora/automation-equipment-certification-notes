<text x="380.0" y="362.0" font-size="12" fill="#333" text-anchor="start">작용선 = 두 기초원의 공통 내접선.</text>
<text x="380.0" y="380.0" font-size="12" fill="#333" text-anchor="start">이 직선 위에서만 이가 닿고 힘이 전달된다.</text>
<text x="380.0" y="398.0" font-size="12" fill="#7F7F7F" text-anchor="start">1점 쇄선 = 피치원, 회색 점선 = 기초원(피치원 × cos α)</text>
