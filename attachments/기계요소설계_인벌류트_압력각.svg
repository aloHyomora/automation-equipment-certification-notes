<text x="20.0" y="100.0" font-size="12" fill="#2F5597" text-anchor="start">풀린 실(파랑) = 기초원에 접선</text>
<text x="20.0" y="380.0" font-size="12" fill="#333" text-anchor="start">실의 길이 = 풀려 나온 호의 길이.</text>
<text x="20.0" y="398.0" font-size="12" fill="#333" text-anchor="start">치면이 늘 접선에 수직 → 힘 방향 일정</text>
<text x="575.0" y="62.0" font-size="13" fill="#548235" text-anchor="middle" font-weight="bold">(b) 작용선과 압력각</text>
