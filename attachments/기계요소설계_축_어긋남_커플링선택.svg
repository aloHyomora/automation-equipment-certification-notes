<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 320" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<rect width="840" height="320" fill="#ffffff"/>
<text x="420" y="28" font-size="17" fill="#548235" text-anchor="middle" font-weight="bold">두 축이 어떻게 놓였나 → 어떤 축 이음을 쓰나</text>
<g stroke="#d9d9d9"><line x1="210" y1="48" x2="210" y2="305"/><line x1="420" y1="48" x2="420" y2="305"/><line x1="630" y1="48" x2="630" y2="305"/></g>
<!-- 1 일직선 -->
<text x="105" y="72" font-size="15" fill="#262626" text-anchor="middle" font-weight="bold">① 일직선 (동심)</text>
<line x1="15" y1="160" x2="195" y2="160" stroke="#7f7f7f" stroke-dasharray="12,3,2,3"/>
<rect x="20" y="148" width="80" height="24" fill="#d9d9d9" stroke="#595959"/>
<rect x="110" y="148" width="80" height="24" fill="#d9d9d9" stroke="#595959"/>
<text x="105" y="210" font-size="12" fill="#595959" text-anchor="middle">중심선이 한 줄</text>
<text x="105" y="250" font-size="14" fill="#548235" text-anchor="middle" font-weight="bold">플랜지 · 머프</text>
<text x="105" y="270" font-size="12" fill="#262626" text-anchor="middle">(고정 커플링)</text>
<!-- 2 약간 어긋남 -->
<text x="315" y="72" font-size="15" fill="#262626" text-anchor="middle" font-weight="bold">② 조금 어긋남</text>
<line x1="225" y1="160" x2="315" y2="160" stroke="#7f7f7f" stroke-dasharray="12,3,2,3"/>
<rect x="230" y="148" width="80" height="24" fill="#d9d9d9" stroke="#595959"/>
<g transform="rotate(-4 320 165)"><line x1="315" y1="165" x2="405" y2="165" stroke="#7f7f7f" stroke-dasharray="12,3,2,3"/><rect x="320" y="153" width="80" height="24" fill="#d9d9d9" stroke="#595959"/></g>
<text x="315" y="210" font-size="12" fill="#595959" text-anchor="middle">조립 오차·열팽창·진동</text>
<text x="315" y="250" font-size="14" fill="#548235" text-anchor="middle" font-weight="bold">플렉시블 · 기어</text>
<text x="315" y="270" font-size="12" fill="#262626" text-anchor="middle">서보용: 디스크·벨로즈·조</text>
<!-- 3 평행 편심 -->
<text x="525" y="72" font-size="15" fill="#262626" text-anchor="middle" font-weight="bold">③ 평행, 중심 어긋남</text>
<line x1="435" y1="150" x2="520" y2="150" stroke="#7f7f7f" stroke-dasharray="12,3,2,3"/>
<line x1="530" y1="174" x2="615" y2="174" stroke="#7f7f7f" stroke-dasharray="12,3,2,3"/>
<rect x="440" y="138" width="80" height="24" fill="#d9d9d9" stroke="#595959"/>
<rect x="530" y="162" width="80" height="24" fill="#d9d9d9" stroke="#595959"/>
<line x1="525" y1="150" x2="525" y2="174" stroke="#C00000" stroke-width="2"/>
<text x="514" y="194" font-size="13" fill="#C00000" font-weight="bold">e</text>
<text x="525" y="216" font-size="12" fill="#595959" text-anchor="middle">두 축이 나란하지만 비켜 있음</text>
<text x="525" y="250" font-size="14" fill="#548235" text-anchor="middle" font-weight="bold">올덤 커플링</text>
<text x="525" y="270" font-size="12" fill="#262626" text-anchor="middle">(고속 부적합)</text>
<!-- 4 교차 -->
<text x="735" y="72" font-size="15" fill="#262626" text-anchor="middle" font-weight="bold">④ 교차 (각도)</text>
<line x1="645" y1="160" x2="735" y2="160" stroke="#7f7f7f" stroke-dasharray="12,3,2,3"/>
<rect x="650" y="148" width="78" height="24" fill="#d9d9d9" stroke="#595959"/>
<g transform="rotate(-25 735 160)"><line x1="735" y1="160" x2="830" y2="160" stroke="#7f7f7f" stroke-dasharray="12,3,2,3"/><rect x="742" y="148" width="78" height="24" fill="#d9d9d9" stroke="#595959"/></g>
<circle cx="735" cy="160" r="6" fill="#C00000"/>
<path d="M775,160 A 40 40 0 0 0 771.3,143.1" fill="none" stroke="#C00000" stroke-width="1.5"/>
<text x="782" y="156" font-size="12" fill="#C00000">α</text>
<text x="735" y="210" font-size="12" fill="#595959" text-anchor="middle">중심선이 한 점에서 만남</text>
<text x="735" y="250" font-size="14" fill="#548235" text-anchor="middle" font-weight="bold">유니버설 조인트</text>
<text x="735" y="270" font-size="12" fill="#262626" text-anchor="middle">α 는 보통 30° 이하</text>
<text x="420" y="304" font-size="12" fill="#C00000" text-anchor="middle">운전 중에 끊고 이어야 하면 → 클러치 (커플링은 운전 중 분리 불가)</text>
</svg>
