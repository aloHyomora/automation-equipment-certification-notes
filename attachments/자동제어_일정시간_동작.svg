<text x="490" y="406" font-size="11.5" fill="#C00000" text-anchor="start">T 경과 → 순간 열림 → X OFF → 타이머 복귀</text>
<text x="380" y="528" font-size="12" fill="#2F5597" text-anchor="middle">비교: 지연 동작(ON 딜레이)은 '누른 뒤 T 후에 켜짐', 일정 시간 동작은 '즉시 켜지고 T 후에 꺼짐'</text>
