<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
  <rect width="720" height="410" fill="#ffffff"/>
  <text x="360" y="28" font-size="17" font-weight="bold" fill="#2F5597" text-anchor="middle">팬·펌프의 상사 법칙: 속도를 조금만 줄여도 동력은 크게 준다</text>

  <!-- grid -->
  <g stroke="#eee" stroke-width="1">
    <line x1="90" y1="80" x2="590" y2="80"/><line x1="90" y1="142.5" x2="590" y2="142.5"/>
    <line x1="90" y1="205" x2="590" y2="205"/><line x1="90" y1="267.5" x2="590" y2="267.5"/>
    <line x1="215" y1="80" x2="215" y2="330"/><line x1="340" y1="80" x2="340" y2="330"/>
    <line x1="465" y1="80" x2="465" y2="330"/>
  </g>
  <!-- axes -->
  <line x1="90" y1="330" x2="610" y2="330" stroke="#333" stroke-width="1.8"/>
  <line x1="90" y1="330" x2="90" y2="60" stroke="#333" stroke-width="1.8"/>
  <g font-size="12" fill="#333" text-anchor="end">
    <text x="82" y="334">0</text><text x="82" y="271">25 %</text><text x="82" y="209">50 %</text><text x="82" y="146">75 %</text><text x="82" y="84">100 %</text>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="90" y="348">0</text><text x="215" y="348">25 %</text><text x="340" y="348">50 %</text><text x="465" y="348">75 %</text><text x="590" y="348">100 %</text>
  </g>
  <text x="340" y="370" font-size="13" fill="#333" text-anchor="middle">회전 속도 N (정격 대비)</text>

  <!-- curves -->
  <polyline fill="none" stroke="#2F5597" stroke-width="2.5" points="90,330.0 140,305.0 190,280.0 240,255.0 290,230.0 340,205.0 390,180.0 440,155.0 490,130.0 540,105.0 590,80.0"/>
  <polyline fill="none" stroke="#2F5597" stroke-width="2.5" stroke-dasharray="7 4" points="90,330.0 115,329.4 140,327.5 165,324.4 190,320.0 215,314.4 240,307.5 265,299.4 290,290.0 315,279.4 340,267.5 365,254.4 390,240.0 415,224.4 440,207.5 465,189.4 490,170.0 515,149.4 540,127.5 565,104.4 590,80.0"/>
  <polyline fill="none" stroke="#C00000" stroke-width="3.5" points="90,330.0 140,329.8 190,328.0 240,323.2 290,314.0 315,307.2 340,298.8 365,288.4 390,276.0 415,261.3 440,244.2 465,224.5 490,202.0 515,176.5 540,147.7 565,115.7 590,80.0"/>

  <!-- labels -->
  <text x="600" y="78" font-size="13" fill="#333">← 100 %</text>
  <rect x="105" y="92" width="170" height="78" rx="5" fill="#ffffff" stroke="#ccc"/>
  <line x1="115" y1="110" x2="145" y2="110" stroke="#2F5597" stroke-width="2.5"/>
  <text x="152" y="115" font-size="13" fill="#2F5597" font-weight="bold">유량 Q ∝ N</text>
  <line x1="115" y1="133" x2="145" y2="133" stroke="#2F5597" stroke-width="2.5" stroke-dasharray="7 4"/>
  <text x="152" y="138" font-size="13" fill="#2F5597" font-weight="bold">압력 H ∝ N²</text>
  <line x1="115" y1="156" x2="145" y2="156" stroke="#C00000" stroke-width="3.5"/>
  <text x="152" y="161" font-size="13" fill="#C00000" font-weight="bold">축동력 P ∝ N³</text>

  <!-- 80% marker -->
  <line x1="490" y1="330" x2="490" y2="130" stroke="#888" stroke-width="1" stroke-dasharray="3 3"/>
  <circle cx="490" cy="130" r="4" fill="#2F5597"/>
  <circle cx="490" cy="170" r="4" fill="#2F5597"/>
  <circle cx="490" cy="202" r="5" fill="#C00000"/>
  <rect x="505" y="215" width="200" height="72" rx="6" fill="#FDF2F2" stroke="#C00000" stroke-width="1.2"/>
  <text x="605" y="236" font-size="13" fill="#C00000" text-anchor="middle" font-weight="bold">속도 80 %일 때</text>
  <text x="605" y="255" font-size="12" fill="#333" text-anchor="middle">유량 80 %, 압력 64 %</text>
  <text x="605" y="274" font-size="12" fill="#C00000" text-anchor="middle">동력 0.8³ ≈ 51 % (약 절반)</text>

  <text x="360" y="398" font-size="13" fill="#333" text-anchor="middle">댐퍼·밸브로 유량을 줄이면 모터는 그대로 돌지만, 인버터로 속도를 줄이면 동력이 세제곱으로 준다</text>
</svg>
