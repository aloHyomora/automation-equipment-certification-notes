<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<defs>
<marker id="r" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#C00000"/></marker>
<marker id="t" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 z" fill="#333"/></marker>
</defs>
<rect width="780" height="420" fill="#ffffff"/>
<text x="390" y="28" font-size="17" font-weight="bold" fill="#2F5597" text-anchor="middle">DC 3선식 센서의 출력 형식 (빨간 화살표 = 부하 전류)</text>

<!-- ===== NPN (left) ===== -->
<text x="195" y="62" font-size="15" font-weight="bold" fill="#2F5597" text-anchor="middle">NPN 출력 (싱크형)</text>
<rect x="30" y="80" width="150" height="260" rx="6" fill="#F2F2F2" stroke="#595959" stroke-width="2"/>
<text x="105" y="100" font-size="12" fill="#333" text-anchor="middle">센서 내부</text>
<!-- wires -->
<line x1="180" y1="120" x2="330" y2="120" stroke="#8B4513" stroke-width="3"/>
<line x1="180" y1="210" x2="330" y2="210" stroke="#222" stroke-width="3"/>
<line x1="180" y1="310" x2="330" y2="310" stroke="#1F5FBF" stroke-width="3"/>
<text x="200" y="113" font-size="12" fill="#8B4513">갈색 +V</text>
<text x="200" y="203" font-size="12" fill="#222">흑색 출력</text>
<text x="200" y="303" font-size="12" fill="#1F5FBF">청색 0 V</text>
<!-- internal circuit -->
<rect x="45" y="110" width="70" height="30" fill="#DEEBF7" stroke="#2F5597"/>
<text x="80" y="130" font-size="11" fill="#2F5597" text-anchor="middle">검출 회로</text>
<line x1="115" y1="120" x2="180" y2="120" stroke="#333" stroke-width="1.5"/>
<!-- NPN transistor: collector up to output, emitter down to 0V -->
<circle cx="140" cy="250" r="22" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<line x1="132" y1="236" x2="132" y2="264" stroke="#333" stroke-width="2.5"/>
<line x1="132" y1="244" x2="150" y2="232" stroke="#333" stroke-width="1.5"/>
<line x1="132" y1="256" x2="150" y2="268" stroke="#333" stroke-width="1.5" marker-end="url(#t)"/>
<line x1="80" y1="140" x2="80" y2="250" stroke="#333" stroke-width="1.5"/>
<line x1="80" y1="250" x2="132" y2="250" stroke="#333" stroke-width="1.5"/>
<line x1="150" y1="232" x2="150" y2="210" stroke="#333" stroke-width="1.5"/>
<line x1="150" y1="210" x2="180" y2="210" stroke="#333" stroke-width="1.5"/>
<line x1="150" y1="268" x2="150" y2="310" stroke="#333" stroke-width="1.5"/>
<line x1="150" y1="310" x2="180" y2="310" stroke="#333" stroke-width="1.5"/>
<!-- load between +V and output -->
<line x1="330" y1="120" x2="330" y2="140" stroke="#333" stroke-width="2"/>
<rect x="312" y="140" width="36" height="50" fill="#FFF2CC" stroke="#BF9000" stroke-width="2"/>
<text x="330" y="170" font-size="12" fill="#7F6000" text-anchor="middle">부하</text>
<line x1="330" y1="190" x2="330" y2="210" stroke="#333" stroke-width="2"/>
<!-- current arrows -->
<line x1="355" y1="125" x2="355" y2="195" stroke="#C00000" stroke-width="2.5" marker-end="url(#r)"/>
<line x1="290" y1="218" x2="200" y2="218" stroke="#C00000" stroke-width="2.5" marker-end="url(#r)"/>
<text x="195" y="365" font-size="12" fill="#333" text-anchor="middle">부하는 <tspan font-weight="bold">+V와 출력 사이</tspan></text>
<text x="195" y="383" font-size="12" fill="#333" text-anchor="middle">ON이면 출력선을 <tspan fill="#C00000" font-weight="bold">0 V로 끌어내림</tspan></text>

<!-- ===== PNP (right) ===== -->
<text x="585" y="62" font-size="15" font-weight="bold" fill="#2F5597" text-anchor="middle">PNP 출력 (소스형)</text>
<rect x="420" y="80" width="150" height="260" rx="6" fill="#F2F2F2" stroke="#595959" stroke-width="2"/>
<text x="495" y="100" font-size="12" fill="#333" text-anchor="middle">센서 내부</text>
<line x1="570" y1="120" x2="720" y2="120" stroke="#8B4513" stroke-width="3"/>
<line x1="570" y1="210" x2="720" y2="210" stroke="#222" stroke-width="3"/>
<line x1="570" y1="310" x2="720" y2="310" stroke="#1F5FBF" stroke-width="3"/>
<text x="590" y="113" font-size="12" fill="#8B4513">갈색 +V</text>
<text x="590" y="203" font-size="12" fill="#222">흑색 출력</text>
<text x="590" y="303" font-size="12" fill="#1F5FBF">청색 0 V</text>
<rect x="435" y="275" width="70" height="30" fill="#DEEBF7" stroke="#2F5597"/>
<text x="470" y="295" font-size="11" fill="#2F5597" text-anchor="middle">검출 회로</text>
<line x1="505" y1="305" x2="505" y2="310" stroke="#333" stroke-width="1.5"/>
<line x1="505" y1="310" x2="570" y2="310" stroke="#333" stroke-width="1.5"/>
<!-- PNP transistor: emitter up to +V, collector down to output -->
<circle cx="530" cy="170" r="22" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<line x1="522" y1="156" x2="522" y2="184" stroke="#333" stroke-width="2.5"/>
<line x1="540" y1="152" x2="524" y2="162" stroke="#333" stroke-width="1.5" marker-end="url(#t)"/>
<line x1="522" y1="176" x2="540" y2="188" stroke="#333" stroke-width="1.5"/>
<line x1="470" y1="275" x2="470" y2="170" stroke="#333" stroke-width="1.5"/>
<line x1="470" y1="170" x2="522" y2="170" stroke="#333" stroke-width="1.5"/>
<line x1="540" y1="152" x2="540" y2="120" stroke="#333" stroke-width="1.5"/>
<line x1="540" y1="120" x2="570" y2="120" stroke="#333" stroke-width="1.5"/>
<line x1="540" y1="188" x2="540" y2="210" stroke="#333" stroke-width="1.5"/>
<line x1="540" y1="210" x2="570" y2="210" stroke="#333" stroke-width="1.5"/>
<!-- load between output and 0V -->
<line x1="720" y1="210" x2="720" y2="235" stroke="#333" stroke-width="2"/>
<rect x="702" y="235" width="36" height="50" fill="#FFF2CC" stroke="#BF9000" stroke-width="2"/>
<text x="720" y="265" font-size="12" fill="#7F6000" text-anchor="middle">부하</text>
<line x1="720" y1="285" x2="720" y2="310" stroke="#333" stroke-width="2"/>
<line x1="600" y1="218" x2="690" y2="218" stroke="#C00000" stroke-width="2.5" marker-end="url(#r)"/>
<line x1="748" y1="225" x2="748" y2="295" stroke="#C00000" stroke-width="2.5" marker-end="url(#r)"/>
<text x="585" y="365" font-size="12" fill="#333" text-anchor="middle">부하는 <tspan font-weight="bold">출력과 0 V 사이</tspan></text>
<text x="585" y="383" font-size="12" fill="#333" text-anchor="middle">ON이면 출력선으로 <tspan fill="#C00000" font-weight="bold">+V를 내보냄</tspan></text>

<line x1="390" y1="50" x2="390" y2="395" stroke="#D9D9D9"/>
<text x="390" y="410" font-size="11" fill="#7F7F7F" text-anchor="middle">선 색: 갈색 = +V, 청색 = 0 V, 흑색 = 출력 (NPN·PNP 공통)</text>
</svg>
