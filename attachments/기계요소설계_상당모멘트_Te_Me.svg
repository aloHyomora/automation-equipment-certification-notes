<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<rect width="840" height="400" fill="#ffffff"/>
<text x="420" y="28" font-size="17" fill="#548235" text-anchor="middle" font-weight="bold">굽힘 M 과 비틀림 T 를 하나로 — 상당 비틀림 Te, 상당 굽힘 Me</text>
<!-- triangle: 40 px per kN·m -->
<text x="160" y="66" font-size="13" fill="#262626" text-anchor="middle">예: M = 3 kN·m, T = 4 kN·m</text>
<polygon points="80,330 200,330 200,170" fill="#e2efda" stroke="none"/>
<line x1="80" y1="330" x2="200" y2="330" stroke="#548235" stroke-width="4"/>
<line x1="200" y1="330" x2="200" y2="170" stroke="#2F5597" stroke-width="4"/>
<line x1="80" y1="330" x2="200" y2="170" stroke="#C00000" stroke-width="4"/>
<rect x="188" y="318" width="12" height="12" fill="none" stroke="#595959"/>
<text x="140" y="352" font-size="14" fill="#548235" text-anchor="middle" font-weight="bold">M = 3</text>
<text x="212" y="255" font-size="14" fill="#2F5597" font-weight="bold">T = 4</text>
<text x="70" y="236" font-size="14" fill="#C00000" font-weight="bold">Te = 5</text>
<text x="140" y="378" font-size="12" fill="#595959" text-anchor="middle">직각삼각형의 빗변 = √(M² + T²)</text>
<!-- bars -->
<text x="440" y="66" font-size="13" fill="#262626" text-anchor="middle">크기 비교 (kN·m)</text>
<line x1="320" y1="330" x2="560" y2="330" stroke="#595959"/>
<rect x="340" y="210" width="40" height="120" fill="#a9d18e" stroke="#548235"/>
<rect x="396" y="170" width="40" height="160" fill="#b4c7e7" stroke="#2F5597"/>
<rect x="452" y="130" width="40" height="200" fill="#f4b6b6" stroke="#C00000"/>
<rect x="508" y="170" width="40" height="160" fill="#fbe5d6" stroke="#C55A11"/>
<text x="360" y="202" font-size="12" text-anchor="middle" fill="#548235">3</text>
<text x="416" y="162" font-size="12" text-anchor="middle" fill="#2F5597">4</text>
<text x="472" y="122" font-size="12" text-anchor="middle" fill="#C00000">5</text>
<text x="528" y="162" font-size="12" text-anchor="middle" fill="#C55A11">4</text>
<text x="360" y="350" font-size="13" text-anchor="middle" fill="#548235" font-weight="bold">M</text>
<text x="416" y="350" font-size="13" text-anchor="middle" fill="#2F5597" font-weight="bold">T</text>
<text x="472" y="350" font-size="13" text-anchor="middle" fill="#C00000" font-weight="bold">Te</text>
<text x="528" y="350" font-size="13" text-anchor="middle" fill="#C55A11" font-weight="bold">Me</text>
<text x="440" y="378" font-size="12" fill="#595959" text-anchor="middle">Me = ½(M + Te) = ½(3 + 5) = 4</text>
<!-- boxes -->
<rect x="590" y="70" width="230" height="130" rx="8" fill="#f2f2f2" stroke="#C00000"/>
<text x="705" y="94" font-size="14" fill="#C00000" text-anchor="middle" font-weight="bold">연성 재료 (연강 등)</text>
<text x="705" y="116" font-size="12" fill="#262626" text-anchor="middle">최대 전단 응력설</text>
<text x="705" y="142" font-size="14" fill="#262626" text-anchor="middle">Te = √(M² + T²)</text>
<text x="705" y="170" font-size="14" fill="#262626" text-anchor="middle">d = ∛(16 Te / π τa)</text>
<text x="705" y="190" font-size="11" fill="#595959" text-anchor="middle">비틀림 식에 T 대신 Te</text>
<rect x="590" y="220" width="230" height="130" rx="8" fill="#f2f2f2" stroke="#C55A11"/>
<text x="705" y="244" font-size="14" fill="#C55A11" text-anchor="middle" font-weight="bold">취성 재료 (주철 등)</text>
<text x="705" y="266" font-size="12" fill="#262626" text-anchor="middle">최대 주응력설</text>
<text x="705" y="292" font-size="14" fill="#262626" text-anchor="middle">Me = ½(M + Te)</text>
<text x="705" y="320" font-size="14" fill="#262626" text-anchor="middle">d = ∛(32 Me / π σa)</text>
<text x="705" y="340" font-size="11" fill="#595959" text-anchor="middle">굽힘 식에 M 대신 Me</text>
</svg>
