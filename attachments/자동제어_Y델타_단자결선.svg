<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<rect width="820" height="400" fill="#ffffff"/>
<text x="410.0" y="26" font-size="16" fill="#2F5597" text-anchor="middle" font-weight="bold">Y-Δ 기동: 전동기 단자 6개를 MC-Y·MC-Δ가 바꿔 묶는다</text>
<rect x="20" y="50" width="380" height="270" fill="none" stroke="#ddd"/>
