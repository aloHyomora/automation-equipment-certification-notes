<path d="M160,260 a8,8 0 0,1 16,0 a8,8 0 0,1 16,0 a8,8 0 0,1 16,0 a8,8 0 0,1 16,0 a8,8 0 0,1 16,0" fill="none" stroke="#C55A11" stroke-width="2.5"/>
<line x1="240" y1="260" x2="280" y2="260" stroke="#333" stroke-width="2.5"/>
<circle cx="140" cy="260" r="4" fill="#333"/>
<circle cx="280" cy="260" r="4" fill="#333"/>
<text x="140" y="250" font-size="12.5" fill="#2F5597" text-anchor="middle" font-weight="bold">W1</text>
<text x="280" y="250" font-size="12.5" fill="#2F5597" text-anchor="middle" font-weight="bold">W2</text>
<line x1="320" y1="140" x2="320" y2="260" stroke="#C00000" stroke-width="3"/>
<line x1="280" y1="140" x2="320" y2="140" stroke="#C00000" stroke-width="2.5"/>
<circle cx="320" cy="140" r="4" fill="#C00000"/>
<line x1="280" y1="200" x2="320" y2="200" stroke="#C00000" stroke-width="2.5"/>
<circle cx="320" cy="200" r="4" fill="#C00000"/>
<line x1="280" y1="260" x2="320" y2="260" stroke="#C00000" stroke-width="2.5"/>
<circle cx="320" cy="260" r="4" fill="#C00000"/>
<text x="330" y="194" font-size="12" fill="#C00000" text-anchor="start" font-weight="bold">MC-Y가</text>
<text x="330" y="210" font-size="12" fill="#C00000" text-anchor="start" font-weight="bold">한 점으로</text>
<text x="330" y="226" font-size="12" fill="#C00000" text-anchor="start" font-weight="bold">묶음</text>
<text x="210" y="300" font-size="12.5" fill="#333" text-anchor="middle" font-weight="bold">권선 전압 = 선간전압 × 1/√3</text>
<rect x="420" y="50" width="380" height="270" fill="none" stroke="#ddd"/>
<text x="610" y="74" font-size="13.5" fill="#C00000" text-anchor="middle" font-weight="bold">② 운전: MC-M + MC-Δ 투입 → Δ 결선</text>
<line x1="450" y1="140" x2="540" y2="140" stroke="#333" stroke-width="2"/>
<text x="442" y="145" font-size="12.5" fill="#333" text-anchor="end" font-weight="bold">L1</text>
<line x1="540" y1="140" x2="560" y2="140" stroke="#333" stroke-width="2.5"/>
<path d="M560,140 a8,8 0 0,1 16,0 a8,8 0 0,1 16,0 a8,8 0 0,1 16,0 a8,8 0 0,1 16,0 a8,8 0 0,1 16,0" fill="none" stroke="#C55A11" stroke-width="2.5"/>
<line x1="640" y1="140" x2="680" y2="140" stroke="#333" stroke-width="2.5"/>
<circle cx="540" cy="140" r="4" fill="#333"/>
<circle cx="680" cy="140" r="4" fill="#333"/>
<text x="540" y="130" font-size="12.5" fill="#2F5597" text-anchor="middle" font-weight="bold">U1</text>
<text x="680" y="130" font-size="12.5" fill="#2F5597" text-anchor="middle" font-weight="bold">U2</text>
<line x1="450" y1="200" x2="540" y2="200" stroke="#333" stroke-width="2"/>
<text x="442" y="205" font-size="12.5" fill="#333" text-anchor="end" font-weight="bold">L2</text>
<line x1="540" y1="200" x2="560" y2="200" stroke="#333" stroke-width="2.5"/>
<path d="M560,200 a8,8 0 0,1 16,0 a8,8 0 0,1 16,0 a8,8 0 0,1 16,0 a8,8 0 0,1 16,0 a8,8 0 0,1 16,0" fill="none" stroke="#C55A11" stroke-width="2.5"/>
<line x1="640" y1="200" x2="680" y2="200" stroke="#333" stroke-width="2.5"/>
<circle cx="540" cy="200" r="4" fill="#333"/>
<circle cx="680" cy="200" r="4" fill="#333"/>
<text x="540" y="190" font-size="12.5" fill="#2F5597" text-anchor="middle" font-weight="bold">V1</text>
<text x="680" y="190" font-size="12.5" fill="#2F5597" text-anchor="middle" font-weight="bold">V2</text>
<line x1="450" y1="260" x2="540" y2="260" stroke="#333" stroke-width="2"/>
<text x="442" y="265" font-size="12.5" fill="#333" text-anchor="end" font-weight="bold">L3</text>
<line x1="540" y1="260" x2="560" y2="260" stroke="#333" stroke-width="2.5"/>
<path d="M560,260 a8,8 0 0,1 16,0 a8,8 0 0,1 16,0 a8,8 0 0,1 16,0 a8,8 0 0,1 16,0 a8,8 0 0,1 16,0" fill="none" stroke="#C55A11" stroke-width="2.5"/>
<line x1="640" y1="260" x2="680" y2="260" stroke="#333" stroke-width="2.5"/>
<circle cx="540" cy="260" r="4" fill="#333"/>
<circle cx="680" cy="260" r="4" fill="#333"/>
<text x="540" y="250" font-size="12.5" fill="#2F5597" text-anchor="middle" font-weight="bold">W1</text>
<text x="680" y="250" font-size="12.5" fill="#2F5597" text-anchor="middle" font-weight="bold">W2</text>
<polyline points="680,140 695,140 695,170 525,170 525,200 540,200" fill="none" stroke="#C00000" stroke-width="2.5"/>
<polyline points="680,200 695,200 695,230 525,230 525,260 540,260" fill="none" stroke="#C00000" stroke-width="2.5"/>
<polyline points="680,260 715,260 715,106 505,106 505,140 540,140" fill="none" stroke="#C00000" stroke-width="2.5"/>
<circle cx="505" cy="140" r="4" fill="#C00000"/>
<circle cx="525" cy="200" r="4" fill="#C00000"/>
<circle cx="525" cy="260" r="4" fill="#C00000"/>
<text x="610" y="300" font-size="12.5" fill="#333" text-anchor="middle" font-weight="bold">U1–W2, V1–U2, W1–V2 : 권선 전압 = 선간전압</text>
<rect x="20" y="330" width="780" height="54" fill="#F2F2F2" stroke="#bbb"/>
<text x="32" y="352" font-size="12.5" fill="#333" text-anchor="start">MC-M은 L1·L2·L3를 U1·V1·W1에 계속 잇는다. MC-Y와 MC-Δ는 반대쪽 끝 U2·V2·W2를 서로 다르게 묶는다.</text>
<text x="32" y="370" font-size="12.5" fill="#333" text-anchor="start">둘이 동시에 붙으면 U2·V2·W2가 한 점(Y)이면서 각 선에 연결(Δ)되어 선간 단락 → 반드시 인터록.</text>
</svg>
