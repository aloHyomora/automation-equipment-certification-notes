<line x1="240" y1="200" x2="280" y2="200" stroke="#333" stroke-width="2.5"/>
<circle cx="140" cy="200" r="4" fill="#333"/>
<circle cx="280" cy="200" r="4" fill="#333"/>
<text x="140" y="190" font-size="12.5" fill="#2F5597" text-anchor="middle" font-weight="bold">V1</text>
<text x="280" y="190" font-size="12.5" fill="#2F5597" text-anchor="middle" font-weight="bold">V2</text>
<line x1="50" y1="260" x2="140" y2="260" stroke="#333" stroke-width="2"/>
