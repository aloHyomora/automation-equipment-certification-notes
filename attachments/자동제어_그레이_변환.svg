<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" width="780" height="400" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
  <rect x="0" y="0" width="780" height="400" fill="#FFFFFF"/>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F5597"/>
    </marker>
  </defs>

  <text x="200" y="32" font-size="19" font-weight="bold" fill="#2F5597" text-anchor="middle">2진 → 그레이 (0101 → 0111)</text>

  <text x="20" y="100" font-size="15" fill="#333">2진</text>
  <text x="20" y="300" font-size="15" fill="#333">그레이</text>
  <g stroke="#2F5597" stroke-width="2" fill="#EEF3FA">
    <rect x="80" y="70" width="56" height="50" rx="6"/><rect x="170" y="70" width="56" height="50" rx="6"/>
    <rect x="260" y="70" width="56" height="50" rx="6"/><rect x="350" y="70" width="56" height="50" rx="6"/>
  </g>
  <g font-size="28" font-weight="bold" fill="#222" text-anchor="middle">
    <text x="108" y="105">0</text><text x="198" y="105">1</text><text x="288" y="105">0</text><text x="378" y="105">1</text>
  </g>

  <!-- XOR nodes -->
  <g stroke="#C00000" stroke-width="2" fill="#FFFFFF">
    <circle cx="198" cy="190" r="16"/><circle cx="288" cy="190" r="16"/><circle cx="378" cy="190" r="16"/>
  </g>
  <g stroke="#C00000" stroke-width="2">
    <line x1="186" y1="190" x2="210" y2="190"/><line x1="198" y1="178" x2="198" y2="202"/>
    <line x1="276" y1="190" x2="300" y2="190"/><line x1="288" y1="178" x2="288" y2="202"/>
    <line x1="366" y1="190" x2="390" y2="190"/><line x1="378" y1="178" x2="378" y2="202"/>
  </g>
  <!-- wires -->
  <g stroke="#2F5597" stroke-width="2" fill="none">
    <line x1="108" y1="120" x2="108" y2="262" marker-end="url(#ab)"/>
    <line x1="108" y1="140" x2="186" y2="182" marker-end="url(#ab)"/>
    <line x1="198" y1="120" x2="198" y2="172" marker-end="url(#ab)"/>
    <line x1="198" y1="140" x2="276" y2="182" marker-end="url(#ab)"/>
    <line x1="288" y1="120" x2="288" y2="172" marker-end="url(#ab)"/>
    <line x1="288" y1="140" x2="366" y2="182" marker-end="url(#ab)"/>
    <line x1="378" y1="120" x2="378" y2="172" marker-end="url(#ab)"/>
    <line x1="198" y1="206" x2="198" y2="262" marker-end="url(#ab)"/>
    <line x1="288" y1="206" x2="288" y2="262" marker-end="url(#ab)"/>
    <line x1="378" y1="206" x2="378" y2="262" marker-end="url(#ab)"/>
  </g>
  <text x="60" y="190" font-size="13" fill="#555">그대로</text>
  <g font-size="13" fill="#C00000" text-anchor="middle">
    <text x="232" y="236">0⊕1=1</text><text x="322" y="236">1⊕0=1</text><text x="412" y="236">0⊕1=1</text>
  </g>

  <g stroke="#C00000" stroke-width="2" fill="#FBE5E5">
    <rect x="80" y="270" width="56" height="50" rx="6"/><rect x="170" y="270" width="56" height="50" rx="6"/>
    <rect x="260" y="270" width="56" height="50" rx="6"/><rect x="350" y="270" width="56" height="50" rx="6"/>
  </g>
  <g font-size="28" font-weight="bold" fill="#C00000" text-anchor="middle">
    <text x="108" y="305">0</text><text x="198" y="305">1</text><text x="288" y="305">1</text><text x="378" y="305">1</text>
  </g>
  <text x="243" y="360" font-size="14" fill="#333" text-anchor="middle">그레이 비트 = 같은 자리 2진 ⊕ 바로 왼쪽 2진</text>

  <line x1="470" y1="30" x2="470" y2="380" stroke="#BBBBBB" stroke-dasharray="6 5"/>

  <!-- table 0..7 -->
  <text x="620" y="32" font-size="19" font-weight="bold" fill="#2F5597" text-anchor="middle">0~7 비교</text>
  <g font-size="15" font-weight="bold" fill="#2F5597" text-anchor="middle">
    <text x="525" y="62">10진</text><text x="610" y="62">2진</text><text x="700" y="62">그레이</text>
  </g>
  <line x1="490" y1="70" x2="750" y2="70" stroke="#2F5597"/>
  <g font-size="16" fill="#222" text-anchor="middle" font-family="Consolas, monospace">
    <text x="525" y="94">0</text><text x="610" y="94">000</text><text x="700" y="94">000</text>
    <text x="525" y="128">1</text><text x="610" y="128">001</text><text x="700" y="128">001</text>
    <text x="525" y="162">2</text><text x="610" y="162">010</text><text x="700" y="162">011</text>
    <text x="525" y="196">3</text><text x="610" y="196">011</text><text x="700" y="196">010</text>
    <text x="525" y="230">4</text><text x="610" y="230">100</text><text x="700" y="230">110</text>
    <text x="525" y="264">5</text><text x="610" y="264">101</text><text x="700" y="264">111</text>
    <text x="525" y="298">6</text><text x="610" y="298">110</text><text x="700" y="298">101</text>
    <text x="525" y="332">7</text><text x="610" y="332">111</text><text x="700" y="332">100</text>
  </g>
  <rect x="490" y="178" width="260" height="60" rx="6" fill="none" stroke="#C00000" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="620" y="362" font-size="13" fill="#C00000" text-anchor="middle">3→4: 2진은 3비트 동시 변화, 그레이는 1비트</text>
</svg>
