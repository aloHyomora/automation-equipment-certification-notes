<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
  <rect width="800" height="440" fill="#ffffff"/>
  <text x="400" y="26" font-size="17" font-weight="bold" fill="#2F5597" text-anchor="middle">전압형 인버터의 주회로: 컨버터 → DC 링크 → 인버터</text>

  <!-- section frames -->
  <g fill="#F3F6FB" stroke="#2F5597" stroke-width="1.2" stroke-dasharray="5 4">
    <rect x="95" y="50" width="200" height="262" rx="6"/>
    <rect x="305" y="50" width="135" height="262" rx="6"/>
    <rect x="450" y="50" width="225" height="262" rx="6"/>
  </g>
  <text x="195" y="68" font-size="14" font-weight="bold" fill="#2F5597" text-anchor="middle">① 컨버터 (AC → DC)</text>
  <text x="372" y="68" font-size="14" font-weight="bold" fill="#2F5597" text-anchor="middle">② DC 링크</text>
  <text x="562" y="68" font-size="14" font-weight="bold" fill="#2F5597" text-anchor="middle">③ 인버터 (DC → 가변 AC)</text>

  <!-- buses -->
  <line x1="140" y1="85" x2="640" y2="85" stroke="#C00000" stroke-width="2.5"/>
  <line x1="140" y1="285" x2="640" y2="285" stroke="#333" stroke-width="2.5"/>
  <text x="300" y="80" font-size="13" fill="#C00000" font-weight="bold">P (+)</text>
  <text x="300" y="302" font-size="13" fill="#333" font-weight="bold">N (−)</text>

  <!-- converter legs: x = 140, 195, 250 -->
  <g stroke="#333" stroke-width="2" fill="none">
    <line x1="140" y1="85" x2="140" y2="285"/>
    <line x1="195" y1="85" x2="195" y2="285"/>
    <line x1="250" y1="85" x2="250" y2="285"/>
  </g>
  <!-- diodes pointing up (anode below, cathode above) -->
  <g fill="#2F5597" stroke="#2F5597" stroke-width="2">
    <polygon points="131,140 149,140 140,126"/><line x1="131" y1="126" x2="149" y2="126"/>
    <polygon points="186,140 204,140 195,126"/><line x1="186" y1="126" x2="204" y2="126"/>
    <polygon points="241,140 259,140 250,126"/><line x1="241" y1="126" x2="259" y2="126"/>
    <polygon points="131,245 149,245 140,231"/><line x1="131" y1="231" x2="149" y2="231"/>
    <polygon points="186,245 204,245 195,231"/><line x1="186" y1="231" x2="204" y2="231"/>
    <polygon points="241,245 259,245 250,231"/><line x1="241" y1="231" x2="259" y2="231"/>
  </g>
  <!-- input stubs -->
  <g stroke="#333" stroke-width="2">
    <line x1="140" y1="185" x2="118" y2="185"/>
    <line x1="195" y1="185" x2="173" y2="185"/>
    <line x1="250" y1="185" x2="228" y2="185"/>
  </g>
  <g fill="#ffffff" stroke="#333" stroke-width="1.8">
    <circle cx="114" cy="185" r="4"/><circle cx="169" cy="185" r="4"/><circle cx="224" cy="185" r="4"/>
  </g>
  <g fill="#333" font-size="14" font-weight="bold" text-anchor="middle">
    <text x="114" y="208">R</text><text x="169" y="208">S</text><text x="224" y="208">T</text>
  </g>
  <text x="48" y="180" font-size="13" fill="#333" text-anchor="middle">3상</text>
  <text x="48" y="197" font-size="13" fill="#333" text-anchor="middle">교류 전원</text>
  <line x1="74" y1="188" x2="100" y2="188" stroke="#333" stroke-width="1.5"/>
  <polygon points="104,188 96,184 96,192" fill="#333"/>
  <text x="195" y="270" font-size="12" fill="#2F5597" text-anchor="middle">다이오드 정류</text>

  <!-- DC link capacitor x=335 -->
  <g stroke="#333" stroke-width="2">
    <line x1="335" y1="85" x2="335" y2="178"/>
    <line x1="335" y1="192" x2="335" y2="285"/>
  </g>
  <g stroke="#2F5597" stroke-width="3.5">
    <line x1="318" y1="178" x2="352" y2="178"/>
    <line x1="318" y1="192" x2="352" y2="192"/>
  </g>
  <text x="320" y="170" font-size="12" fill="#C00000">+</text>
  <rect x="313" y="212" width="44" height="33" fill="#F3F6FB"/>
  <text x="335" y="225" font-size="12" fill="#2F5597" text-anchor="middle">평활</text>
  <text x="335" y="240" font-size="12" fill="#2F5597" text-anchor="middle">콘덴서</text>

  <!-- braking resistor + transistor x=405 -->
  <line x1="405" y1="85" x2="405" y2="110" stroke="#333" stroke-width="2"/>
  <rect x="396" y="110" width="18" height="50" fill="#FBE5E5" stroke="#C00000" stroke-width="2"/>
  <line x1="405" y1="160" x2="405" y2="200" stroke="#333" stroke-width="2"/>
  <rect x="393" y="200" width="24" height="34" fill="#ffffff" stroke="#C00000" stroke-width="2"/>
  <text x="405" y="222" font-size="11" fill="#C00000" text-anchor="middle">TR</text>
  <line x1="405" y1="234" x2="405" y2="285" stroke="#333" stroke-width="2"/>
  <text x="372" y="128" font-size="12" fill="#C00000" text-anchor="end">제동</text>
  <text x="372" y="143" font-size="12" fill="#C00000" text-anchor="end">저항</text>
  <rect x="360" y="247" width="78" height="15" fill="#F3F6FB"/>
  <text x="400" y="258" font-size="11" fill="#C00000" text-anchor="middle">회생 에너지 소비</text>

  <!-- inverter legs x = 495, 560, 625 -->
  <g stroke="#333" stroke-width="2">
    <line x1="495" y1="85" x2="495" y2="105"/><line x1="495" y1="145" x2="495" y2="225"/><line x1="495" y1="265" x2="495" y2="285"/>
    <line x1="560" y1="85" x2="560" y2="105"/><line x1="560" y1="145" x2="560" y2="225"/><line x1="560" y1="265" x2="560" y2="285"/>
    <line x1="625" y1="85" x2="625" y2="105"/><line x1="625" y1="145" x2="625" y2="225"/><line x1="625" y1="265" x2="625" y2="285"/>
  </g>
  <g fill="#DCE6F5" stroke="#2F5597" stroke-width="2">
    <rect x="481" y="105" width="28" height="40" rx="3"/><rect x="546" y="105" width="28" height="40" rx="3"/><rect x="611" y="105" width="28" height="40" rx="3"/>
    <rect x="481" y="225" width="28" height="40" rx="3"/><rect x="546" y="225" width="28" height="40" rx="3"/><rect x="611" y="225" width="28" height="40" rx="3"/>
  </g>
  <g fill="#2F5597" font-size="12" font-weight="bold" text-anchor="middle">
    <text x="495" y="130">S1</text><text x="560" y="130">S3</text><text x="625" y="130">S5</text>
    <text x="495" y="250">S4</text><text x="560" y="250">S6</text><text x="625" y="250">S2</text>
  </g>
  <!-- output stubs -->
  <g stroke="#333" stroke-width="2">
    <line x1="495" y1="185" x2="517" y2="185"/>
    <line x1="560" y1="185" x2="582" y2="185"/>
    <line x1="625" y1="185" x2="647" y2="185"/>
  </g>
  <g fill="#ffffff" stroke="#333" stroke-width="1.8">
    <circle cx="521" cy="185" r="4"/><circle cx="586" cy="185" r="4"/><circle cx="651" cy="185" r="4"/>
  </g>
  <g fill="#333" font-size="14" font-weight="bold" text-anchor="middle">
    <text x="521" y="208">U</text><text x="586" y="208">V</text><text x="651" y="208">W</text>
  </g>
  <text x="562" y="300" font-size="12" fill="#2F5597" text-anchor="middle">IGBT 6개 PWM 스위칭</text>

  <!-- motor -->
  <circle cx="738" cy="185" r="32" fill="#ffffff" stroke="#2F5597" stroke-width="2.5"/>
  <text x="738" y="183" font-size="16" font-weight="bold" fill="#2F5597" text-anchor="middle">IM</text>
  <text x="738" y="200" font-size="11" fill="#2F5597" text-anchor="middle">3~</text>
  <text x="738" y="140" font-size="12" fill="#333" text-anchor="middle">U·V·W 연결</text>
  <line x1="682" y1="185" x2="700" y2="185" stroke="#333" stroke-width="1.5"/>
  <polygon points="705,185 697,181 697,189" fill="#333"/>

  <!-- waveforms row -->
  <line x1="40" y1="330" x2="760" y2="330" stroke="#ddd" stroke-width="1"/>
  <!-- AC sine under converter -->
  <path d="M110,375 C125,345 140,345 155,375 S185,405 200,375 S230,345 245,375 S275,405 290,375" fill="none" stroke="#2F5597" stroke-width="2"/>
  <text x="200" y="425" font-size="13" fill="#333" text-anchor="middle">상용 교류 60 Hz, 일정 전압</text>
  <!-- DC under link -->
  <line x1="320" y1="360" x2="425" y2="360" stroke="#C00000" stroke-width="2.5"/>
  <line x1="320" y1="390" x2="425" y2="390" stroke="#333" stroke-width="1"/>
  <text x="372" y="425" font-size="13" fill="#333" text-anchor="middle">일정한 직류</text>
  <!-- PWM under inverter -->
  <g fill="#DCE6F5" stroke="#2F5597" stroke-width="1.2">
    <rect x="470" y="352" width="4" height="23"/><rect x="480" y="352" width="9" height="23"/><rect x="494" y="352" width="14" height="23"/>
    <rect x="512" y="352" width="16" height="23"/><rect x="532" y="352" width="14" height="23"/><rect x="550" y="352" width="9" height="23"/>
    <rect x="564" y="352" width="4" height="23"/>
    <rect x="574" y="375" width="4" height="23"/><rect x="584" y="375" width="9" height="23"/><rect x="598" y="375" width="14" height="23"/>
    <rect x="616" y="375" width="16" height="23"/><rect x="636" y="375" width="14" height="23"/><rect x="654" y="375" width="9" height="23"/>
    <rect x="668" y="375" width="4" height="23"/>
  </g>
  <path d="M470,375 C495,340 545,340 570,375 S645,410 670,375" fill="none" stroke="#C00000" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="572" y="425" font-size="13" fill="#333" text-anchor="middle">펄스 폭을 바꿔 만든 가변 전압·가변 주파수</text>
</svg>
