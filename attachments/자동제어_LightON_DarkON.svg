<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<rect width="760" height="300" fill="#ffffff"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#2F5597" text-anchor="middle">Light ON / Dark ON 타임차트 (투과형 예)</text>

<!-- column guides -->
<line x1="330" y1="45" x2="330" y2="270" stroke="#BFBFBF" stroke-dasharray="4 4"/>
<line x1="520" y1="45" x2="520" y2="270" stroke="#BFBFBF" stroke-dasharray="4 4"/>
<text x="250" y="58" font-size="12" fill="#333" text-anchor="middle">물체 없음</text>
<text x="425" y="58" font-size="12" fill="#C00000" text-anchor="middle" font-weight="bold">물체가 빛을 가림</text>
<text x="620" y="58" font-size="12" fill="#333" text-anchor="middle">물체 없음</text>

<!-- row: 수광 상태 -->
<text x="20" y="100" font-size="13" font-weight="bold" fill="#333">수광부에</text>
<text x="20" y="117" font-size="13" font-weight="bold" fill="#333">빛 도달</text>
<text x="160" y="88" font-size="11" fill="#7F7F7F" text-anchor="end">있음</text>
<text x="160" y="122" font-size="11" fill="#7F7F7F" text-anchor="end">없음</text>
<polyline points="170,85 330,85 330,118 520,118 520,85 720,85" fill="none" stroke="#333" stroke-width="2.5"/>

<!-- row: Light ON -->
<text x="20" y="170" font-size="13" font-weight="bold" fill="#2F5597">Light ON</text>
<text x="20" y="187" font-size="11" fill="#2F5597">(입광 시 ON)</text>
<text x="160" y="158" font-size="11" fill="#7F7F7F" text-anchor="end">ON</text>
<text x="160" y="192" font-size="11" fill="#7F7F7F" text-anchor="end">OFF</text>
<polyline points="170,155 330,155 330,188 520,188 520,155 720,155" fill="none" stroke="#2F5597" stroke-width="2.5"/>

<!-- row: Dark ON -->
<text x="20" y="240" font-size="13" font-weight="bold" fill="#C00000">Dark ON</text>
<text x="20" y="257" font-size="11" fill="#C00000">(차광 시 ON)</text>
<text x="160" y="228" font-size="11" fill="#7F7F7F" text-anchor="end">ON</text>
<text x="160" y="262" font-size="11" fill="#7F7F7F" text-anchor="end">OFF</text>
<polyline points="170,258 330,258 330,225 520,225 520,258 720,258" fill="none" stroke="#C00000" stroke-width="2.5"/>

<text x="380" y="290" font-size="12" fill="#333" text-anchor="middle">"물체가 있을 때 ON"을 원하면 투과형·회귀반사형은 Dark ON, 확산반사형은 Light ON</text>
</svg>
