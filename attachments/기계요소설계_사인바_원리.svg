<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<rect width="720" height="380" fill="#ffffff"/>
<text x="360" y="28" font-size="17" fill="#548235" text-anchor="middle" font-weight="bold">사인바 — 블록 게이지 높이차로 각도를 만든다</text>
<rect x="40" y="320" width="600" height="24" fill="#D9D9D9" stroke="#555"/>
<text x="340" y="337" font-size="12" text-anchor="middle" fill="#333">정반 (기준 평면)</text>
<rect x="92" y="310.0" width="36" height="10.0" fill="#FFE699" stroke="#BF9000"/>
<rect x="464.2" y="163.4" width="36" height="156.6" fill="#FFE699" stroke="#BF9000"/>
<line x1="464.2" y1="280.9" x2="500.2" y2="280.9" stroke="#BF9000"/>
<line x1="464.2" y1="241.7" x2="500.2" y2="241.7" stroke="#BF9000"/>
<line x1="464.2" y1="202.6" x2="500.2" y2="202.6" stroke="#BF9000"/>
<g transform="rotate(-21.50 110 298.0)"><rect x="80" y="264.0" width="460.0" height="22" fill="#A9D18E" stroke="#548235" stroke-width="2"/><rect x="250.0" y="242.0" width="90" height="22" fill="#F4B183" stroke="#C55A11"/><text x="295.0" y="258.0" font-size="11" text-anchor="middle" fill="#333">측정물</text></g>
<circle cx="110" cy="298.0" r="12" fill="#7F7F7F" stroke="#333"/>
<circle cx="482.2" cy="151.4" r="12" fill="#7F7F7F" stroke="#333"/>
<line x1="110" y1="298.0" x2="482.2" y2="151.4" stroke="#C00000" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="290" y="258" font-size="13" fill="#C00000" font-weight="bold">L = 롤러 중심 거리</text><text x="290" y="276" font-size="12" fill="#C00000">(사인바의 호칭 치수)</text>
<line x1="110" y1="298.0" x2="512.2" y2="298.0" stroke="#555" stroke-dasharray="3 3"/>
<path d="M180,298.0 A70,70 0 0 0 175.1,272.3" fill="none" stroke="#C00000" stroke-width="2"/>
<text x="188" y="290.0" font-size="15" fill="#C00000" font-weight="bold">α</text>
<text x="86" y="318" font-size="14" text-anchor="end" fill="#BF9000" font-weight="bold">h</text>
<line x1="512.2" y1="320" x2="512.2" y2="163.4" stroke="#BF9000" stroke-width="1.5"/>
<text x="518.2" y="241.7" font-size="14" fill="#BF9000" font-weight="bold">H</text>
<text x="518.2" y="259.7" font-size="11" fill="#555">블록 게이지</text>
<rect x="40" y="50" width="235" height="120" rx="8" fill="#F3F8EF" stroke="#548235"/>
<text x="157" y="78" font-size="16" text-anchor="middle" fill="#548235" font-weight="bold">sin α = (H − h) / L</text>
<text x="52" y="104" font-size="12" fill="#333">예: L = 200, α = 21°30′, h = 5</text>
<text x="52" y="124" font-size="12" fill="#333">H = 5 + 200 × sin 21.5°</text>
<text x="52" y="144" font-size="12" fill="#333">   = 5 + 73.3 = <tspan fill="#C00000" font-weight="bold">78.3 mm</tspan></text>
<text x="52" y="162" font-size="11" fill="#555">(그림은 이 값의 실제 비율)</text>
<text x="360" y="368" font-size="12" text-anchor="middle" fill="#C00000">45°를 넘으면 sin 변화가 둔해져 오차가 커진다 → 45° 이하에서 사용</text>
</svg>