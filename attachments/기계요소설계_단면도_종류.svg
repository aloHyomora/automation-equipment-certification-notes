<text x="365.0" y="194.0" font-size="10" fill="#C00000" text-anchor="start" >외형</text>
<text x="290.0" y="240.0" font-size="14" fill="#548235" text-anchor="middle" font-weight="bold" >한쪽 단면도</text>
<text x="290.0" y="258.0" font-size="11" fill="#333" text-anchor="middle" >대칭 물체의 1/4을 잘라</text>
