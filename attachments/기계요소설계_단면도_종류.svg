<text x="665.0" y="258.0" font-size="11" fill="#333" text-anchor="middle" >암·리브·훅의 단면을</text>
<text x="665.0" y="272.0" font-size="11" fill="#333" text-anchor="middle" >90° 돌려 그 자리에</text>
<text x="380.0" y="312.0" font-size="12" fill="#000" text-anchor="middle" font-weight="bold" >인접한 다른 부품은 해칭 방향·간격을 바꾸고, 글자가 들어가는 곳은 해칭을 중단한다</text>
