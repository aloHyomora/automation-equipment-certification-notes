<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C00000"/></marker>
<marker id="dm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
</defs>
<rect width="960" height="390" fill="#ffffff"/>
<text x="480" y="28" font-size="18" fill="#548235" text-anchor="middle" font-weight="bold">토크 T = F × (회전 중심에서 작용선까지 수직 거리)</text>
<g stroke="#BFBFBF"><line x1="320" y1="45" x2="320" y2="375"/><line x1="640" y1="45" x2="640" y2="375"/></g>
<g font-size="15" text-anchor="middle" font-weight="bold" fill="#548235">
<text x="160" y="64">① 힘이 팔과 직각 (θ = 90°)</text><text x="480" y="64">② 비스듬한 힘 (θ = 60°)</text><text x="800" y="64">③ 힘이 팔과 나란함 (θ = 0°)</text>
</g>
<!-- panel 1 -->
<rect x="60" y="213" width="210" height="14" rx="4" fill="#A9D18E" stroke="#548235" stroke-width="2"/>
<circle cx="60" cy="220" r="24" fill="#C5E0B4" stroke="#548235" stroke-width="2"/>
<polygon points="72,220 66,230.4 54,230.4 48,220 54,209.6 66,209.6" fill="#7F7F7F"/>
<circle cx="60" cy="220" r="3" fill="#000"/>
<line x1="265" y1="120" x2="265" y2="210" stroke="#C00000" stroke-width="3" marker-end="url(#ar)"/>
<text x="276" y="150" font-size="16" fill="#C00000" font-weight="bold">F</text>
<line x1="60" y1="265" x2="265" y2="265" stroke="#333" marker-start="url(#dm)" marker-end="url(#dm)"/>
<text x="162" y="284" font-size="14" text-anchor="middle">r (팔 길이)</text>
<text x="160" y="322" font-size="15" text-anchor="middle" fill="#C00000" font-weight="bold">T = F · r  (최대)</text>
<text x="160" y="348" font-size="13" text-anchor="middle">r을 2배 → T도 2배 (제곱 아님)</text>
<!-- panel 2 : O=(380,220), P=(570,220), u=(0.5,0.866) -->
<rect x="380" y="213" width="190" height="14" rx="4" fill="#A9D18E" stroke="#548235" stroke-width="2"/>
<circle cx="380" cy="220" r="24" fill="#C5E0B4" stroke="#548235" stroke-width="2"/>
<polygon points="392,220 386,230.4 374,230.4 368,220 374,209.6 386,209.6" fill="#7F7F7F"/>
<circle cx="380" cy="220" r="3" fill="#000"/>
<line x1="512.5" y1="120.4" x2="590" y2="254.6" stroke="#C00000" stroke-width="1.5" stroke-dasharray="5,4"/>
<line x1="530" y1="150.7" x2="568" y2="216.5" stroke="#C00000" stroke-width="3" marker-end="url(#ar)"/>
<text x="530" y="140" font-size="16" fill="#C00000" font-weight="bold">F</text>
<line x1="570" y1="220" x2="628" y2="220" stroke="#548235" stroke-width="1.5" stroke-dasharray="5,4"/>
<path d="M600,220 A30,30 0 0,1 585,246" fill="none" stroke="#333" stroke-width="1.5"/>
<text x="603" y="250" font-size="14">θ</text>
<line x1="380" y1="220" x2="522.5" y2="137.7" stroke="#2F5597" stroke-width="2" stroke-dasharray="2,3"/>
<path d="M514.7,142.2 L519.2,150 L527,145.5" fill="none" stroke="#2F5597" stroke-width="1.2"/>
<text x="420" y="160" font-size="14" fill="#2F5597" font-weight="bold">d = r sinθ</text>
<line x1="380" y1="265" x2="570" y2="265" stroke="#333" marker-start="url(#dm)" marker-end="url(#dm)"/>
<text x="475" y="284" font-size="14" text-anchor="middle">r</text>
<text x="480" y="322" font-size="15" text-anchor="middle" fill="#C00000" font-weight="bold">T = F · r sinθ = F · d</text>
<text x="480" y="348" font-size="13" text-anchor="middle">작용선(점선)까지의 수직 거리 d가 팔이다</text>
<!-- panel 3 -->
<rect x="690" y="213" width="190" height="14" rx="4" fill="#A9D18E" stroke="#548235" stroke-width="2"/>
<circle cx="690" cy="220" r="24" fill="#C5E0B4" stroke="#548235" stroke-width="2"/>
<polygon points="702,220 696,230.4 684,230.4 678,220 684,209.6 696,209.6" fill="#7F7F7F"/>
<circle cx="690" cy="220" r="3" fill="#000"/>
<line x1="880" y1="190" x2="940" y2="190" stroke="#C00000" stroke-width="3" marker-end="url(#ar)"/>
<text x="900" y="180" font-size="16" fill="#C00000" font-weight="bold">F</text>
<line x1="690" y1="220" x2="880" y2="220" stroke="#C00000" stroke-width="1" stroke-dasharray="5,4"/>
<path d="M880,220 L880,190" stroke="#C00000" stroke-width="1" stroke-dasharray="3,3"/>
<text x="785" y="200" font-size="13" text-anchor="middle" fill="#C00000">작용선이 중심을 지남</text>
<line x1="690" y1="265" x2="880" y2="265" stroke="#333" marker-start="url(#dm)" marker-end="url(#dm)"/>
<text x="785" y="284" font-size="14" text-anchor="middle">r</text>
<text x="800" y="322" font-size="15" text-anchor="middle" fill="#C00000" font-weight="bold">d = 0 → T = 0</text>
<text x="800" y="348" font-size="13" text-anchor="middle">0° 또는 180°면 회전력이 생기지 않는다</text>
</svg>
