<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C00000"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#548235"/></marker>
<marker id="dm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
</defs>
<rect width="900" height="400" fill="#ffffff"/>
<text x="450" y="28" font-size="18" fill="#548235" text-anchor="middle" font-weight="bold">힘의 합성 — 직각인 두 힘(왼쪽)과 평행력의 합력 위치(오른쪽)</text>
<line x1="440" y1="45" x2="440" y2="385" stroke="#BFBFBF"/>
<!-- left: O=(90,300), 50 px/N -->
<path d="M90,300 L290,300 L290,150 L90,150 Z" fill="#E2F0D9" stroke="none"/>
<g stroke="#548235" stroke-dasharray="5,4" stroke-width="1.5"><line x1="290" y1="300" x2="290" y2="150"/><line x1="90" y1="150" x2="290" y2="150"/></g>
<line x1="90" y1="300" x2="288" y2="300" stroke="#548235" stroke-width="3" marker-end="url(#ag)"/>
<line x1="90" y1="300" x2="90" y2="152" stroke="#548235" stroke-width="3" marker-end="url(#ag)"/>
<line x1="90" y1="300" x2="288" y2="152" stroke="#C00000" stroke-width="3.5" marker-end="url(#ar)"/>
<circle cx="90" cy="300" r="4" fill="#000"/>
<text x="190" y="322" font-size="15" text-anchor="middle" fill="#548235" font-weight="bold">F₁ = 4 N</text>
<text x="80" y="230" font-size="15" text-anchor="end" fill="#548235" font-weight="bold">F₂ = 3 N</text>
<text x="118" y="196" font-size="16" fill="#C00000" font-weight="bold">R = 5 N</text>
<path d="M90,288 L102,288 L102,300" fill="none" stroke="#333"/>
<text x="220" y="355" font-size="15" text-anchor="middle" fill="#C00000" font-weight="bold">R = √(F₁² + F₂²) = √(16 + 9) = 5 N</text>
<text x="220" y="378" font-size="12" text-anchor="middle">일반식 R = √(F₁² + F₂² + 2F₁F₂cosθ), θ = 90°면 cos항 = 0</text>
<!-- right: beam x 500 = 0 m, 90 px/m -->
<rect x="500" y="190" width="360" height="12" fill="#A9D18E" stroke="#548235" stroke-width="2"/>
<circle cx="500" cy="196" r="4" fill="#000"/>
<text x="500" y="178" font-size="13" text-anchor="middle">기준점 O</text>
<line x1="590" y1="90" x2="590" y2="188" stroke="#548235" stroke-width="3" marker-end="url(#ag)"/>
<text x="598" y="110" font-size="15" fill="#548235" font-weight="bold">3 N</text>
<line x1="770" y1="155" x2="770" y2="188" stroke="#548235" stroke-width="3" marker-end="url(#ag)"/>
<text x="778" y="150" font-size="15" fill="#548235" font-weight="bold">1 N</text>
<line x1="635" y1="204" x2="635" y2="326" stroke="#C00000" stroke-width="3.5" stroke-dasharray="8,4" marker-end="url(#ar)"/>
<text x="645" y="300" font-size="15" fill="#C00000" font-weight="bold">합력 R = 4 N</text>
<g stroke="#999" stroke-dasharray="3,3"><line x1="500" y1="202" x2="500" y2="248"/><line x1="590" y1="202" x2="590" y2="248"/><line x1="770" y1="202" x2="770" y2="248"/></g>
<line x1="500" y1="240" x2="590" y2="240" stroke="#333" marker-start="url(#dm)" marker-end="url(#dm)"/>
<text x="545" y="234" font-size="12" text-anchor="middle">1 m</text>
<line x1="500" y1="262" x2="770" y2="262" stroke="#333" marker-start="url(#dm)" marker-end="url(#dm)"/>
<text x="700" y="257" font-size="12" text-anchor="middle">3 m</text>
<line x1="500" y1="340" x2="635" y2="340" stroke="#C00000" marker-start="url(#dm)" marker-end="url(#dm)"/>
<text x="568" y="334" font-size="12" text-anchor="middle" fill="#C00000">x = 1.5 m</text>
<text x="670" y="366" font-size="14" text-anchor="middle" fill="#C00000" font-weight="bold">x = ΣF·x / ΣF = (3×1 + 1×3) / (3+1) = 6 / 4 = 1.5 m</text>
<text x="670" y="388" font-size="12" text-anchor="middle">바리뇽 정리: 합력의 모멘트 = 각 힘 모멘트의 합</text>
</svg>
