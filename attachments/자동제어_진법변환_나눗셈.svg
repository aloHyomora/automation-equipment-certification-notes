<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
  <rect x="0" y="0" width="760" height="400" fill="#FFFFFF"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C00000"/>
    </marker>
  </defs>

  <!-- Left: integer part, repeated division -->
  <text x="190" y="32" font-size="19" font-weight="bold" fill="#2F5597" text-anchor="middle">정수부: 2로 계속 나누기</text>
  <text x="190" y="56" font-size="14" fill="#333" text-anchor="middle">41(10) → 2진</text>
  <g font-size="18" fill="#222">
    <text x="60" y="95">2 )</text><text x="110" y="95">41</text><text x="200" y="95" fill="#555">… 나머지</text><text x="300" y="95" font-weight="bold" fill="#C00000">1</text>
    <text x="60" y="135">2 )</text><text x="110" y="135">20</text><text x="200" y="135" fill="#555">… 나머지</text><text x="300" y="135" font-weight="bold" fill="#C00000">0</text>
    <text x="60" y="175">2 )</text><text x="110" y="175">10</text><text x="200" y="175" fill="#555">… 나머지</text><text x="300" y="175" font-weight="bold" fill="#C00000">0</text>
    <text x="60" y="215">2 )</text><text x="110" y="215">5</text><text x="200" y="215" fill="#555">… 나머지</text><text x="300" y="215" font-weight="bold" fill="#C00000">1</text>
    <text x="60" y="255">2 )</text><text x="110" y="255">2</text><text x="200" y="255" fill="#555">… 나머지</text><text x="300" y="255" font-weight="bold" fill="#C00000">0</text>
    <text x="110" y="295">1</text><text x="200" y="295" fill="#555">… 몫</text><text x="300" y="295" font-weight="bold" fill="#C00000">1</text>
  </g>
  <line x1="100" y1="102" x2="160" y2="102" stroke="#2F5597" stroke-width="1.5"/>
  <line x1="100" y1="142" x2="160" y2="142" stroke="#2F5597" stroke-width="1.5"/>
  <line x1="100" y1="182" x2="160" y2="182" stroke="#2F5597" stroke-width="1.5"/>
  <line x1="100" y1="222" x2="160" y2="222" stroke="#2F5597" stroke-width="1.5"/>
  <line x1="100" y1="262" x2="160" y2="262" stroke="#2F5597" stroke-width="1.5"/>
  <line x1="335" y1="292" x2="335" y2="92" stroke="#C00000" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="345" y="200" font-size="13" fill="#C00000">아래</text>
  <text x="345" y="218" font-size="13" fill="#C00000">→ 위</text>
  <rect x="60" y="320" width="300" height="50" rx="8" fill="#EEF3FA" stroke="#2F5597"/>
  <text x="210" y="352" font-size="18" text-anchor="middle" fill="#222">41(10) = <tspan font-weight="bold" fill="#C00000">101001</tspan>(2)</text>

  <line x1="395" y1="30" x2="395" y2="380" stroke="#BBBBBB" stroke-dasharray="6 5"/>

  <!-- Right: fraction part, repeated multiplication -->
  <text x="575" y="32" font-size="19" font-weight="bold" fill="#2F5597" text-anchor="middle">소수부: 2를 계속 곱하기</text>
  <text x="575" y="56" font-size="14" fill="#333" text-anchor="middle">0.625(10) → 2진</text>
  <g font-size="18" fill="#222">
    <text x="430" y="105">0.625 × 2 = <tspan font-weight="bold" fill="#C00000">1</tspan>.25</text>
    <text x="430" y="155">0.25 × 2 = <tspan font-weight="bold" fill="#C00000">0</tspan>.5</text>
    <text x="430" y="205">0.5 × 2 = <tspan font-weight="bold" fill="#C00000">1</tspan>.0</text>
  </g>
  <line x1="660" y1="90" x2="660" y2="210" stroke="#C00000" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="672" y="145" font-size="13" fill="#C00000">위</text>
  <text x="672" y="163" font-size="13" fill="#C00000">→ 아래</text>
  <rect x="430" y="240" width="300" height="50" rx="8" fill="#EEF3FA" stroke="#2F5597"/>
  <text x="580" y="272" font-size="18" text-anchor="middle" fill="#222">0.625(10) = <tspan font-weight="bold" fill="#C00000">0.101</tspan>(2)</text>
  <text x="580" y="325" font-size="14" text-anchor="middle" fill="#333">검산: 0.5 + 0.125 = 0.625</text>
  <text x="580" y="350" font-size="14" text-anchor="middle" fill="#333">자리값 0.5 · 0.25 · 0.125 · 0.0625 …</text>
  <text x="580" y="375" font-size="13" text-anchor="middle" fill="#555">정수부는 떼어 내고 소수부만 다시 곱한다 (0이 되면 끝)</text>
</svg>
