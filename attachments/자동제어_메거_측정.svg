<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<rect width="700" height="400" fill="#ffffff"/>
<text x="350" y="26" font-size="16" fill="#2F5597" text-anchor="middle" font-weight="bold">메거(절연 저항계)로 전선–접지 사이 절연 저항 재기</text>
<rect x="40" y="70" width="170" height="150" rx="10" fill="#DEEBF7" stroke="#2F5597" stroke-width="2"/>
<text x="125" y="98" font-size="15" fill="#2F5597" text-anchor="middle" font-weight="bold">메거</text>
<text x="125" y="120" font-size="12" fill="#333" text-anchor="middle">DC 250 / 500 / 1000 V</text>
<rect x="70" y="132" width="110" height="34" fill="#fff" stroke="#2F5597"/>
<text x="125" y="155" font-size="15" fill="#333" text-anchor="middle">□□ MΩ</text>
<circle cx="80" cy="198" r="9" fill="#C00000"/><text x="80" y="238" font-size="13" text-anchor="middle" fill="#C00000" font-weight="bold">L</text>
<circle cx="170" cy="198" r="9" fill="#333"/><text x="170" y="238" font-size="13" text-anchor="middle" fill="#333" font-weight="bold">E</text>
<text x="80" y="254" font-size="11" text-anchor="middle" fill="#555">선로</text>
<text x="170" y="254" font-size="11" text-anchor="middle" fill="#555">접지</text>
<rect x="290" y="60" width="370" height="200" rx="6" fill="#F4F4F4" stroke="#888" stroke-width="2"/>
<text x="475" y="82" font-size="13" fill="#555" text-anchor="middle">외함 (접지됨)</text>
<line x1="320" y1="120" x2="520" y2="120" stroke="#8B4513" stroke-width="6"/>
<line x1="320" y1="150" x2="520" y2="150" stroke="#111" stroke-width="6"/>
<line x1="320" y1="180" x2="520" y2="180" stroke="#8C8C8C" stroke-width="6"/>
<text x="330" y="110" font-size="12" fill="#333">L1 · L2 · L3 (전원 차단)</text>
<rect x="560" y="105" width="80" height="90" fill="#fff" stroke="#C00000" stroke-width="2" stroke-dasharray="6 4"/>
<text x="600" y="140" font-size="12.5" fill="#C00000" text-anchor="middle" font-weight="bold">PLC</text>
<text x="600" y="158" font-size="12.5" fill="#C00000" text-anchor="middle" font-weight="bold">인버터</text>
<text x="600" y="180" font-size="11.5" fill="#C00000" text-anchor="middle">미리 분리</text>
<line x1="520" y1="120" x2="545" y2="120" stroke="#8B4513" stroke-width="6"/>
<line x1="545" y1="112" x2="545" y2="128" stroke="#C00000" stroke-width="2"/>
<text x="540" y="240" font-size="12" fill="#333" text-anchor="middle">외함 접지 단자</text>
<circle cx="600" cy="255" r="6" fill="#333"/>
<path d="M80,198 C80,290 260,300 330,180" fill="none" stroke="#C00000" stroke-width="2.5"/>
<circle cx="330" cy="180" r="5" fill="#C00000"/>
<path d="M170,198 C170,320 560,330 600,255" fill="none" stroke="#333" stroke-width="2.5"/>
<g font-size="13">
<rect x="30" y="335" width="150" height="40" rx="6" fill="#2F5597"/><text x="105" y="360" fill="#fff" text-anchor="middle">① 전원 차단·검전</text>
<rect x="195" y="335" width="150" height="40" rx="6" fill="#2F5597"/><text x="270" y="360" fill="#fff" text-anchor="middle">② 반도체 기기 분리</text>
<rect x="360" y="335" width="150" height="40" rx="6" fill="#2F5597"/><text x="435" y="360" fill="#fff" text-anchor="middle">③ 충전 → 값 읽기</text>
<rect x="525" y="335" width="150" height="40" rx="6" fill="#C00000"/><text x="600" y="360" fill="#fff" text-anchor="middle">④ 측정 후 방전</text>
</g>
</svg>
