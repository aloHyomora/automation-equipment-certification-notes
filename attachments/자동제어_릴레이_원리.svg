<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
  <rect width="640" height="350" rx="16" fill="#fff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#C55A11"/></marker></defs>
  <text x="320" y="28" font-size="14" text-anchor="middle" fill="#222" font-weight="bold">코일에 전류가 흐르는 상태 (ON)</text>
  <!-- iron core + coil -->
  <rect x="90" y="150" width="40" height="120" fill="#BBB" stroke="#666"/>
  <g stroke="#C55A11" stroke-width="5" fill="none">
    <line x1="80" y1="168" x2="140" y2="178"/><line x1="80" y1="188" x2="140" y2="198"/>
    <line x1="80" y1="208" x2="140" y2="218"/><line x1="80" y1="228" x2="140" y2="238"/>
    <line x1="80" y1="248" x2="140" y2="258"/>
  </g>
  <text x="110" y="292" font-size="13" text-anchor="middle" fill="#C55A11" font-weight="bold">코일 + 철심</text>
  <text x="110" y="310" font-size="12" text-anchor="middle" fill="#555">(작은 전류)</text>
  <!-- armature: seesaw on pivot (320,118). Left end pulled DOWN onto core, so right end goes UP -->
  <line x1="320" y1="118" x2="100" y2="143" stroke="#444" stroke-width="7" stroke-linecap="round"/>
  <line x1="320" y1="118" x2="430" y2="80" stroke="#2F5597" stroke-width="5" stroke-linecap="round"/>
  <polygon points="320,122 308,146 332,146" fill="#444"/>
  <circle cx="320" cy="118" r="5" fill="#fff" stroke="#444" stroke-width="2"/>
  <text x="160" y="152" font-size="13" fill="#444">가동 철편</text>
  <text x="300" y="165" font-size="12" fill="#555">지렛목</text>
  <!-- spring pulls left end UP when the coil is off -->
  <polyline points="230,132 230,100 238,94 222,86 238,78 222,70 230,64 230,50" fill="none" stroke="#666" stroke-width="2"/>
  <line x1="215" y1="50" x2="245" y2="50" stroke="#666" stroke-width="3"/>
  <text x="252" y="76" font-size="12" fill="#555">복귀 스프링</text>
  <!-- contacts: NO above (touched now), NC below (open now) -->
  <rect x="432" y="66" width="80" height="14" fill="#548235"/>
  <text x="432" y="56" font-size="13" fill="#548235" font-weight="bold">a접점 (NO): 지금 닫힘</text>
  <rect x="432" y="150" width="80" height="14" fill="#C00000"/>
  <text x="432" y="184" font-size="13" fill="#C00000" font-weight="bold">b접점 (NC): 지금 열림</text>
  <circle cx="430" cy="80" r="5" fill="#2F5597"/>
  <text x="372" y="112" font-size="12" fill="#2F5597">공통(COM)</text>
  <!-- explanation -->
  <path d="M 150 205 Q 190 200 205 158" fill="none" stroke="#C55A11" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="300" y="228" font-size="14" fill="#222">① 코일에 전류 → 철심이 전자석</text>
  <text x="300" y="253" font-size="14" fill="#222">② 철편 왼쪽 끝을 끌어내림</text>
  <text x="300" y="278" font-size="14" fill="#222">③ 지렛대라 오른쪽 끝이 올라가 a접점에 닿음</text>
  <text x="300" y="303" font-size="14" fill="#222">④ 전류를 끊으면 스프링이 당겨 b접점으로 복귀</text>
</svg>
