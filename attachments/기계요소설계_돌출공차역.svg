<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" width="780" height="300" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C00000"/></marker><pattern id="hat" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#548235" stroke-width="1.2"/></pattern></defs>
<rect width="780" height="300" fill="#fff"/>
<text x="390.0" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#548235">돌출 공차역 Ⓟ — 공차역을 부품 밖으로 연장</text>
<rect x="60" y="190" width="300" height="60" fill="#EEF5E9" stroke="#548235" stroke-width="2"/>
<rect x="185" y="190" width="40" height="60" fill="#fff" stroke="#548235" stroke-width="1.5"/>
<line x1="198" y1="255" x2="232" y2="95" stroke="#000" stroke-width="1.2" stroke-dasharray="14,3,2,3"/>
<text x="240" y="100" font-size="12" text-anchor="start" fill="#000">실제 구멍 축선</text>
<rect x="196" y="110" width="18" height="80" fill="none" stroke="#C00000" stroke-width="1.5" stroke-dasharray="6,4"/>
<rect x="196" y="190" width="18" height="60" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="3,3"/>
<rect x="60" y="110" width="300" height="80" fill="none" stroke="#888" stroke-width="1.2" stroke-dasharray="2,4"/>
<text x="70" y="130" font-size="12" text-anchor="start" fill="#666">조립될 상대 부품 자리</text>
<text x="80" y="172" font-size="12.5" text-anchor="start" fill="#C00000" font-weight="bold">돌출 공차역 φ0.1</text>
<line x1="185" y1="168" x2="195" y2="160" stroke="#C00000" stroke-width="1.2" marker-end="url(#arR)"/>
<line x1="380" y1="110" x2="380" y2="190" stroke="#C00000" stroke-width="1.2" marker-end="url(#arR)" marker-start="url(#arR)"/>
<text x="388" y="155" font-size="12.5" text-anchor="start" fill="#C00000" font-weight="bold">돌출 길이</text>
<line x1="365" y1="110" x2="385" y2="110" stroke="#C00000" stroke-width="1"/>
<line x1="365" y1="190" x2="385" y2="190" stroke="#C00000" stroke-width="1"/>
<text x="210" y="280" font-size="12.5" text-anchor="middle" fill="#222">판 안(회색)에서는 공차역 안이어도, 위로 연장하면 벗어난다</text>
<rect x="440" y="120" width="40" height="30" fill="#fff" stroke="#000" stroke-width="1.5"/>
<circle cx="460.0" cy="135.0" r="6" fill="none" stroke="#000" stroke-width="1.8"/><line x1="449.0" y1="135.0" x2="471.0" y2="135.0" stroke="#000" stroke-width="1.8"/><line x1="460.0" y1="124.0" x2="460.0" y2="146.0" stroke="#000" stroke-width="1.8"/>
<rect x="480" y="120" width="110" height="30" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="535.0" y="140.0" font-size="15" text-anchor="middle" fill="#000">φ0.1 Ⓟ</text>
<rect x="590" y="120" width="35" height="30" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="607.5" y="140.0" font-size="15" text-anchor="middle" fill="#000">A</text>
<text x="440" y="180" font-size="13" text-anchor="start" fill="#222">Ⓟ 돌출 공차역: 공차역을 부품 밖</text>
<text x="440" y="200" font-size="13" text-anchor="start" fill="#222">(볼트·핀이 박혀 나오는 쪽)으로 연장해</text>
<text x="440" y="220" font-size="13" text-anchor="start" fill="#222">상대 부품 두께만큼 검사한다</text>
<text x="440" y="245" font-size="12.5" text-anchor="start" fill="#C00000">→ 나사 구멍이 기울어 볼트가 상대 부품</text>
<text x="440" y="263" font-size="12.5" text-anchor="start" fill="#C00000">   구멍에 걸리는 것을 막는다</text>
</svg>