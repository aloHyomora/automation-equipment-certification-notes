<circle cx="230.0" cy="352.0" r="4" fill="#C00000"/>
<text x="230.0" y="385.0" font-size="15" font-family="Consolas, monospace" fill="#C00000" text-anchor="middle">1000</text>
<text x="230.0" y="319.0" font-size="17" font-weight="bold" fill="#C00000" text-anchor="middle">−8</text>
