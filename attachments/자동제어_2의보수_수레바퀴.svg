<text x="160.7" y="290.3" font-size="17" font-weight="bold" fill="#C00000" text-anchor="middle">−6</text>
<circle cx="103.4" cy="267.4" r="4" fill="#C00000"/>
<text x="77.6" y="283.1" font-size="15" font-family="Consolas, monospace" fill="#C00000" text-anchor="middle">1011</text>
<text x="139.5" y="258.5" font-size="17" font-weight="bold" fill="#C00000" text-anchor="middle">−5</text>
<circle cx="93.0" cy="215.0" r="4" fill="#C00000"/>
<text x="65.0" y="220.0" font-size="15" font-family="Consolas, monospace" fill="#C00000" text-anchor="middle">1100</text>
<text x="132.0" y="221.0" font-size="17" font-weight="bold" fill="#C00000" text-anchor="middle">−4</text>
<circle cx="103.4" cy="162.6" r="4" fill="#C00000"/>
<text x="77.6" y="156.9" font-size="15" font-family="Consolas, monospace" fill="#C00000" text-anchor="middle">1101</text>
<text x="139.5" y="183.5" font-size="17" font-weight="bold" fill="#C00000" text-anchor="middle">−3</text>
<circle cx="133.1" cy="118.1" r="4" fill="#C00000"/>
<text x="113.3" y="103.3" font-size="15" font-family="Consolas, monospace" fill="#C00000" text-anchor="middle">1110</text>
<text x="160.7" y="151.7" font-size="17" font-weight="bold" fill="#C00000" text-anchor="middle">−2</text>
<circle cx="177.6" cy="88.4" r="4" fill="#C00000"/>
<text x="166.9" y="67.6" font-size="15" font-family="Consolas, monospace" fill="#C00000" text-anchor="middle">1111</text>
<text x="192.5" y="130.5" font-size="17" font-weight="bold" fill="#C00000" text-anchor="middle">−1</text>
<line x1="238.8" y1="259.1" x2="259.8" y2="365.1" stroke="#C00000" stroke-width="2.5" stroke-dasharray="5 4"/>
<text x="230" y="209" font-size="13" fill="#2F5597" text-anchor="middle">MSB 0 → 양수</text>
<text x="230" y="229" font-size="13" fill="#C00000" text-anchor="middle">MSB 1 → 음수</text>
<text x="230" y="422" font-size="13" fill="#333" text-anchor="middle">시계 방향 = +1, 0은 하나뿐, 범위 −8 ~ +7</text>
<line x1="470" y1="30" x2="470" y2="410" stroke="#BBBBBB" stroke-dasharray="6 5"/>
<text x="620" y="26" font-size="19" font-weight="bold" fill="#2F5597" text-anchor="middle">−5 만들기 (4비트)</text>
<text x="490" y="75" font-size="15" fill="#333">+5</text>
<rect x="490" y="85" width="150" height="44" rx="6" fill="#EEF3FA" stroke="#2F5597" stroke-width="2"/>
<text x="565" y="116" font-size="26" font-weight="bold" font-family="Consolas, monospace" fill="#2F5597" text-anchor="middle">0101</text>
<text x="565" y="147" font-size="18" fill="#2F5597" text-anchor="middle">↓</text>
<text x="490" y="170" font-size="15" fill="#333">반전 (1의 보수)</text>
<rect x="490" y="180" width="150" height="44" rx="6" fill="#EEF3FA" stroke="#333" stroke-width="2"/>
<text x="565" y="211" font-size="26" font-weight="bold" font-family="Consolas, monospace" fill="#333" text-anchor="middle">1010</text>
<text x="565" y="242" font-size="18" fill="#2F5597" text-anchor="middle">↓</text>
<text x="490" y="265" font-size="15" fill="#333">+1 (2의 보수)</text>
<rect x="490" y="275" width="150" height="44" rx="6" fill="#FBE5E5" stroke="#C00000" stroke-width="2"/>
<text x="565" y="306" font-size="26" font-weight="bold" font-family="Consolas, monospace" fill="#C00000" text-anchor="middle">1011</text>
<text x="655" y="306" font-size="20" font-weight="bold" fill="#C00000">= −5</text>
<text x="490" y="355" font-size="14" fill="#333">검산: 1011 + 0101 = 1 0000</text>
<text x="490" y="378" font-size="14" fill="#333">→ 넘친 자리올림을 버리면 0000 = 0</text>
<text x="490" y="401" font-size="14" fill="#C00000">8비트로는 1111 1011 = FBH</text>
</svg>