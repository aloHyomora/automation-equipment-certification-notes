<circle cx="565" cy="205" r="28" fill="white" stroke="#222" stroke-width="2"/><text x="565" y="211" font-size="18" fill="#222" text-anchor="middle" font-weight="bold">M</text>
<polyline points="668,103 668,197 462,197 462,307" fill="none" stroke="#C00000" stroke-width="3" stroke-opacity="0.55" stroke-dasharray="9,5" marker-end="url(#ar)"/>
<text x="565" y="165" font-size="13" fill="#C00000" text-anchor="middle" font-weight="bold">← 전류</text>
<text x="380.0" y="372" font-size="13" fill="#C00000" text-anchor="middle" font-weight="normal">같은 쪽 위·아래(S1·S3 또는 S2·S4)가 동시에 켜지면 +V와 GND가 바로 이어져 단락(관통 전류)</text>
<text x="380.0" y="392" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">→ 한쪽을 끄고 잠깐 기다렸다 다른 쪽을 켜는 데드 타임을 둔다</text>
