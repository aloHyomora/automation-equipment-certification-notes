<rect x="110" y="400" width="590" height="36" fill="#F2F2F2" stroke="#bbb"/>
<text x="122" y="422" font-size="12.5" fill="#333" text-anchor="start">ELB(누전 차단기)는 전류의 크기가 아니라 '나간 전류 − 돌아온 전류' 차이(30 mA, 0.03 초 이내)로 동작.</text>
