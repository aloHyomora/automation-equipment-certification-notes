<text x="560" y="108" font-size="11.5" fill="#555" text-anchor="middle">(상간 단락·지락 대전류)</text>
<path d="M168,130 C185,200 230,280 300,320 S390,345 430,350" fill="none" stroke="#C55A11" stroke-width="3"/>
