<text x="205" y="266" font-size="11.5" fill="#C55A11" text-anchor="start">전류가 클수록 빨리</text>
<polyline points="330,150 360,280 420,300 430,300 430,362 690,362" fill="none" stroke="#2F5597" stroke-width="3"/>
<text x="445" y="292" font-size="13" fill="#2F5597" text-anchor="start" font-weight="bold">MCCB 순시 트립</text>
<text x="445" y="308" font-size="11.5" fill="#2F5597" text-anchor="start">단락 전류를 즉시 차단</text>
