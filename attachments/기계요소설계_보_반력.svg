<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C00000"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5597"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#548235"/></marker>
<marker id="dm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
</defs>
<rect width="900" height="410" fill="#ffffff"/>
<text x="450" y="28" font-size="18" fill="#548235" text-anchor="middle" font-weight="bold">보의 반력과 하중 바꿔 놓기</text>
<line x1="460" y1="45" x2="460" y2="395" stroke="#BFBFBF"/>
<line x1="470" y1="215" x2="890" y2="215" stroke="#BFBFBF"/>
<!-- LEFT simple beam -->
<text x="235" y="62" font-size="15" text-anchor="middle" font-weight="bold" fill="#548235">① 단순보 반력 (교재 20-2)</text>
<rect x="60" y="170" width="350" height="12" fill="#A9D18E" stroke="#548235" stroke-width="2"/>
<path d="M60,182 L46,204 L74,204 Z" fill="#7F7F7F"/>
<path d="M410,182 L396,200 L424,200 Z" fill="#7F7F7F"/><circle cx="402" cy="204" r="4" fill="#7F7F7F"/><circle cx="418" cy="204" r="4" fill="#7F7F7F"/>
<text x="38" y="200" font-size="15" font-weight="bold" text-anchor="end">A</text><text x="432" y="200" font-size="15" font-weight="bold">B</text>
<line x1="200" y1="88" x2="200" y2="167" stroke="#C00000" stroke-width="3" marker-end="url(#ar)"/>
<text x="210" y="104" font-size="15" fill="#C00000" font-weight="bold">P = 50 kgf</text>
<line x1="60" y1="292" x2="60" y2="212" stroke="#2F5597" stroke-width="3" marker-end="url(#ab)"/>
<text x="70" y="260" font-size="14" fill="#2F5597" font-weight="bold">R_A = 30</text>
<line x1="410" y1="266" x2="410" y2="212" stroke="#2F5597" stroke-width="3" marker-end="url(#ab)"/>
<text x="400" y="250" font-size="14" fill="#2F5597" font-weight="bold" text-anchor="end">R_B = 20</text>
<g stroke="#999" stroke-dasharray="3,3"><line x1="200" y1="184" x2="200" y2="306"/></g>
<line x1="60" y1="302" x2="200" y2="302" stroke="#333" marker-start="url(#dm)" marker-end="url(#dm)"/>
<text x="130" y="296" font-size="13" text-anchor="middle">a = 800</text>
<line x1="200" y1="302" x2="410" y2="302" stroke="#333" marker-start="url(#dm)" marker-end="url(#dm)"/>
<text x="305" y="296" font-size="13" text-anchor="middle">1200</text>
<line x1="60" y1="324" x2="410" y2="324" stroke="#333" marker-start="url(#dm)" marker-end="url(#dm)"/>
<text x="235" y="340" font-size="13" text-anchor="middle">l = 2000 mm</text>
<text x="235" y="368" font-size="14" text-anchor="middle">ΣM_A = 0 : R_B × 2000 = 50 × 800</text>
<text x="235" y="390" font-size="14" text-anchor="middle" fill="#C00000" font-weight="bold">R_B = 20 kgf, R_A = 50 − 20 = 30 kgf</text>
<!-- RIGHT top cantilever -->
<text x="680" y="62" font-size="15" text-anchor="middle" font-weight="bold" fill="#548235">② 외팔보 — 고정단 모멘트</text>
<rect x="490" y="90" width="14" height="80" fill="#7F7F7F"/>
<g stroke="#7F7F7F"><line x1="490" y1="95" x2="480" y2="105"/><line x1="490" y1="115" x2="480" y2="125"/><line x1="490" y1="135" x2="480" y2="145"/><line x1="490" y1="155" x2="480" y2="165"/></g>
<rect x="504" y="124" width="290" height="12" fill="#A9D18E" stroke="#548235" stroke-width="2"/>
<line x1="790" y1="74" x2="790" y2="121" stroke="#C00000" stroke-width="3" marker-end="url(#ar)"/>
<text x="800" y="94" font-size="15" fill="#C00000" font-weight="bold">P</text>
<path d="M528,104 A26,26 0 1,0 528,156" fill="none" stroke="#2F5597" stroke-width="2.5" marker-end="url(#ab)"/>
<line x1="504" y1="160" x2="790" y2="160" stroke="#333" marker-start="url(#dm)" marker-end="url(#dm)"/>
<text x="650" y="176" font-size="13" text-anchor="middle">l</text>
<text x="680" y="202" font-size="14" text-anchor="middle" fill="#C00000" font-weight="bold">벽(고정단)이 받는 모멘트 M = P · l</text>
<!-- RIGHT bottom distributed -->
<text x="680" y="240" font-size="15" text-anchor="middle" font-weight="bold" fill="#548235">③ 분포 하중 → 도심의 집중 하중</text>
<line x1="520" y1="268" x2="820" y2="268" stroke="#548235" stroke-width="1.5"/>
<g stroke="#548235" stroke-width="1.5" marker-end="url(#ag)">
<line x1="520" y1="268" x2="520" y2="298"/><line x1="550" y1="268" x2="550" y2="298"/><line x1="580" y1="268" x2="580" y2="298"/><line x1="610" y1="268" x2="610" y2="298"/><line x1="640" y1="268" x2="640" y2="298"/>
<line x1="700" y1="268" x2="700" y2="298"/><line x1="730" y1="268" x2="730" y2="298"/><line x1="760" y1="268" x2="760" y2="298"/><line x1="790" y1="268" x2="790" y2="298"/><line x1="820" y1="268" x2="820" y2="298"/>
</g>
<text x="830" y="272" font-size="13" fill="#548235">w</text>
<rect x="520" y="300" width="300" height="12" fill="#A9D18E" stroke="#548235" stroke-width="2"/>
<path d="M520,312 L508,330 L532,330 Z" fill="#7F7F7F"/><path d="M820,312 L808,330 L832,330 Z" fill="#7F7F7F"/>
<line x1="670" y1="250" x2="670" y2="297" stroke="#C00000" stroke-width="3.5" stroke-dasharray="7,3" marker-end="url(#ar)"/>
<text x="680" y="258" font-size="14" fill="#C00000" font-weight="bold">wl</text>
<line x1="520" y1="345" x2="670" y2="345" stroke="#333" marker-start="url(#dm)" marker-end="url(#dm)"/>
<text x="595" y="340" font-size="12" text-anchor="middle">l/2</text>
<line x1="670" y1="345" x2="820" y2="345" stroke="#333" marker-start="url(#dm)" marker-end="url(#dm)"/>
<text x="745" y="340" font-size="12" text-anchor="middle">l/2</text>
<text x="680" y="378" font-size="14" text-anchor="middle" fill="#C00000" font-weight="bold">등분포 w × 길이 l = 전체 하중 wl, 가운데(도심)에 작용</text>
</svg>
