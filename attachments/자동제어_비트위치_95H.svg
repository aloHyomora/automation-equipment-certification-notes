<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
  <rect x="0" y="0" width="760" height="380" fill="#FFFFFF"/>
  <text x="380" y="32" font-size="20" font-weight="bold" fill="#2F5597" text-anchor="middle">95H 한 바이트를 비트로 풀기</text>

  <!-- nibble headers -->
  <rect x="80" y="55" width="296" height="40" rx="6" fill="#2F5597"/>
  <text x="228" y="82" font-size="18" fill="#FFFFFF" text-anchor="middle">상위 니블 9 = 1001</text>
  <rect x="384" y="55" width="296" height="40" rx="6" fill="#2F5597"/>
  <text x="532" y="82" font-size="18" fill="#FFFFFF" text-anchor="middle">하위 니블 5 = 0101</text>

  <!-- bit names -->
  <g font-size="16" fill="#333" text-anchor="middle">
    <text x="118" y="122">D7</text><text x="194" y="122">D6</text><text x="270" y="122">D5</text><text x="346" y="122">D4</text>
    <text x="422" y="122">D3</text><text x="498" y="122">D2</text><text x="574" y="122">D1</text><text x="650" y="122">D0</text>
  </g>
  <!-- bit cells -->
  <g stroke="#2F5597" stroke-width="2">
    <rect x="84" y="132" width="68" height="60" fill="#FBE5E5"/>
    <rect x="160" y="132" width="68" height="60" fill="#FFFFFF"/>
    <rect x="236" y="132" width="68" height="60" fill="#FFFFFF"/>
    <rect x="312" y="132" width="68" height="60" fill="#FBE5E5"/>
    <rect x="388" y="132" width="68" height="60" fill="#FFFFFF"/>
    <rect x="464" y="132" width="68" height="60" fill="#FBE5E5"/>
    <rect x="540" y="132" width="68" height="60" fill="#FFFFFF"/>
    <rect x="616" y="132" width="68" height="60" fill="#FBE5E5"/>
  </g>
  <g font-size="30" font-weight="bold" text-anchor="middle">
    <text x="118" y="173" fill="#C00000">1</text><text x="194" y="173" fill="#888">0</text>
    <text x="270" y="173" fill="#888">0</text><text x="346" y="173" fill="#C00000">1</text>
    <text x="422" y="173" fill="#888">0</text><text x="498" y="173" fill="#C00000">1</text>
    <text x="574" y="173" fill="#888">0</text><text x="650" y="173" fill="#C00000">1</text>
  </g>
  <!-- weights -->
  <text x="40" y="220" font-size="13" fill="#555" text-anchor="middle">자리값</text>
  <g font-size="16" fill="#2F5597" text-anchor="middle">
    <text x="118" y="220">128</text><text x="194" y="220">64</text><text x="270" y="220">32</text><text x="346" y="220">16</text>
    <text x="422" y="220">8</text><text x="498" y="220">4</text><text x="574" y="220">2</text><text x="650" y="220">1</text>
  </g>
  <line x1="84" y1="232" x2="684" y2="232" stroke="#BBBBBB"/>
  <text x="380" y="262" font-size="17" fill="#222" text-anchor="middle">ON 비트: D7 · D4 · D2 · D0 → 128 + 16 + 4 + 1 = <tspan font-weight="bold" fill="#C00000">149</tspan>(10)</text>

  <!-- octal grouping -->
  <text x="380" y="304" font-size="16" fill="#2F5597" text-anchor="middle" font-weight="bold">8진은 오른쪽부터 3비트씩</text>
  <g font-size="22" fill="#222" text-anchor="middle" font-family="Consolas, monospace">
    <text x="250" y="338">10</text><text x="295" y="338" fill="#BBBBBB">|</text><text x="345" y="338">010</text><text x="395" y="338" fill="#BBBBBB">|</text><text x="445" y="338">101</text>
  </g>
  <g font-size="18" font-weight="bold" fill="#C00000" text-anchor="middle">
    <text x="250" y="368">2</text><text x="345" y="368">2</text><text x="445" y="368">5</text>
  </g>
  <text x="490" y="368" font-size="16" fill="#222">→ 225(8) = 149(10)</text>
</svg>
