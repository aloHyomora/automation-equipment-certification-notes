<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2F5597"/></marker>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C00000"/></marker>
  </defs>
  <rect width="780" height="400" fill="#ffffff"/>
  <text x="390" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">HMI 오브젝트 → 태그 → PLC 디바이스</text>

  <!-- HMI screen -->
  <rect x="20" y="50" width="200" height="300" rx="10" fill="#EEF3FA" stroke="#2F5597" stroke-width="2"/>
  <text x="120" y="74" text-anchor="middle" font-size="14" font-weight="bold" fill="#2F5597">HMI 화면 (오브젝트)</text>
  <rect x="45" y="95" width="150" height="40" rx="6" fill="#2F5597"/>
  <text x="120" y="120" text-anchor="middle" font-size="14" fill="#fff">운전 스위치</text>
  <circle cx="120" cy="190" r="24" fill="#70AD47" stroke="#333"/>
  <text x="120" y="232" text-anchor="middle" font-size="13" fill="#222">운전 램프</text>
  <rect x="45" y="260" width="150" height="36" rx="4" fill="#fff" stroke="#333"/>
  <text x="120" y="284" text-anchor="middle" font-size="15" fill="#222" font-family="Consolas, monospace">1250 rpm</text>
  <text x="120" y="318" text-anchor="middle" font-size="13" fill="#222">수치 표시/입력</text>

  <!-- Tag table -->
  <rect x="275" y="50" width="210" height="300" rx="10" fill="#fff" stroke="#2F5597" stroke-width="2"/>
  <text x="380" y="74" text-anchor="middle" font-size="14" font-weight="bold" fill="#2F5597">태그 (이름 ↔ 주소)</text>
  <text x="295" y="120" font-size="13" fill="#222">RUN_SW</text><text x="400" y="120" font-size="13" fill="#2F5597">M100 (비트)</text>
  <text x="295" y="195" font-size="13" fill="#222">RUN_LAMP</text><text x="400" y="195" font-size="13" fill="#2F5597">P40 (비트)</text>
  <text x="295" y="284" font-size="13" fill="#222">SPEED_SV</text><text x="400" y="284" font-size="13" fill="#2F5597">D200 (워드)</text>

  <!-- PLC -->
  <rect x="540" y="50" width="220" height="300" rx="10" fill="#EEF3FA" stroke="#2F5597" stroke-width="2"/>
  <text x="650" y="74" text-anchor="middle" font-size="14" font-weight="bold" fill="#2F5597">PLC 메모리 · 프로그램</text>
  <rect x="560" y="95" width="180" height="62" rx="6" fill="#fff" stroke="#C00000" stroke-width="2"/>
  <text x="650" y="117" text-anchor="middle" font-size="13" fill="#C00000" font-weight="bold">래더에서 인터록</text>
  <text x="650" y="137" text-anchor="middle" font-size="12" fill="#222">M100 · 비상정지 · 과부하</text>
  <text x="650" y="151" text-anchor="middle" font-size="12" fill="#222">조건이 모두 OK일 때만</text>
  <rect x="580" y="175" width="140" height="34" rx="6" fill="#fff" stroke="#333"/>
  <text x="650" y="197" text-anchor="middle" font-size="13" fill="#222">출력 P40 → 모터</text>
  <rect x="580" y="265" width="140" height="34" rx="6" fill="#fff" stroke="#333"/>
  <text x="650" y="287" text-anchor="middle" font-size="13" fill="#222">데이터 D200</text>

  <!-- arrows -->
  <line x1="195" y1="115" x2="285" y2="115" stroke="#2F5597" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="480" y1="115" x2="556" y2="120" stroke="#2F5597" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="650" y1="157" x2="650" y2="172" stroke="#C00000" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="576" y1="192" x2="490" y2="192" stroke="#2F5597" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="290" y1="190" x2="148" y2="190" stroke="#2F5597" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="195" y1="278" x2="285" y2="278" stroke="#2F5597" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="290" y1="290" x2="198" y2="290" stroke="#2F5597" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="490" y1="280" x2="576" y2="280" stroke="#2F5597" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="576" y1="290" x2="490" y2="290" stroke="#2F5597" stroke-width="2" marker-end="url(#ar)"/>

  <text x="390" y="378" text-anchor="middle" font-size="13" fill="#C00000">HMI 스위치는 출력 P를 직접 켜지 않고 내부 릴레이 M을 거쳐 프로그램의 인터록을 통과시킨다</text>
</svg>
