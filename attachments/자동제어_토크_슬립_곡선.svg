<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
  <rect width="720" height="430" fill="#ffffff"/>
  <text x="360" y="28" font-size="17" font-weight="bold" fill="#2F5597" text-anchor="middle">3상 유도전동기의 속도–토크 곡선</text>

  <!-- axes -->
  <line x1="90" y1="330" x2="660" y2="330" stroke="#333" stroke-width="1.8"/>
  <line x1="90" y1="330" x2="90" y2="55" stroke="#333" stroke-width="1.8"/>
  <polygon points="660,330 650,325 650,335" fill="#333"/>
  <polygon points="90,55 85,65 95,65" fill="#333"/>
  <text x="104" y="62" font-size="14" fill="#333">토크 T</text>
  <text x="668" y="335" font-size="14" fill="#333">N</text>

  <!-- load torque line -->
  <line x1="90" y1="240" x2="640" y2="240" stroke="#888" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="100" y="258" font-size="13" fill="#666">부하 토크 (정격)</text>

  <!-- curve -->
  <polyline fill="none" stroke="#2F5597" stroke-width="3" points="90.0,206.1 103.5,203.5 117.0,200.8 130.5,197.9 144.0,195.0 157.5,191.9 171.0,188.8 184.5,185.5 198.0,182.1 211.5,178.5 225.0,174.8 238.5,171.0 252.0,167.1 265.5,163.0 279.0,158.8 292.5,154.4 306.0,150.0 319.5,145.5 333.0,140.8 346.5,136.2 360.0,131.5 373.5,126.8 387.0,122.3 400.5,118.0 414.0,114.0 427.5,110.5 441.0,107.6 454.5,105.7 462.6,105.1 468.0,105.0 473.4,105.1 481.5,105.8 489.6,107.3 497.7,109.5 505.8,112.7 513.9,116.9 522.0,122.3 530.1,129.0 538.2,137.0 546.3,146.5 554.4,157.6 562.5,170.2 570.6,184.6 578.7,200.5 586.8,218.0 594.9,236.9 603.0,257.0 611.1,278.2 619.2,300.1 627.3,322.5 630.0,330.0"/>

  <!-- start torque -->
  <circle cx="90" cy="206" r="5" fill="#C00000"/>
  <text x="100" y="222" font-size="13" fill="#C00000" font-weight="bold">기동 토크 (s = 1)</text>

  <!-- max torque -->
  <circle cx="468" cy="105" r="5" fill="#C00000"/>
  <line x1="468" y1="105" x2="468" y2="330" stroke="#C00000" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="380" y="92" font-size="13" fill="#C00000" font-weight="bold">최대(정동) 토크</text>

  <!-- operating point -->
  <circle cx="596" cy="240" r="6" fill="#ffffff" stroke="#C00000" stroke-width="2.5"/>
  <line x1="596" y1="240" x2="596" y2="330" stroke="#C00000" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="560" y="300" font-size="13" fill="#C00000" font-weight="bold" text-anchor="end">운전점</text>
  <text x="560" y="316" font-size="12" fill="#C00000" text-anchor="end">(s ≈ 0.03~0.06)</text>

  <!-- stable/unstable regions -->
  <text x="270" y="300" font-size="13" fill="#555" text-anchor="middle">가속 구간 (불안정 영역)</text>
  <text x="600" y="130" font-size="13" fill="#555" text-anchor="middle">안정 운전 영역</text>

  <!-- x ticks -->
  <text x="90" y="350" font-size="13" fill="#333" text-anchor="middle">0 (정지)</text>
  <text x="630" y="350" font-size="13" fill="#333" text-anchor="middle">Nₛ (동기 속도)</text>
  <line x1="630" y1="325" x2="630" y2="335" stroke="#333" stroke-width="1.5"/>
  <text x="90" y="372" font-size="13" fill="#2F5597" text-anchor="middle">s = 1</text>
  <text x="630" y="372" font-size="13" fill="#2F5597" text-anchor="middle">s = 0</text>
  <text x="360" y="388" font-size="13" fill="#2F5597" text-anchor="middle">← 슬립 s 커짐 (느려짐) · 속도 N 커짐 →</text>
  <text x="360" y="414" font-size="13" fill="#333" text-anchor="middle">동기 속도에서는 회전자가 자계를 따라잡아 유도 전류가 없으므로 토크 = 0</text>
</svg>
