<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<rect width="760" height="360" fill="#ffffff"/>
<text x="380.0" y="30.0" font-size="17" fill="#548235" text-anchor="middle" font-weight="bold">나사 표시 읽기 — 감김 방향 · 줄 수 · 나사 호칭 − 등급</text>
<rect x="150.0" y="70" width="70" height="56" rx="6" fill="#fff" stroke="#C00000" stroke-width="2.5"/>
<text x="185.0" y="108.0" font-size="26" fill="#C00000" text-anchor="middle" font-weight="bold">왼</text>
<rect x="232.0" y="70" width="80" height="56" rx="6" fill="#fff" stroke="#C00000" stroke-width="2.5"/>
<text x="272.0" y="108.0" font-size="26" fill="#C00000" text-anchor="middle" font-weight="bold">2줄</text>
<rect x="324.0" y="70" width="50" height="56" rx="6" fill="#fff" stroke="#548235" stroke-width="2.5"/>
<text x="349.0" y="108.0" font-size="26" fill="#548235" text-anchor="middle" font-weight="bold">M</text>
<rect x="386.0" y="70" width="60" height="56" rx="6" fill="#fff" stroke="#548235" stroke-width="2.5"/>
<text x="416.0" y="108.0" font-size="26" fill="#548235" text-anchor="middle" font-weight="bold">50</text>
<rect x="458.0" y="70" width="60" height="56" rx="6" fill="#fff" stroke="#548235" stroke-width="2.5"/>
<text x="488.0" y="108.0" font-size="26" fill="#548235" text-anchor="middle" font-weight="bold">×3</text>
<rect x="530.0" y="70" width="80" height="56" rx="6" fill="#fff" stroke="#2F5597" stroke-width="2.5"/>
<text x="570.0" y="108.0" font-size="26" fill="#2F5597" text-anchor="middle" font-weight="bold">-6H</text>
<line x1="185.0" y1="128.0" x2="65.0" y2="175.0" stroke="#C00000" stroke-width="1.3"/>
<text x="65.0" y="194.0" font-size="14" fill="#C00000" text-anchor="middle" font-weight="bold">감김 방향</text>
<text x="65.0" y="214.0" font-size="12" fill="#333" text-anchor="middle">왼나사</text>
<text x="65.0" y="231.0" font-size="12" fill="#333" text-anchor="middle">(오른나사는 생략)</text>
<line x1="272.0" y1="128.0" x2="185.0" y2="175.0" stroke="#C00000" stroke-width="1.3"/>
<text x="185.0" y="194.0" font-size="14" fill="#C00000" text-anchor="middle" font-weight="bold">줄 수</text>
<text x="185.0" y="214.0" font-size="12" fill="#333" text-anchor="middle">2줄 → 리드 = 2p</text>
<text x="185.0" y="231.0" font-size="12" fill="#333" text-anchor="middle">(1줄은 생략)</text>
<line x1="349.0" y1="128.0" x2="305.0" y2="175.0" stroke="#548235" stroke-width="1.3"/>
<text x="305.0" y="194.0" font-size="14" fill="#548235" text-anchor="middle" font-weight="bold">나사 종류</text>
<text x="305.0" y="214.0" font-size="12" fill="#333" text-anchor="middle">미터 나사</text>
<line x1="416.0" y1="128.0" x2="420.0" y2="175.0" stroke="#548235" stroke-width="1.3"/>
<text x="420.0" y="194.0" font-size="14" fill="#548235" text-anchor="middle" font-weight="bold">호칭 지름</text>
<text x="420.0" y="214.0" font-size="12" fill="#333" text-anchor="middle">바깥지름 50 mm</text>
<line x1="488.0" y1="128.0" x2="535.0" y2="175.0" stroke="#548235" stroke-width="1.3"/>
<text x="535.0" y="194.0" font-size="14" fill="#548235" text-anchor="middle" font-weight="bold">피치</text>
<text x="535.0" y="214.0" font-size="12" fill="#333" text-anchor="middle">3 mm (가는 나사라</text>
<text x="535.0" y="231.0" font-size="12" fill="#333" text-anchor="middle">반드시 적는다)</text>
<line x1="570.0" y1="128.0" x2="680.0" y2="175.0" stroke="#2F5597" stroke-width="1.3"/>
<text x="680.0" y="194.0" font-size="14" fill="#2F5597" text-anchor="middle" font-weight="bold">등급</text>
<text x="680.0" y="214.0" font-size="12" fill="#333" text-anchor="middle">대문자 H → 암나사</text>
<text x="680.0" y="231.0" font-size="12" fill="#333" text-anchor="middle">(수나사는 6g)</text>
<rect x="40" y="262" width="680" height="84" rx="6" fill="#E2EFDA" stroke="#548235"/>
<text x="56.0" y="286.0" font-size="13" fill="#333" text-anchor="start">해독: 왼나사, 2줄, 미터 가는 나사, 호칭 지름 50 mm, 피치 3 mm → 리드 = 2 × 3 = 6 mm, 암나사 등급 6H</text>
<text x="56.0" y="310.0" font-size="13" fill="#333" text-anchor="start">M20 → 오른 · 1줄 · 미터 보통 나사(피치 생략)    |    M15×1.5-6H/6g → 암나사 6H와 수나사 6g의 조합</text>
<text x="56.0" y="334.0" font-size="13" fill="#2F5597" text-anchor="start">유니파이는 순서가 다르다: 3/8-16UNC-2B = 지름 3/8인치, 1인치당 16산(리드 아님), 암나사 2B급</text>
</svg>
