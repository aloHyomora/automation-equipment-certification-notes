<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 395" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<defs><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#548235"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C00000"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect x="0" y="0" width="740" height="395" fill="#ffffff"/>
<text x="130" y="26" font-size="16" fill="#548235" text-anchor="middle" font-weight="bold">코일 스프링의 치수</text>
<rect x="60" y="56" width="140" height="10" fill="#999"/>
<rect x="60" y="254" width="140" height="10" fill="#999"/>
<line x1="80" y1="70.0" x2="180" y2="82.9" stroke="#548235" stroke-width="9" stroke-linecap="round"/>
<line x1="180" y1="82.9" x2="80" y2="95.7" stroke="#548235" stroke-width="9" stroke-linecap="round" opacity="0.35"/>
<line x1="80" y1="95.7" x2="180" y2="108.6" stroke="#548235" stroke-width="9" stroke-linecap="round"/>
<line x1="180" y1="108.6" x2="80" y2="121.4" stroke="#548235" stroke-width="9" stroke-linecap="round" opacity="0.35"/>
<line x1="80" y1="121.4" x2="180" y2="134.3" stroke="#548235" stroke-width="9" stroke-linecap="round"/>
<line x1="180" y1="134.3" x2="80" y2="147.1" stroke="#548235" stroke-width="9" stroke-linecap="round" opacity="0.35"/>
<line x1="80" y1="147.1" x2="180" y2="160.0" stroke="#548235" stroke-width="9" stroke-linecap="round"/>
<line x1="180" y1="160.0" x2="80" y2="172.9" stroke="#548235" stroke-width="9" stroke-linecap="round" opacity="0.35"/>
<line x1="80" y1="172.9" x2="180" y2="185.7" stroke="#548235" stroke-width="9" stroke-linecap="round"/>
<line x1="180" y1="185.7" x2="80" y2="198.6" stroke="#548235" stroke-width="9" stroke-linecap="round" opacity="0.35"/>
<line x1="80" y1="198.6" x2="180" y2="211.4" stroke="#548235" stroke-width="9" stroke-linecap="round"/>
<line x1="180" y1="211.4" x2="80" y2="224.3" stroke="#548235" stroke-width="9" stroke-linecap="round" opacity="0.35"/>
<line x1="80" y1="224.3" x2="180" y2="237.1" stroke="#548235" stroke-width="9" stroke-linecap="round"/>
<line x1="180" y1="237.1" x2="80" y2="250.0" stroke="#548235" stroke-width="9" stroke-linecap="round" opacity="0.35"/>
<line x1="80" y1="290" x2="180" y2="290" stroke="#333" stroke-width="1.5" marker-start="url(#ak)" marker-end="url(#ak)"/>
<line x1="80" y1="272" x2="80" y2="296" stroke="#333" stroke-dasharray="3 3"/><line x1="180" y1="272" x2="180" y2="296" stroke="#333" stroke-dasharray="3 3"/>
<text x="130" y="312" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">D: 코일 평균 지름 (소선 중심 간)</text>
<line x1="205" y1="160.0" x2="186" y2="160.0" stroke="#C00000" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="208" y="165.0" font-size="13" fill="#C00000" text-anchor="start" font-weight="bold">d 소선 지름</text>
<line x1="44" y1="66" x2="44" y2="254" stroke="#333" stroke-width="1.5" marker-start="url(#ak)" marker-end="url(#ak)"/>
<text x="30" y="160.0" font-size="12" fill="#333" text-anchor="middle" transform="rotate(-90 30 160.0)">자유 길이</text>
<text x="130" y="340" font-size="14" fill="#548235" text-anchor="middle" font-weight="bold">스프링 지수 C = D/d (보통 4~10)</text>
<text x="130" y="362" font-size="14" fill="#222" text-anchor="middle" font-weight="normal">δ = 8nD³W / (G d⁴),  k = W/δ</text>
<text x="420" y="26" font-size="16" fill="#548235" text-anchor="middle" font-weight="bold">직렬 — 더 부드럽게</text>
<rect x="370" y="50" width="100" height="10" fill="#999"/>
<polyline points="420.0,60.0 420.0,68.0 398.0,71.7 442.0,79.1 398.0,86.5 442.0,93.9 398.0,101.3 442.0,108.7 398.0,116.1 442.0,123.5 398.0,130.9 442.0,138.3 420.0,142.0 420.0,150.0" fill="none" stroke="#548235" stroke-width="3" stroke-linejoin="round"/>
<text x="452" y="108" font-size="15" fill="#548235" text-anchor="start" font-weight="bold">k₁</text>
<rect x="395" y="150" width="50" height="12" fill="#bbb" stroke="#666"/>
<polyline points="420.0,162.0 420.0,170.0 398.0,173.7 442.0,181.1 398.0,188.5 442.0,195.9 398.0,203.3 442.0,210.7 398.0,218.1 442.0,225.5 398.0,232.9 442.0,240.3 420.0,244.0 420.0,252.0" fill="none" stroke="#548235" stroke-width="3" stroke-linejoin="round"/>
<text x="452" y="210" font-size="15" fill="#548235" text-anchor="start" font-weight="bold">k₂</text>
<rect x="395" y="252" width="50" height="14" fill="#666"/>
<line x1="420" y1="266" x2="420" y2="300" stroke="#C00000" stroke-width="3" marker-end="url(#ar)"/>
<text x="436" y="296" font-size="15" fill="#C00000" text-anchor="start" font-weight="bold">W</text>
<text x="420" y="330" font-size="15" fill="#222" text-anchor="middle" font-weight="bold">1/k = 1/k₁ + 1/k₂</text>
<text x="420" y="352" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">처짐이 더해진다 δ = δ₁ + δ₂</text>
<text x="420" y="374" font-size="13" fill="#C00000" text-anchor="middle" font-weight="normal">10과 10 N/mm → 5 N/mm</text>
<text x="630" y="26" font-size="16" fill="#548235" text-anchor="middle" font-weight="bold">병렬 — 더 단단하게</text>
<rect x="550" y="50" width="160" height="10" fill="#999"/>
<polyline points="590.0,60.0 590.0,68.0 570.0,72.8 610.0,82.4 570.0,92.1 610.0,101.7 570.0,111.3 610.0,120.9 570.0,130.6 610.0,140.2 570.0,149.8 610.0,159.4 570.0,169.1 610.0,178.7 570.0,188.3 610.0,197.9 570.0,207.6 610.0,217.2 590.0,222.0 590.0,230.0" fill="none" stroke="#548235" stroke-width="3" stroke-linejoin="round"/>
<polyline points="670.0,60.0 670.0,68.0 650.0,72.8 690.0,82.4 650.0,92.1 690.0,101.7 650.0,111.3 690.0,120.9 650.0,130.6 690.0,140.2 650.0,149.8 690.0,159.4 650.0,169.1 690.0,178.7 650.0,188.3 690.0,197.9 650.0,207.6 690.0,217.2 670.0,222.0 670.0,230.0" fill="none" stroke="#548235" stroke-width="3" stroke-linejoin="round"/>
<text x="560" y="150" font-size="15" fill="#548235" text-anchor="end" font-weight="bold">k₁</text>
<text x="700" y="150" font-size="15" fill="#548235" text-anchor="start" font-weight="bold">k₂</text>
<rect x="565" y="230" width="130" height="14" fill="#666"/>
<line x1="630" y1="244" x2="630" y2="290" stroke="#C00000" stroke-width="3" marker-end="url(#ar)"/>
<text x="646" y="284" font-size="15" fill="#C00000" text-anchor="start" font-weight="bold">W</text>
<text x="630" y="330" font-size="15" fill="#222" text-anchor="middle" font-weight="bold">k = k₁ + k₂</text>
<text x="630" y="352" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">하중이 나눠진다 W = W₁ + W₂</text>
<text x="630" y="374" font-size="13" fill="#C00000" text-anchor="middle" font-weight="normal">10과 10 N/mm → 20 N/mm</text>

</svg>
