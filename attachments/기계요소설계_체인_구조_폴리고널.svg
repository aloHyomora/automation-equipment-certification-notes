<text x="115.0" y="158" font-size="13" fill="#C00000" text-anchor="middle" font-weight="bold">피치 p</text>
<line x1="80" y1="128" x2="80" y2="146" stroke="#C00000"/><line x1="150" y1="128" x2="150" y2="146" stroke="#C00000"/>
<text x="255.0" y="158" font-size="12" fill="#548235" text-anchor="middle" font-weight="normal">롤러 링크 (안쪽 판 + 부시 + 롤러)</text>
<text x="395.0" y="62" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">핀 링크 (바깥쪽 판 + 핀)</text>
<line x1="395" y1="66" x2="395" y2="74" stroke="#333"/>
<line x1="255" y1="145" x2="255" y2="113" stroke="#548235"/>
<text x="615" y="90" font-size="13" fill="#222" text-anchor="start" font-weight="bold">링크 수 짝수</text>
<text x="615" y="108" font-size="12" fill="#222" text-anchor="start" font-weight="normal">→ 안·바깥 판이</text>
<text x="615" y="124" font-size="12" fill="#222" text-anchor="start" font-weight="normal">번갈아 이어진다</text>
<text x="615" y="148" font-size="12" fill="#C00000" text-anchor="start" font-weight="bold">홀수 → 오프셋 링크</text>
<path d="M 625 170 L 660 170 Q 672 170 680 176 L 700 176" fill="none" stroke="#C00000" stroke-width="10" stroke-linecap="round" opacity="0.6"/>
<text x="663" y="198" font-size="11" fill="#555" text-anchor="middle" font-weight="normal">(한쪽 좁고 한쪽 넓게 굽은 판)</text>
<text x="370" y="228" font-size="15" fill="#548235" text-anchor="middle" font-weight="bold">폴리고널(다각형) 작용 — 스프로킷이 다각형처럼 돌아 체인 속도가 출렁인다</text>
<circle cx="120" cy="330" r="70" fill="none" stroke="#bbb" stroke-dasharray="4 4"/>
<polygon points="120.0,260.0 180.6,295.0 180.6,365.0 120.0,400.0 59.4,365.0 59.4,295.0" fill="#E2EFDA" stroke="#548235" stroke-width="2.5"/>
