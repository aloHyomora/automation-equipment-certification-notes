<text x="180" y="250" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">체인</text>
<text x="120" y="426" font-size="13" fill="#C00000" text-anchor="middle" font-weight="bold">꼭짓점이 위: 반지름 R</text>
<circle cx="380" cy="330" r="70" fill="none" stroke="#bbb" stroke-dasharray="4 4"/>
<polygon points="415.0,269.4 450.0,330.0 415.0,390.6 345.0,390.6 310.0,330.0 345.0,269.4" fill="#E2EFDA" stroke="#548235" stroke-width="2.5"/>
<circle cx="380" cy="330" r="5" fill="#548235"/>
<line x1="340" y1="269.4" x2="500" y2="269.4" stroke="#333" stroke-width="4"/>
<line x1="380" y1="330" x2="380" y2="269.4" stroke="#548235" stroke-width="2" marker-end="url(#ag)"/>
<text x="440" y="259.3782217350893" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">체인</text>
<text x="380" y="426" font-size="13" fill="#548235" text-anchor="middle" font-weight="bold">변이 위: R·cos(180°/z)</text>
<text x="250" y="285" font-size="22" fill="#555" text-anchor="middle" font-weight="normal">↔</text>
<text x="250" y="305" font-size="12" fill="#555" text-anchor="middle" font-weight="normal">회전하며</text>
<text x="250" y="320" font-size="12" fill="#555" text-anchor="middle" font-weight="normal">반복</text>
<rect x="520" y="262" width="210" height="140" rx="6" fill="#F7F7F7" stroke="#999"/>
<text x="625" y="286" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">체인 속도 v = r·ω</text>
<text x="625" y="308" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">r이 R ↔ R·cos(180°/z)</text>
<text x="625" y="330" font-size="13" fill="#C00000" text-anchor="middle" font-weight="bold">속도 변동률 = 1 − cos(180°/z)</text>
<text x="625" y="354" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">z = 6 → 13.4 %</text>
<text x="625" y="374" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">z = 20 → 1.2 %</text>
<text x="625" y="394" font-size="12" fill="#548235" text-anchor="middle" font-weight="bold">잇수 많을수록 작다</text>

</svg>
