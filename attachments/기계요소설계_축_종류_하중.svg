<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C00000"/></marker><marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#548235"/></marker></defs>
<rect width="840" height="400" fill="#ffffff"/>
<text x="420" y="28" font-size="17" fill="#548235" text-anchor="middle" font-weight="bold">하중으로 나눈 축의 종류 — 무엇을 받느냐가 설계식을 정한다</text>
<line x1="280" y1="50" x2="280" y2="385" stroke="#d9d9d9"/>
<line x1="560" y1="50" x2="560" y2="385" stroke="#d9d9d9"/>
<!-- 차축 -->
<text x="140" y="70" font-size="16" fill="#262626" text-anchor="middle" font-weight="bold">차축 (axle)</text>
<rect x="30" y="180" width="220" height="16" fill="#d9d9d9" stroke="#595959"/>
<rect x="66" y="130" width="16" height="116" rx="3" fill="#a9d18e" stroke="#548235"/>
<rect x="198" y="130" width="16" height="116" rx="3" fill="#a9d18e" stroke="#548235"/>
<rect x="56" y="246" width="36" height="10" fill="#7f7f7f"/>
<rect x="188" y="246" width="36" height="10" fill="#7f7f7f"/>
<text x="140" y="272" font-size="11" fill="#595959" text-anchor="middle">레일</text>
<line x1="40" y1="110" x2="40" y2="174" stroke="#C00000" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="240" y1="110" x2="240" y2="174" stroke="#C00000" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="40" y="104" font-size="13" fill="#C00000" text-anchor="middle">W</text>
<text x="240" y="104" font-size="13" fill="#C00000" text-anchor="middle">W</text>
<text x="140" y="120" font-size="11" fill="#595959" text-anchor="middle">차체 무게가 축 끝(저널)에</text>
<text x="140" y="305" font-size="15" fill="#C00000" text-anchor="middle" font-weight="bold">굽힘 M 만</text>
<text x="140" y="328" font-size="12" fill="#262626" text-anchor="middle">동력(토크)은 전하지 않는다</text>
<text x="140" y="350" font-size="12" fill="#595959" text-anchor="middle">예: 철도 차량 바퀴축</text>
<!-- 전동축 -->
<text x="420" y="70" font-size="16" fill="#262626" text-anchor="middle" font-weight="bold">전동축 (transmission shaft)</text>
<rect x="300" y="180" width="240" height="16" fill="#d9d9d9" stroke="#595959"/>
<rect x="326" y="196" width="20" height="14" fill="#7f7f7f"/>
<rect x="494" y="196" width="20" height="14" fill="#7f7f7f"/>
<path d="M336,210 l-12,16 h24 z" fill="none" stroke="#595959"/>
<path d="M504,210 l-12,16 h24 z" fill="none" stroke="#595959"/>
<text x="336" y="242" font-size="11" fill="#595959" text-anchor="middle">베어링</text>
<text x="504" y="242" font-size="11" fill="#595959" text-anchor="middle">베어링</text>
<rect x="410" y="130" width="22" height="116" rx="3" fill="#a9d18e" stroke="#548235"/>
<text x="421" y="122" font-size="11" fill="#548235" text-anchor="middle">풀리·기어</text>
<line x1="421" y1="250" x2="421" y2="286" stroke="#C00000" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="434" y="272" font-size="11" fill="#C00000">벨트 장력 → M</text>
<path d="M306,166 A 10 26 0 1 0 306,210" fill="none" stroke="#C00000" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="308" y="156" font-size="12" fill="#C00000">T (모터)</text>
<text x="420" y="305" font-size="15" fill="#C00000" text-anchor="middle" font-weight="bold">굽힘 M + 비틀림 T</text>
<text x="420" y="328" font-size="12" fill="#262626" text-anchor="middle">동력을 전하며 휘기도 한다</text>
<text x="420" y="350" font-size="12" fill="#595959" text-anchor="middle">예: 공장 동력축, 풀리·기어 달린 축</text>
<!-- 스핀들 -->
<text x="700" y="70" font-size="16" fill="#262626" text-anchor="middle" font-weight="bold">스핀들 (spindle)</text>
<rect x="610" y="158" width="140" height="60" fill="#f2f2f2" stroke="#7f7f7f"/>
<text x="680" y="150" font-size="11" fill="#595959" text-anchor="middle">주축대(베어링 하우징)</text>
<rect x="590" y="180" width="200" height="16" fill="#d9d9d9" stroke="#595959"/>
<rect x="780" y="170" width="24" height="36" fill="#a9d18e" stroke="#548235"/>
<path d="M804,184 L832,188 L804,192 z" fill="#7f7f7f"/>
<text x="796" y="232" font-size="11" fill="#548235" text-anchor="middle">척·공구</text>
<path d="M596,166 A 10 26 0 1 0 596,210" fill="none" stroke="#C00000" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="598" y="140" font-size="12" fill="#C00000">T</text>
<text x="700" y="305" font-size="15" fill="#C00000" text-anchor="middle" font-weight="bold">주로 비틀림 T</text>
<text x="700" y="328" font-size="12" fill="#262626" text-anchor="middle">짧고 굵게, 변형을 아주 작게(정밀)</text>
<text x="700" y="350" font-size="12" fill="#595959" text-anchor="middle">예: 선반·밀링 주축</text>
</svg>
