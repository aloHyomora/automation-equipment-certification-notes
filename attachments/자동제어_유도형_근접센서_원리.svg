<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<defs>
<marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#2F5597"/></marker>
<marker id="r" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#C00000"/></marker>
</defs>
<rect width="780" height="430" fill="#ffffff"/>
<text x="390" y="28" font-size="17" font-weight="bold" fill="#2F5597" text-anchor="middle">유도형(고주파 발진형) 근접센서의 동작 순서</text>

<!-- block chain -->
<rect x="30" y="50" width="130" height="50" rx="6" fill="#DEEBF7" stroke="#2F5597" stroke-width="2"/>
<text x="95" y="72" font-size="13" font-weight="bold" fill="#2F5597" text-anchor="middle">① 발진 회로</text>
<text x="95" y="90" font-size="11" fill="#333" text-anchor="middle">검출 코일에 고주파</text>
<rect x="215" y="50" width="130" height="50" rx="6" fill="#FBE5E5" stroke="#C00000" stroke-width="2"/>
<text x="280" y="72" font-size="13" font-weight="bold" fill="#C00000" text-anchor="middle">② 와전류 손실</text>
<text x="280" y="90" font-size="11" fill="#333" text-anchor="middle">금속이 다가오면</text>
<rect x="400" y="50" width="130" height="50" rx="6" fill="#DEEBF7" stroke="#2F5597" stroke-width="2"/>
<text x="465" y="72" font-size="13" font-weight="bold" fill="#2F5597" text-anchor="middle">③ 검파</text>
<text x="465" y="90" font-size="11" fill="#333" text-anchor="middle">진폭 감소·정지 감지</text>
<rect x="585" y="50" width="165" height="50" rx="6" fill="#DEEBF7" stroke="#2F5597" stroke-width="2"/>
<text x="667" y="72" font-size="13" font-weight="bold" fill="#2F5597" text-anchor="middle">④ 비교(응차)·출력</text>
<text x="667" y="90" font-size="11" fill="#333" text-anchor="middle">트랜지스터 ON/OFF</text>
<line x1="160" y1="75" x2="211" y2="75" stroke="#2F5597" stroke-width="2" marker-end="url(#a)"/>
<line x1="345" y1="75" x2="396" y2="75" stroke="#2F5597" stroke-width="2" marker-end="url(#a)"/>
<line x1="530" y1="75" x2="581" y2="75" stroke="#2F5597" stroke-width="2" marker-end="url(#a)"/>

<!-- sensor head (side view) -->
<rect x="40" y="170" width="150" height="90" rx="4" fill="#F2F2F2" stroke="#595959" stroke-width="2"/>
<text x="115" y="160" font-size="12" fill="#333" text-anchor="middle">센서 본체</text>
<rect x="190" y="180" width="18" height="70" fill="#DEEBF7" stroke="#2F5597" stroke-width="2"/>
<text x="199" y="275" font-size="11" fill="#2F5597" text-anchor="middle">검출면</text>
<!-- coil -->
<g stroke="#2F5597" stroke-width="2" fill="none">
<ellipse cx="170" cy="190" rx="10" ry="5"/><ellipse cx="170" cy="203" rx="10" ry="5"/><ellipse cx="170" cy="216" rx="10" ry="5"/><ellipse cx="170" cy="229" rx="10" ry="5"/><ellipse cx="170" cy="242" rx="10" ry="5"/>
</g>
<text x="120" y="219" font-size="12" fill="#2F5597" text-anchor="middle">코일</text>
<!-- field lines -->
<g stroke="#2F5597" stroke-width="1.5" fill="none" stroke-dasharray="5 4">
<path d="M208,195 C260,170 260,260 208,235"/>
<path d="M208,188 C290,140 290,290 208,242"/>
<path d="M208,182 C320,110 320,320 208,248"/>
</g>
<text x="250" y="130" font-size="11" fill="#2F5597">고주파 자계</text>
<!-- metal target -->
<rect x="300" y="165" width="30" height="100" fill="#BFBFBF" stroke="#595959" stroke-width="2"/>
<text x="315" y="285" font-size="12" fill="#333" text-anchor="middle">금속 검출체</text>
<ellipse cx="315" cy="215" rx="9" ry="28" fill="none" stroke="#C00000" stroke-width="2"/>
<path d="M324,206 L324,198 L330,204" fill="none" stroke="#C00000" stroke-width="2"/>
<text x="345" y="210" font-size="12" fill="#C00000">와전류</text>
<text x="345" y="226" font-size="11" fill="#C00000">(에너지를 빼앗음)</text>
<line x1="380" y1="300" x2="335" y2="300" stroke="#595959" stroke-width="1.5" marker-end="url(#a)"/>
<text x="358" y="318" font-size="11" fill="#333" text-anchor="middle">검출체가 다가옴</text>

<!-- waveforms -->
<text x="470" y="140" font-size="13" font-weight="bold" fill="#333">발진 진폭</text>
<line x1="470" y1="200" x2="750" y2="200" stroke="#BFBFBF"/>
<path d="M470,200 L480,160 L490,240 L500,160 L510,240 L520,160 L530,240 L540,160 L550,240 L560,160 L570,240 L580,160 L590,200" fill="none" stroke="#2F5597" stroke-width="1.8"/>
<path d="M590,200 L600,188 L610,212 L620,192 L630,208 L640,196 L650,204 L660,199 L670,201 L680,200 L750,200" fill="none" stroke="#C00000" stroke-width="1.8"/>
<line x1="590" y1="150" x2="590" y2="250" stroke="#7F7F7F" stroke-dasharray="3 3"/>
<text x="530" y="268" font-size="11" fill="#2F5597" text-anchor="middle">금속 없음: 크게 발진</text>
<text x="670" y="268" font-size="11" fill="#C00000" text-anchor="middle">금속 접근: 감쇠·정지</text>
<text x="470" y="300" font-size="13" font-weight="bold" fill="#333">출력</text>
<path d="M470,350 L590,350 L590,318 L750,318" fill="none" stroke="#333" stroke-width="2"/>
<text x="530" y="368" font-size="11" fill="#333" text-anchor="middle">OFF</text>
<text x="670" y="310" font-size="11" fill="#333" text-anchor="middle">ON</text>

<text x="390" y="400" font-size="13" fill="#333" text-anchor="middle">코일이 만드는 자계 속에 <tspan fill="#C00000" font-weight="bold">금속</tspan>이 들어올 때만 와전류가 생긴다 → 플라스틱·나무·물은 반응 없음</text>
<text x="390" y="420" font-size="12" fill="#7F7F7F" text-anchor="middle">와전류 손실이 큰 철(자성체)에서 검출 거리가 가장 길고, 알루미늄·구리는 짧아진다</text>
</svg>
