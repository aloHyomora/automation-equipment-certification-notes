<text x="25.0" y="295.0" font-size="12" fill="#333" text-anchor="start">· 구름 마찰 → 기동 마찰도 작다</text>
<text x="25.0" y="315.0" font-size="12" fill="#333" text-anchor="start">· 접촉 면적이 작아 충격에 약하고 소음</text>
<text x="25.0" y="335.0" font-size="12" fill="#333" text-anchor="start">· 표준 규격품 → 번호로 사서 바로 교환</text>
