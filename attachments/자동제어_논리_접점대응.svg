<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<rect width="780" height="300" fill="#ffffff"/>
<text x="390" y="26" font-size="16" font-weight="bold" fill="#2F5597" text-anchor="middle">논리 ↔ 접점 회로: 직렬 = AND, 병렬 = OR, b접점 = NOT</text>
<line x1="20" y1="100" x2="60" y2="100" stroke="#333" stroke-width="2.5"/><line x1="60" y1="84" x2="60" y2="116" stroke="#2F5597" stroke-width="3"/><line x1="82" y1="84" x2="82" y2="116" stroke="#2F5597" stroke-width="3"/><text x="71" y="76" font-size="14" font-weight="bold" fill="#2F5597" text-anchor="middle">A</text><line x1="82" y1="100" x2="110" y2="100" stroke="#333" stroke-width="2.5"/><line x1="110" y1="84" x2="110" y2="116" stroke="#2F5597" stroke-width="3"/><line x1="132" y1="84" x2="132" y2="116" stroke="#2F5597" stroke-width="3"/><text x="121" y="76" font-size="14" font-weight="bold" fill="#2F5597" text-anchor="middle">B</text><line x1="132" y1="100" x2="180" y2="100" stroke="#333" stroke-width="2.5"/><circle cx="194" cy="100" r="14" fill="#fff" stroke="#C55A11" stroke-width="3"/><line x1="184" y1="90" x2="204" y2="110" stroke="#C55A11" stroke-width="2.5"/><line x1="184" y1="110" x2="204" y2="90" stroke="#C55A11" stroke-width="2.5"/><line x1="208" y1="100" x2="240" y2="100" stroke="#333" stroke-width="2.5"/><text x="130" y="150" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">AND = 직렬</text><text x="130" y="172" font-size="13" fill="#555" text-anchor="middle">둘 다 닫혀야 램프 ON</text><text x="130" y="194" font-size="14" fill="#2F5597" text-anchor="middle">Y = A · B</text><line x1="280" y1="100" x2="310" y2="100" stroke="#333" stroke-width="2.5"/><line x1="310" y1="70" x2="310" y2="130" stroke="#333" stroke-width="2.5"/><line x1="310" y1="70" x2="330" y2="70" stroke="#333" stroke-width="2.5"/><line x1="330" y1="54" x2="330" y2="86" stroke="#2F5597" stroke-width="3"/><line x1="352" y1="54" x2="352" y2="86" stroke="#2F5597" stroke-width="3"/><text x="341" y="46" font-size="14" font-weight="bold" fill="#2F5597" text-anchor="middle">A</text><line x1="352" y1="70" x2="380" y2="70" stroke="#333" stroke-width="2.5"/><line x1="310" y1="130" x2="330" y2="130" stroke="#333" stroke-width="2.5"/><line x1="330" y1="114" x2="330" y2="146" stroke="#2F5597" stroke-width="3"/><line x1="352" y1="114" x2="352" y2="146" stroke="#2F5597" stroke-width="3"/><text x="341" y="106" font-size="14" font-weight="bold" fill="#2F5597" text-anchor="middle">B</text><line x1="352" y1="130" x2="380" y2="130" stroke="#333" stroke-width="2.5"/><line x1="380" y1="70" x2="380" y2="130" stroke="#333" stroke-width="2.5"/><line x1="380" y1="100" x2="440" y2="100" stroke="#333" stroke-width="2.5"/><circle cx="454" cy="100" r="14" fill="#fff" stroke="#C55A11" stroke-width="3"/><line x1="444" y1="90" x2="464" y2="110" stroke="#C55A11" stroke-width="2.5"/><line x1="444" y1="110" x2="464" y2="90" stroke="#C55A11" stroke-width="2.5"/><line x1="468" y1="100" x2="500" y2="100" stroke="#333" stroke-width="2.5"/><text x="390" y="170" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">OR = 병렬</text><text x="390" y="192" font-size="13" fill="#555" text-anchor="middle">하나만 닫혀도 램프 ON</text><text x="390" y="214" font-size="14" fill="#2F5597" text-anchor="middle">Y = A + B</text><line x1="540" y1="100" x2="610" y2="100" stroke="#333" stroke-width="2.5"/><line x1="610" y1="84" x2="610" y2="116" stroke="#2F5597" stroke-width="3"/><line x1="632" y1="84" x2="632" y2="116" stroke="#2F5597" stroke-width="3"/><line x1="607" y1="118" x2="635" y2="82" stroke="#C00000" stroke-width="2.5"/><text x="621" y="76" font-size="14" font-weight="bold" fill="#2F5597" text-anchor="middle">A</text><line x1="632" y1="100" x2="680" y2="100" stroke="#333" stroke-width="2.5"/><circle cx="694" cy="100" r="14" fill="#fff" stroke="#C55A11" stroke-width="3"/><line x1="684" y1="90" x2="704" y2="110" stroke="#C55A11" stroke-width="2.5"/><line x1="684" y1="110" x2="704" y2="90" stroke="#C55A11" stroke-width="2.5"/><line x1="708" y1="100" x2="750" y2="100" stroke="#333" stroke-width="2.5"/><text x="640" y="150" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">NOT = b접점</text><text x="640" y="172" font-size="13" fill="#555" text-anchor="middle">A를 누르면 끊겨 램프 OFF</text><text x="640" y="194" font-size="14" fill="#2F5597" text-anchor="middle">Y = A̅</text><text x="390" y="270" font-size="13" fill="#555" text-anchor="middle">드모르간으로: NAND = A, B의 b접점을 병렬, NOR = A, B의 b접점을 직렬 (¬(A·B) = ¬A + ¬B, ¬(A+B) = ¬A · ¬B)</text></svg>