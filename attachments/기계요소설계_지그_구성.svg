<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<rect width="720" height="380" fill="#ffffff"/>
<text x="360" y="26" font-size="17" fill="#548235" text-anchor="middle" font-weight="bold">드릴 지그의 구성 — 치공구 3요소 + 부시</text>
<!-- drill -->
<rect x="196" y="44" width="18" height="70" fill="#7F7F7F" stroke="#333"/>
<polygon points="196,114 214,114 205,128" fill="#7F7F7F" stroke="#333"/>
<text x="222" y="60" font-size="12" fill="#333">드릴</text>
<!-- bush plate -->
<rect x="80" y="118" width="250" height="20" fill="#A9D18E" stroke="#548235"/>
<rect x="190" y="112" width="30" height="34" fill="#FFE699" stroke="#BF9000" stroke-width="2"/>
<rect x="198" y="112" width="14" height="34" fill="#ffffff" stroke="#BF9000"/>
<line x1="80" y1="138" x2="80" y2="300" stroke="#548235" stroke-width="10"/>
<!-- workpiece -->
<rect x="110" y="196" width="200" height="60" fill="#F4B183" stroke="#C55A11" stroke-width="2"/>
<text x="250" y="232" font-size="13" text-anchor="middle" fill="#333">공작물</text>
<line x1="205" y1="196" x2="205" y2="256" stroke="#C00000" stroke-width="2" stroke-dasharray="5 4"/>
<!-- base -->
<rect x="70" y="256" width="280" height="44" fill="#D9D9D9" stroke="#555" stroke-width="2"/>
<line x1="110" y1="256" x2="310" y2="256" stroke="#C00000" stroke-width="4"/>
<!-- locating pin -->
<rect x="138" y="232" width="14" height="40" fill="#8FAADC" stroke="#2F5597"/>
<!-- clamp -->
<rect x="250" y="168" width="70" height="14" fill="#8FAADC" stroke="#2F5597"/>
<rect x="300" y="182" width="12" height="74" fill="#8FAADC" stroke="#2F5597"/>
<polygon points="262,182 272,182 267,196" fill="#2F5597"/>
<!-- labels -->
<g font-size="13" fill="#333">
<line x1="220" y1="128" x2="360" y2="80" stroke="#BF9000"/><text x="365" y="84" fill="#BF9000" font-weight="bold">부시 — 드릴 안내 (지그에만 있음)</text>
<line x1="320" y1="172" x2="365" y2="128" stroke="#2F5597"/><text x="370" y="132" fill="#2F5597" font-weight="bold">③ 클램프 — 공작물 고정</text>
<line x1="152" y1="244" x2="365" y2="176" stroke="#2F5597"/><text x="370" y="180" fill="#2F5597" font-weight="bold">② 위치 결정구(핀) — 미끄럼 방지</text>
<line x1="300" y1="256" x2="365" y2="224" stroke="#C00000"/><text x="370" y="228" fill="#C00000" font-weight="bold">① 위치 결정면 — 기준면</text>
<text x="370" y="252" font-size="12" fill="#555">(빨간 선이 공작물이 놓이는 면)</text>
</g>
<text x="210" y="322" font-size="12" text-anchor="middle" fill="#555">점선 = 뚫을 구멍 위치 (부시 중심과 일치)</text>
<!-- compare table -->
<rect x="380" y="276" width="320" height="86" rx="6" fill="#F3F8EF" stroke="#548235"/>
<text x="400" y="302" font-size="14" font-weight="bold" fill="#548235">지그(jig)</text>
<text x="490" y="302" font-size="13" fill="#333">위치 결정 + 고정 + <tspan fill="#C00000" font-weight="bold">공구 안내(부시)</tspan></text>
<text x="400" y="336" font-size="14" font-weight="bold" fill="#548235">고정구</text>
<text x="490" y="336" font-size="13" fill="#333">위치 결정 + 고정 (부시 없음)</text>
<text x="490" y="354" font-size="11" fill="#555">밀링·용접 등에서 공작물만 잡아 줌</text>
</svg>
