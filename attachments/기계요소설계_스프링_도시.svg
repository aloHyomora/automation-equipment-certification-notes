<line x1="165.0" y1="115.0" x2="182.5" y2="55.0" stroke="#333" stroke-width="7" stroke-linecap="round"/>
<line x1="182.5" y1="55.0" x2="200.0" y2="115.0" stroke="#333" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="4 3"/>
<line x1="200.0" y1="115.0" x2="217.5" y2="55.0" stroke="#333" stroke-width="7" stroke-linecap="round"/>
<line x1="217.5" y1="55.0" x2="235.0" y2="115.0" stroke="#333" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="4 3"/>
<line x1="235.0" y1="115.0" x2="252.5" y2="55.0" stroke="#333" stroke-width="7" stroke-linecap="round"/>
<line x1="252.5" y1="55.0" x2="270.0" y2="115.0" stroke="#333" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="4 3"/>
<line x1="270.0" y1="115.0" x2="287.5" y2="55.0" stroke="#333" stroke-width="7" stroke-linecap="round"/>
<line x1="287.5" y1="55.0" x2="305.0" y2="115.0" stroke="#333" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="4 3"/>
<line x1="305.0" y1="115.0" x2="322.5" y2="55.0" stroke="#333" stroke-width="7" stroke-linecap="round"/>
<line x1="322.5" y1="55.0" x2="340.0" y2="115.0" stroke="#333" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="4 3"/>
<line x1="40" y1="85" x2="360" y2="85" stroke="#777" stroke-width="1" stroke-dasharray="14 3 2 3"/>
<text x="200" y="140" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">하중 없이 늘어난 자유 길이 그대로 · 특별한 지시 없으면 오른쪽 감기</text>
<text x="400" y="30" font-size="15" fill="#548235" text-anchor="start" font-weight="bold">② 중간 생략 — 소선 중심선을 가는 1점 쇄선으로</text>
<line x1="420.0" y1="115.0" x2="437.5" y2="55.0" stroke="#333" stroke-width="7" stroke-linecap="round"/>
<line x1="437.5" y1="55.0" x2="455.0" y2="115.0" stroke="#333" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="4 3"/>
<line x1="455.0" y1="115.0" x2="472.5" y2="55.0" stroke="#333" stroke-width="7" stroke-linecap="round"/>
<line x1="472.5" y1="55.0" x2="490.0" y2="115.0" stroke="#333" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="4 3"/>
<line x1="630.0" y1="115.0" x2="647.5" y2="55.0" stroke="#333" stroke-width="7" stroke-linecap="round"/>
<line x1="647.5" y1="55.0" x2="665.0" y2="115.0" stroke="#333" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="4 3"/>
<line x1="665.0" y1="115.0" x2="682.5" y2="55.0" stroke="#333" stroke-width="7" stroke-linecap="round"/>
<line x1="682.5" y1="55.0" x2="700.0" y2="115.0" stroke="#333" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="4 3"/>
<line x1="490.0" y1="55" x2="630.0" y2="55" stroke="#C00000" stroke-width="1.3" stroke-dasharray="14 3 2 3"/>
<line x1="490.0" y1="115" x2="630.0" y2="115" stroke="#C00000" stroke-width="1.3" stroke-dasharray="14 3 2 3"/>
<text x="560" y="140" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">양 끝만 그리고 같은 모양 부분은 생략</text>
<text x="30" y="185" font-size="15" fill="#548235" text-anchor="start" font-weight="bold">③ 간략도 — 소선 중심선만 굵은 실선</text>
<polyline points="60.0,265 77.5,215 95.0,265 112.5,215 130.0,265 147.5,215 165.0,265 182.5,215 200.0,265 217.5,215 235.0,265 252.5,215 270.0,265 287.5,215 305.0,265 322.5,215 340.0,265" fill="none" stroke="#111" stroke-width="3.5"/>
<text x="200" y="295" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">조립도에서는 코일 단면만 그려도 된다</text>
<text x="400" y="185" font-size="15" fill="#548235" text-anchor="start" font-weight="bold">④ 겹판 스프링 — 상용 하중 상태(판이 수평)</text>
<path d="M 420 218 Q 560 268 700 218" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="14 3 2 3 2 3"/>
<text x="700" y="210" font-size="12" fill="#555" text-anchor="end" font-weight="normal">무하중 모양: 가상선</text>
<rect x="420.0" y="248" width="280" height="7" fill="#E2EFDA" stroke="#548235" stroke-width="1.5"/>
<rect x="450.0" y="257" width="220" height="7" fill="#E2EFDA" stroke="#548235" stroke-width="1.5"/>
<rect x="480.0" y="266" width="160" height="7" fill="#E2EFDA" stroke="#548235" stroke-width="1.5"/>
<rect x="510.0" y="275" width="100" height="7" fill="#E2EFDA" stroke="#548235" stroke-width="1.5"/>
<circle cx="416" cy="251" r="8" fill="none" stroke="#548235" stroke-width="3"/><circle cx="704" cy="251" r="8" fill="none" stroke="#548235" stroke-width="3"/>
<rect x="548" y="240" width="24" height="46" fill="none" stroke="#333" stroke-width="2"/>
<text x="560" y="305" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">판은 곧게, 무하중일 때 휜 모양은 가상선(가는 2점 쇄선)</text>
<rect x="30" y="322" width="680" height="30" rx="6" fill="#FBE5D6" stroke="#C00000"/>
<text x="370" y="342" font-size="14" fill="#C00000" text-anchor="middle" font-weight="bold">원칙: 코일·벌류트·스파이럴·접시 스프링 = 무하중  /  겹판 스프링만 = 상용 하중 상태</text>

</svg>
