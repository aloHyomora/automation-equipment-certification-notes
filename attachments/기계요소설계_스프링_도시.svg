<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 365" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<defs><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#548235"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C00000"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect x="0" y="0" width="740" height="365" fill="#ffffff"/>
<text x="30" y="30" font-size="15" fill="#548235" text-anchor="start" font-weight="bold">① 코일 스프링 — 무하중 상태, 나선은 직선으로</text>
<line x1="60.0" y1="115.0" x2="77.5" y2="55.0" stroke="#333" stroke-width="7" stroke-linecap="round"/>
<line x1="77.5" y1="55.0" x2="95.0" y2="115.0" stroke="#333" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="4 3"/>
<line x1="95.0" y1="115.0" x2="112.5" y2="55.0" stroke="#333" stroke-width="7" stroke-linecap="round"/>
<line x1="112.5" y1="55.0" x2="130.0" y2="115.0" stroke="#333" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="4 3"/>
