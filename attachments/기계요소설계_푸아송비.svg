<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C00000"/></marker>
<marker id="dm" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
</defs>
<rect width="720" height="300" fill="#ffffff"/>
<text x="360" y="28" font-size="18" fill="#548235" text-anchor="middle" font-weight="bold">늘이면 가늘어진다 — 세로 변형률과 가로 변형률</text>
<!-- original bar dashed -->
<rect x="150" y="80" width="300" height="80" fill="none" stroke="#7F7F7F" stroke-width="2" stroke-dasharray="6 4"/>
<text x="300" y="72" font-size="12" text-anchor="middle" fill="#7F7F7F">하중 전 (길이 l, 지름 d)</text>
<!-- deformed bar -->
<rect x="150" y="90" width="370" height="60" fill="#A9D18E" fill-opacity="0.75" stroke="#548235" stroke-width="2"/>
<line x1="150" y1="120" x2="100" y2="120" stroke="#C00000" stroke-width="3" marker-end="url(#ar)"/>
<line x1="520" y1="120" x2="570" y2="120" stroke="#C00000" stroke-width="3" marker-end="url(#ar)"/>
<text x="110" y="110" font-size="14" fill="#C00000">P</text>
<text x="552" y="110" font-size="14" fill="#C00000">P</text>
<!-- dims -->
<line x1="150" y1="190" x2="450" y2="190" stroke="#333" marker-start="url(#dm)" marker-end="url(#dm)"/>
<text x="300" y="183" font-size="13" text-anchor="middle" fill="#333">l</text>
<line x1="450" y1="190" x2="520" y2="190" stroke="#C00000" stroke-width="2" marker-start="url(#dm)" marker-end="url(#dm)"/>
<text x="485" y="183" font-size="13" text-anchor="middle" fill="#C00000">Δl</text>
<line x1="600" y1="80" x2="600" y2="160" stroke="#7F7F7F" marker-start="url(#dm)" marker-end="url(#dm)"/>
<text x="610" y="124" font-size="13" fill="#7F7F7F">d</text>
<line x1="640" y1="90" x2="640" y2="150" stroke="#548235" stroke-width="2" marker-start="url(#dm)" marker-end="url(#dm)"/>
<text x="650" y="124" font-size="13" fill="#548235">d − Δd</text>
<g font-size="14" fill="#333">
<text x="40" y="232">세로 변형률 ε = Δl / l   (늘어난 비율)</text>
<text x="40" y="256">가로 변형률 ε′ = Δd / d   (가늘어진 비율)</text>
<text x="40" y="280" fill="#C00000" font-weight="bold">푸아송 비 ν = ε′ / ε   (강철 약 0.3)</text>
<text x="420" y="256">훅의 법칙 σ = Eε</text>
<text x="420" y="280">변형량 Δl = Pl / (AE)</text>
</g>
</svg>
