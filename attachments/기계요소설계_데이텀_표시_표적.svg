<line x1="220" y1="100" x2="220" y2="78" stroke="#000" stroke-width="1"/>
<line x1="50" y1="84" x2="220" y2="84" stroke="#000" stroke-width="1" marker-end="url(#ar)" marker-start="url(#ar)"/>
<text x="135" y="80" font-size="12" text-anchor="middle" fill="#000">60</text>
<polygon points="89,160 111,160 100,174" fill="#000"/>
