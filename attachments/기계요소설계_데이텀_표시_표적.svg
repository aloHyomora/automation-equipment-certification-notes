<line x1="653" y1="153" x2="667" y2="167" stroke="#000" stroke-width="2"/><line x1="653" y1="167" x2="667" y2="153" stroke="#000" stroke-width="2"/>
<line x1="610" y1="160" x2="660" y2="160" stroke="#000" stroke-width="1"/>
<text x="635" y="185" font-size="12" text-anchor="middle" fill="#222">선</text>
<circle cx="725" cy="155" r="20" fill="url(#hat)" stroke="#000" stroke-width="1.2" stroke-dasharray="10,3,2,3,2,3"/>
