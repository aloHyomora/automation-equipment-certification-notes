<text x="645" y="107" font-size="10.5" text-anchor="middle" fill="#000">φ10</text>
<text x="645" y="126" font-size="11" text-anchor="middle" fill="#000" font-weight="bold">A1</text>
<line x1="660" y1="124" x2="710" y2="140" stroke="#000" stroke-width="1" marker-end="url(#ar)"/>
<text x="655" y="225" font-size="12" text-anchor="middle" fill="#222">위칸: 표적 영역 크기 / 아래칸: 문자+번호</text>
<text x="655" y="245" font-size="12" text-anchor="middle" fill="#222">면 전체가 거칠어 기준으로 못 쓸 때</text>
<text x="655" y="262" font-size="12" text-anchor="middle" fill="#C00000">점 표적은 닿는 곳이 작아 마모 주의</text>
</svg>