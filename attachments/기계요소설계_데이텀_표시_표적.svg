<text x="100" y="208" font-size="15" text-anchor="middle" fill="#000">A</text>
<text x="135" y="245" font-size="12.5" text-anchor="middle" fill="#222">삼각형을 치수선과 어긋나게</text>
<text x="135" y="262" font-size="12.5" text-anchor="middle" fill="#C00000">→ 그 면(아랫면)이 데이텀</text>
<text x="385" y="62" font-size="15" text-anchor="middle" fill="#548235" font-weight="bold">② 축선이 데이텀</text>
