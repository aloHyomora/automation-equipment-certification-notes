<line x1="470" y1="145" x2="495" y2="145" stroke="#000" stroke-width="1"/>
<line x1="490" y1="95" x2="490" y2="145" stroke="#000" stroke-width="1" marker-end="url(#ar)" marker-start="url(#ar)"/>
<text x="496" y="124" font-size="12" text-anchor="start" fill="#000">φ20</text>
<polygon points="479,145 501,145 490,159" fill="#000"/>
<line x1="490" y1="159" x2="490" y2="175" stroke="#000" stroke-width="1.5"/>
<rect x="476" y="175" width="28" height="28" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="490" y="195" font-size="15" text-anchor="middle" fill="#000">B</text>
<text x="385" y="245" font-size="12.5" text-anchor="middle" fill="#222">삼각형을 치수선 연장선 위에</text>
<text x="385" y="262" font-size="12.5" text-anchor="middle" fill="#C00000">→ φ20의 축선이 데이텀</text>
<text x="645" y="62" font-size="15" text-anchor="middle" fill="#548235" font-weight="bold">③ 데이텀 표적</text>
<rect x="540" y="85" width="230" height="110" fill="#fafafa" stroke="#888" stroke-width="1"/>
<line x1="563" y1="153" x2="577" y2="167" stroke="#000" stroke-width="2"/><line x1="563" y1="167" x2="577" y2="153" stroke="#000" stroke-width="2"/>
<text x="570" y="185" font-size="12" text-anchor="middle" fill="#222">점</text>
