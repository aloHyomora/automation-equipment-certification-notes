<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 280" width="790" height="280" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C00000"/></marker><pattern id="hat" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#548235" stroke-width="1.2"/></pattern></defs>
<rect width="790" height="280" fill="#fff"/>
<text x="395.0" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#548235">데이텀 삼각형의 위치와 데이텀 표적</text>
<text x="135" y="62" font-size="15" text-anchor="middle" fill="#548235" font-weight="bold">① 표면이 데이텀</text>
<rect x="50" y="100" width="170" height="60" fill="#EEF5E9" stroke="#548235" stroke-width="2"/>
