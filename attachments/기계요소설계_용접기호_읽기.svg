<path d="M700,214 L700,196 L732,196 L732,214" fill="none" stroke="#C00000" stroke-width="2"/>
<text x="716" y="236" font-size="13" fill="#333" text-anchor="middle" font-weight="bold">플러그 · 슬롯</text>
<line x1="491" y1="298" x2="591" y2="298" stroke="#333" stroke-width="1.5"/>
<circle cx="541" cy="286" r="11" fill="none" stroke="#C00000" stroke-width="2"/>
<text x="541" y="320" font-size="13" fill="#333" text-anchor="middle" font-weight="bold">스폿(점)</text>
<line x1="666" y1="298" x2="766" y2="298" stroke="#333" stroke-width="1.5"/>
<circle cx="716" cy="286" r="11" fill="none" stroke="#C00000" stroke-width="2"/><path d="M698,282 L734,282 M698,290 L734,290" fill="none" stroke="#C00000" stroke-width="2"/>
<text x="716" y="320" font-size="13" fill="#333" text-anchor="middle" font-weight="bold">심</text>
<line x1="491" y1="382" x2="591" y2="382" stroke="#333" stroke-width="1.5"/>
<path d="M521,382 A10 10 0 0 1 541,382 A10 10 0 0 1 561,382" fill="none" stroke="#C00000" stroke-width="2"/>
<text x="541" y="404" font-size="13" fill="#333" text-anchor="middle" font-weight="bold">덧붙임(육성)</text>
<line x1="666" y1="382" x2="766" y2="382" stroke="#333" stroke-width="1.5"/>
<line x1="666" y1="382" x2="644" y2="402" stroke="#333" stroke-width="1.5"/>
<circle cx="666" cy="382" r="7" fill="none" stroke="#C00000" stroke-width="2"/>
<path d="M666,382 L666,354 L686,360 L666,366" fill="#C00000" stroke="#C00000" stroke-width="1.5"/>
<text x="716" y="404" font-size="13" fill="#333" text-anchor="middle" font-weight="bold">현장 · 전체 둘레</text>
<text x="627" y="432" font-size="12" fill="#C00000" text-anchor="middle">깃발 = 현장 용접, 원 = 전체 둘레 용접</text>
</svg>
