<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C00000"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect width="820" height="460" fill="#ffffff"/>
<text x="410.0" y="28" font-size="18" fill="#548235" text-anchor="middle" font-weight="bold">용접 기호 — 기호가 실선 쪽이면 화살표 쪽, 점선 쪽이면 반대쪽</text>
<rect x="12" y="44" width="420" height="404" rx="8" fill="#F3F8EF" stroke="#548235"/>
<text x="30" y="70" font-size="13" fill="#548235" text-anchor="start" font-weight="bold">① 기호가 기준선(실선) 위 → 화살표 쪽 용접</text>
<rect x="40" y="166" width="130" height="16" fill="#D9D9D9" stroke="#555"/>
<rect x="96" y="96" width="16" height="70" fill="#D9D9D9" stroke="#555"/>
<path d="M112,166 L132,166 L112,146 Z" fill="#C00000"/>
<line x1="200" y1="106" x2="118" y2="160" stroke="#333" stroke-width="1.5" marker-end="url(#ak)"/>
<line x1="200" y1="106" x2="410" y2="106" stroke="#333" stroke-width="2"/>
<line x1="200" y1="116" x2="410" y2="116" stroke="#333" stroke-width="1.5" stroke-dasharray="7 4"/>
<path d="M290,106 L290,84 L312,106 Z" fill="none" stroke="#C00000" stroke-width="2"/>
<text x="284" y="102" font-size="14" fill="#333" text-anchor="end" font-weight="bold">z6</text>
<text x="320" y="102" font-size="14" fill="#333" text-anchor="start" font-weight="bold">300</text>
<text x="30" y="262" font-size="13" fill="#548235" text-anchor="start" font-weight="bold">② 기호가 동일선(점선) 쪽 → 화살표 반대쪽 용접</text>
<rect x="40" y="358" width="130" height="16" fill="#D9D9D9" stroke="#555"/>
<rect x="96" y="288" width="16" height="70" fill="#D9D9D9" stroke="#555"/>
<path d="M96,358 L76,358 L96,338 Z" fill="#C00000"/>
<line x1="200" y1="298" x2="118" y2="352" stroke="#333" stroke-width="1.5" marker-end="url(#ak)"/>
<line x1="200" y1="298" x2="410" y2="298" stroke="#333" stroke-width="2"/>
<line x1="200" y1="308" x2="410" y2="308" stroke="#333" stroke-width="1.5" stroke-dasharray="7 4"/>
<path d="M290,308 L290,330 L312,308 Z" fill="none" stroke="#C00000" stroke-width="2"/>
<text x="284" y="326" font-size="14" fill="#333" text-anchor="end" font-weight="bold">z6</text>
<text x="320" y="326" font-size="14" fill="#333" text-anchor="start" font-weight="bold">300</text>
<text x="222" y="210" font-size="12" fill="#C00000" text-anchor="middle">z6 : 목 길이 6 mm,  300 : 용접 길이 300 mm</text>
<text x="222" y="432" font-size="12" fill="#C00000" text-anchor="middle">빨강 삼각형 = 실제 용접되는 위치</text>
<rect x="446" y="44" width="362" height="404" rx="8" fill="#ffffff" stroke="#548235"/>
<text x="627" y="68" font-size="14" fill="#548235" text-anchor="middle" font-weight="bold">기본 기호와 보조 기호</text>
<line x1="491" y1="130" x2="591" y2="130" stroke="#333" stroke-width="1.5"/>
<path d="M529,130 L529,106 L553,130 Z" fill="none" stroke="#C00000" stroke-width="2"/>
<text x="541" y="152" font-size="13" fill="#333" text-anchor="middle" font-weight="bold">필릿</text>
<line x1="666" y1="130" x2="766" y2="130" stroke="#333" stroke-width="1.5"/>
<path d="M702,106 L716,130 L730,106" fill="none" stroke="#C00000" stroke-width="2"/>
<text x="716" y="152" font-size="13" fill="#333" text-anchor="middle" font-weight="bold">V형 맞대기</text>
<line x1="491" y1="214" x2="591" y2="214" stroke="#333" stroke-width="1.5"/>
<path d="M535,214 L535,190 M547,214 L547,190" fill="none" stroke="#C00000" stroke-width="2"/>
<text x="541" y="236" font-size="13" fill="#333" text-anchor="middle" font-weight="bold">I형 맞대기</text>
