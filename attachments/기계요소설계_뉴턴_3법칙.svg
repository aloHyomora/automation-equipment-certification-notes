<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 370" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C00000"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5597"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#548235"/></marker>
</defs>
<rect width="960" height="370" fill="#ffffff"/>
<text x="480" y="28" font-size="18" fill="#548235" text-anchor="middle" font-weight="bold">뉴턴의 운동 3법칙</text>
<g stroke="#BFBFBF"><line x1="320" y1="45" x2="320" y2="355"/><line x1="640" y1="45" x2="640" y2="355"/></g>
<g font-size="15" text-anchor="middle" font-weight="bold" fill="#548235">
<text x="160" y="64">1법칙 — 관성</text><text x="480" y="64">2법칙 — 가속도 F = ma</text><text x="800" y="64">3법칙 — 작용·반작용</text>
</g>
<!-- 1: bus -->
<rect x="40" y="110" width="240" height="110" rx="12" fill="#E2F0D9" stroke="#548235" stroke-width="2"/>
<rect x="250" y="125" width="24" height="40" fill="#FFFFFF" stroke="#548235"/>
<circle cx="90" cy="232" r="16" fill="#7F7F7F"/><circle cx="230" cy="232" r="16" fill="#7F7F7F"/>
<!-- leaning person -->
<g stroke="#333" stroke-width="3" fill="none"><line x1="140" y1="210" x2="160" y2="160"/><line x1="160" y1="160" x2="176" y2="182"/><line x1="140" y1="210" x2="132" y2="210"/></g>
<circle cx="168" cy="146" r="11" fill="#333"/>
<line x1="185" y1="140" x2="235" y2="140" stroke="#C00000" stroke-width="3" marker-end="url(#ar)"/>
<text x="200" y="100" font-size="12" fill="#C00000" text-anchor="middle">몸은 계속 앞으로 가려 함</text>
<line x1="270" y1="268" x2="190" y2="268" stroke="#2F5597" stroke-width="3" marker-end="url(#ab)"/>
<text x="230" y="290" font-size="12" fill="#2F5597" text-anchor="middle">급정거(감속)</text>
<line x1="50" y1="268" x2="120" y2="268" stroke="#548235" stroke-width="2" marker-end="url(#ag)"/>
<text x="85" y="290" font-size="12" fill="#548235" text-anchor="middle">진행 방향</text>
<text x="160" y="325" font-size="13" text-anchor="middle">힘이 없으면 정지는 정지, 운동은 등속 운동 유지</text>
<!-- 2: F=ma -->
<line x1="350" y1="190" x2="620" y2="190" stroke="#7F7F7F" stroke-width="2"/>
<line x1="350" y1="300" x2="620" y2="300" stroke="#7F7F7F" stroke-width="2"/>
<rect x="420" y="150" width="40" height="40" fill="#C5E0B4" stroke="#548235" stroke-width="2"/><text x="440" y="176" font-size="14" text-anchor="middle">m</text>
<rect x="410" y="240" width="70" height="60" fill="#A9D18E" stroke="#548235" stroke-width="2"/><text x="445" y="276" font-size="14" text-anchor="middle">2m</text>
<line x1="360" y1="170" x2="417" y2="170" stroke="#C00000" stroke-width="3" marker-end="url(#ar)"/><text x="380" y="160" font-size="13" fill="#C00000">F</text>
<line x1="350" y1="270" x2="407" y2="270" stroke="#C00000" stroke-width="3" marker-end="url(#ar)"/><text x="370" y="260" font-size="13" fill="#C00000">F</text>
<line x1="470" y1="120" x2="600" y2="120" stroke="#2F5597" stroke-width="3" marker-end="url(#ab)"/><text x="535" y="110" font-size="13" fill="#2F5597" text-anchor="middle">가속도 a</text>
<line x1="490" y1="228" x2="555" y2="228" stroke="#2F5597" stroke-width="3" marker-end="url(#ab)"/><text x="522" y="218" font-size="13" fill="#2F5597" text-anchor="middle">a/2</text>
<text x="480" y="325" font-size="13" text-anchor="middle">같은 힘이면 질량이 2배일 때 가속도는 절반</text>
<!-- 3: rocket -->
<path d="M800,90 L822,130 L822,230 L778,230 L778,130 Z" fill="#E2F0D9" stroke="#548235" stroke-width="2"/>
<path d="M778,200 L760,235 L778,230 Z M822,200 L840,235 L822,230 Z" fill="#A9D18E" stroke="#548235"/>
<path d="M784,232 L800,280 L816,232 Z" fill="#F4B183" stroke="#C55A11"/>
<line x1="800" y1="240" x2="800" y2="305" stroke="#C00000" stroke-width="3" marker-end="url(#ar)"/>
<text x="812" y="282" font-size="12" fill="#C00000">작용: 로켓이</text><text x="812" y="298" font-size="12" fill="#C00000">가스를 아래로 밂</text>
<line x1="860" y1="200" x2="860" y2="110" stroke="#2F5597" stroke-width="3" marker-end="url(#ab)"/>
<text x="868" y="150" font-size="12" fill="#2F5597">반작용:</text>
<text x="868" y="166" font-size="12" fill="#2F5597">가스가 로켓을</text>
<text x="868" y="182" font-size="12" fill="#2F5597">위로 밂</text>
<text x="800" y="325" font-size="13" text-anchor="middle">크기는 같고 방향은 반대, 서로 다른 물체에 작용</text>
<text x="800" y="347" font-size="12" text-anchor="middle">(걷기: 발이 땅을 뒤로, 땅이 발을 앞으로)</text>
</svg>
