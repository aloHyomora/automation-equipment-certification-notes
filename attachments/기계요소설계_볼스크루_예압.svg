<text x="650" y="100" font-size="12" fill="#548235" text-anchor="middle" font-weight="bold">싱글 너트</text>
<text x="650" y="228" font-size="12" fill="#404040" text-anchor="middle">홈보다 약간 큰 볼을 넣어</text>
<text x="650" y="254" font-size="12" fill="#404040" text-anchor="middle">볼이 홈 네 곳에 닿는다</text>
<text x="650" y="271" font-size="12" fill="#404040" text-anchor="middle">(4점 접촉)</text>
<text x="650" y="292" font-size="13" fill="#C00000" text-anchor="middle" font-weight="bold">너트가 짧고 간단</text>
<rect x="40" y="330" width="700" height="72" rx="6" fill="#e2efda" stroke="#548235"/>
<text x="390" y="356" font-size="13" fill="#548235" text-anchor="middle" font-weight="bold">예압의 효과: 백래시 제거 · 강성 증가(하중을 받아도 덜 밀린다) · 위치 정밀도 향상</text>
<text x="390" y="384" font-size="13" fill="#C00000" text-anchor="middle" font-weight="bold">예압이 너무 크면: 마찰 토크 증가 → 발열 → 수명 감소</text>
</svg>
