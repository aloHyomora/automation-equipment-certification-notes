<text x="390.0" y="28" font-size="17" fill="#548235" text-anchor="middle" font-weight="bold">백래시와 예압 — 볼과 홈 사이 틈을 미리 없앤다</text>
<text x="130" y="62" font-size="14" fill="#262626" text-anchor="middle" font-weight="bold">① 예압 없음</text>
