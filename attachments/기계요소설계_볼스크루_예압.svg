<line x1="430" y1="128" x2="480" y2="128" stroke="#C00000" stroke-width="2" marker-end="url(#ar)"/>
<text x="390" y="228" font-size="12" fill="#404040" text-anchor="middle">두 너트를 서로 밀어 벌린다</text>
<text x="390" y="254" font-size="12" fill="#404040" text-anchor="middle">점선 = 접촉선. 왼쪽·오른쪽 너트가</text>
<text x="390" y="271" font-size="12" fill="#404040" text-anchor="middle">반대 방향으로 볼을 눌러</text>
<text x="390" y="292" font-size="13" fill="#C00000" text-anchor="middle" font-weight="bold">어느 방향으로도 틈이 0</text>
<text x="650" y="62" font-size="14" fill="#262626" text-anchor="middle" font-weight="bold">③ 오버사이즈 볼 예압</text>
