<text x="130" y="272" font-size="13" fill="#C00000" text-anchor="middle" font-weight="bold">축 방향 틈 = 백래시</text>
<text x="130" y="292" font-size="12" fill="#404040" text-anchor="middle">방향을 바꾸면 틈만큼</text>
<text x="130" y="309" font-size="12" fill="#404040" text-anchor="middle">너트가 늦게 따라온다</text>
<text x="390" y="62" font-size="14" fill="#262626" text-anchor="middle" font-weight="bold">② 더블 너트 예압</text>
