<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 332" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
  <rect width="720" height="330" fill="#ffffff"/>
  <text x="360" y="26" font-size="16" font-weight="bold" fill="#2F5597" text-anchor="middle">자기유지 회로 (정지 우선)</text>
  <!-- rails -->
  <line x1="50" y1="50" x2="50" y2="200" stroke="#333" stroke-width="4"/>
  <line x1="670" y1="50" x2="670" y2="200" stroke="#333" stroke-width="4"/>
  <text x="50" y="44" font-size="12" fill="#555" text-anchor="middle">왼쪽 모선</text>
  <text x="670" y="44" font-size="12" fill="#555" text-anchor="middle">오른쪽 모선</text>
  <!-- wires -->
  <g stroke="#333" stroke-width="2.5" fill="none">
    <polyline points="50,90 90,90 90,90"/>
    <line x1="90" y1="90" x2="180" y2="90"/>
    <line x1="230" y1="90" x2="300" y2="90"/>
    <line x1="90" y1="90" x2="90" y2="160"/>
    <line x1="90" y1="160" x2="180" y2="160"/>
    <line x1="230" y1="160" x2="300" y2="160"/>
    <line x1="300" y1="90" x2="300" y2="160"/>
    <line x1="300" y1="125" x2="380" y2="125"/>
    <line x1="430" y1="125" x2="540" y2="125"/>
    <line x1="590" y1="125" x2="670" y2="125"/>
    <line x1="50" y1="125" x2="50" y2="125"/>
  </g>
  <line x1="50" y1="90" x2="90" y2="90" stroke="#333" stroke-width="2.5"/>
  <!-- contact P00 (NO) -->
  <line x1="190" y1="72" x2="190" y2="108" stroke="#2F5597" stroke-width="3"/>
  <line x1="220" y1="72" x2="220" y2="108" stroke="#2F5597" stroke-width="3"/>
  <line x1="180" y1="90" x2="190" y2="90" stroke="#333" stroke-width="2.5"/>
  <line x1="220" y1="90" x2="230" y2="90" stroke="#333" stroke-width="2.5"/>
  <text x="205" y="62" font-size="14" font-weight="bold" fill="#2F5597" text-anchor="middle">P00</text>
  <text x="205" y="126" font-size="12" fill="#555" text-anchor="middle">기동 PB (a접점)</text>
  <!-- contact P20 (NO) -->
  <line x1="190" y1="142" x2="190" y2="178" stroke="#2F5597" stroke-width="3"/>
  <line x1="220" y1="142" x2="220" y2="178" stroke="#2F5597" stroke-width="3"/>
  <line x1="180" y1="160" x2="190" y2="160" stroke="#333" stroke-width="2.5"/>
  <line x1="220" y1="160" x2="230" y2="160" stroke="#333" stroke-width="2.5"/>
  <text x="205" y="196" font-size="14" font-weight="bold" fill="#2F5597" text-anchor="middle">P20</text>
  <text x="205" y="214" font-size="12" fill="#555" text-anchor="middle">자기유지 접점 (a접점)</text>
  <!-- contact P01 (NC) -->
  <line x1="390" y1="107" x2="390" y2="143" stroke="#2F5597" stroke-width="3"/>
  <line x1="420" y1="107" x2="420" y2="143" stroke="#2F5597" stroke-width="3"/>
  <line x1="380" y1="125" x2="390" y2="125" stroke="#333" stroke-width="2.5"/>
  <line x1="420" y1="125" x2="430" y2="125" stroke="#333" stroke-width="2.5"/>
  <line x1="383" y1="145" x2="427" y2="105" stroke="#C00000" stroke-width="2.5"/>
  <text x="405" y="97" font-size="14" font-weight="bold" fill="#2F5597" text-anchor="middle">P01</text>
  <text x="405" y="165" font-size="12" fill="#555" text-anchor="middle">정지 PB (b접점)</text>
  <!-- coil P20 -->
  <path d="M552,100 Q540,125 552,150" fill="none" stroke="#C55A11" stroke-width="3"/>
  <path d="M578,100 Q590,125 578,150" fill="none" stroke="#C55A11" stroke-width="3"/>
  <line x1="540" y1="125" x2="540" y2="125" stroke="#333"/>
  <text x="565" y="90" font-size="14" font-weight="bold" fill="#C55A11" text-anchor="middle">P20</text>
  <text x="565" y="170" font-size="12" fill="#555" text-anchor="middle">출력 코일</text>
  <!-- explanation -->
  <rect x="50" y="240" width="620" height="76" fill="#F2F2F2" stroke="#bbb"/>
  <text x="62" y="262" font-size="13" fill="#333">① P00을 누르면 P20 코일이 ON → 아래쪽 P20 접점이 닫힌다.</text>
  <text x="62" y="282" font-size="13" fill="#333">② 손을 떼도 P20 접점이 전류를 이어 주므로 코일이 계속 ON (자기유지).</text>
  <text x="62" y="300" font-size="13" fill="#333">③ P01(b접점)을 누르면 회로가 끊겨 OFF → 정지가 항상 이긴다.</text>
<text x="62" y="314" font-size="12" fill="#2F5597">니모닉: LOAD P00 / OR P20 / AND NOT P01 / OUT P20</text>
</svg>
