<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C00000"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#548235"/></marker></defs>
<rect width="780" height="330" fill="#ffffff"/>
<text x="390.0" y="28.0" font-size="16" fill="#548235" text-anchor="middle" font-weight="bold">도면의 부분 열처리 지시 — 굵은 1점 쇄선 + 범위 치수 + 주기</text>
<path d="M80,140 L230,140 L230,120 L600,120 L600,145 L700,145 L700,215 L600,215 L600,240 L230,240 L230,220 L80,220 Z" fill="#F7F7F7" stroke="#222" stroke-width="2.2"/>
<line x1="60" y1="180" x2="720" y2="180" stroke="#555" stroke-width="0.9" stroke-dasharray="22 4 3 4"/>
<line x1="330" y1="110" x2="520" y2="110" stroke="#C00000" stroke-width="4" stroke-dasharray="26 5 4 5"/>
<rect x="330" y="120" width="190" height="9" fill="#F4CCCC" stroke="none"/>
<rect x="330" y="231" width="190" height="9" fill="#F4CCCC" stroke="none"/>
<line x1="230" y1="105" x2="230" y2="70" stroke="#333" stroke-width="0.8"/>
<line x1="330" y1="105" x2="330" y2="70" stroke="#333" stroke-width="0.8"/>
<line x1="520" y1="105" x2="520" y2="70" stroke="#333" stroke-width="0.8"/>
<line x1="230" y1="78" x2="330" y2="78" stroke="#333" marker-start="url(#ak)" marker-end="url(#ak)"/>
<text x="280.0" y="73.0" font-size="12" fill="#333" text-anchor="middle">40</text>
<line x1="330" y1="78" x2="520" y2="78" stroke="#333" marker-start="url(#ak)" marker-end="url(#ak)"/>
<text x="425.0" y="73.0" font-size="12" fill="#C00000" text-anchor="middle" font-weight="bold">80 (경화 범위)</text>
<line x1="470" y1="110" x2="560" y2="60" stroke="#333" stroke-width="1"/>
<line x1="560" y1="60" x2="760" y2="60" stroke="#333" stroke-width="1"/>
<text x="565.0" y="54.0" font-size="13" fill="#C00000" text-anchor="start" font-weight="bold">고주파 경화 HRC 55 이상</text>
<text x="565.0" y="92.0" font-size="12" fill="#333" text-anchor="start">경화 깊이 1~2 mm</text>
<text x="425.0" y="260.0" font-size="12" fill="#555" text-anchor="middle">분홍 띠 = 경화층 (표면만 단단, 속은 인성 유지)</text>
<rect x="40" y="275" width="700" height="44" rx="6" fill="#F3F7EE" stroke="#548235"/>
<text x="55.0" y="295.0" font-size="12" fill="#333" text-anchor="start">전체 처리는 주기만: "전체 담금질·뜨임 HRC 50~55". 부분 처리는 해당 면 바깥에 굵은 1점 쇄선을</text>
<text x="55.0" y="312.0" font-size="12" fill="#333" text-anchor="start">긋고 범위를 치수로 준다. (가는 1점 쇄선 = 중심선, 굵은 1점 쇄선 = 특수 지정 선)</text>
</svg>
