<text x="342.0" y="249.0" font-size="13" fill="#C00000" text-anchor="start" font-weight="bold">볼: (1/2)³ = 1/8</text>
<text x="342.0" y="266.0" font-size="12" fill="#2F5597" text-anchor="start">롤러: (1/2)^(10/3) ≈ 1/10</text>
<text x="104.0" y="70.3" font-size="13" fill="#548235" text-anchor="start" font-weight="bold">볼 r = 3</text>
<text x="164.0" y="180.5" font-size="12" fill="#2F5597" text-anchor="start" font-weight="bold">롤러 r = 10/3 (파랑)</text>
<rect x="500.0" y="70.0" width="205.0" height="220.0" fill="#F2F8EE" stroke="#548235" stroke-width="1.2"/>
<text x="512.0" y="95.0" font-size="13" fill="#548235" text-anchor="start" font-weight="bold">기본 정격 수명</text>
<text x="512.0" y="118.0" font-size="12" fill="#333" text-anchor="start">L₁₀ = (C/P)ʳ × 10⁶ 회전</text>
<text x="512.0" y="138.0" font-size="12" fill="#333" text-anchor="start">Lh = L₁₀ / (60N) [h]</text>
<text x="512.0" y="168.0" font-size="12" fill="#333" text-anchor="start" font-weight="bold">C: 기본 동정격 하중</text>
<text x="512.0" y="186.0" font-size="12" fill="#333" text-anchor="start">= 100만 회전을 견디는 하중</text>
<text x="512.0" y="214.0" font-size="12" fill="#2F5597" text-anchor="start" font-weight="bold">예) C/P = 10, N = 1000 rpm</text>
<text x="512.0" y="232.0" font-size="12" fill="#333" text-anchor="start">L₁₀ = 10³ × 10⁶ = 10⁹ 회전</text>
<text x="512.0" y="250.0" font-size="12" fill="#333" text-anchor="start">Lh = 10⁹ / 60000</text>
<text x="512.0" y="268.0" font-size="12" fill="#C00000" text-anchor="start" font-weight="bold">    ≈ 16,700 h</text>
</svg>
