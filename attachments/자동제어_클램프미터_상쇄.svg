<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<rect width="680" height="330" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C00000"/></marker></defs>
<text x="340" y="26" font-size="16" fill="#2F5597" text-anchor="middle" font-weight="bold">클램프 미터는 한 가닥만 집는다</text>
<text x="170" y="58" font-size="14" fill="#2F5597" text-anchor="middle" font-weight="bold">(가) 한 가닥 → 정상 측정</text>
<ellipse cx="170" cy="170" rx="80" ry="70" fill="none" stroke="#2F5597" stroke-width="10"/>
<circle cx="170" cy="170" r="14" fill="#8B4513"/>
<text x="170" y="175" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">L</text>
<path d="M120,120 A70,60 0 0 1 220,120" fill="none" stroke="#C00000" stroke-width="2" marker-end="url(#ar)"/>
<text x="170" y="268" font-size="13" fill="#333" text-anchor="middle">전류 I 가 만든 자기장을 철심이 모은다</text>
<text x="170" y="292" font-size="15" fill="#C00000" text-anchor="middle" font-weight="bold">표시 = I</text>
<text x="510" y="58" font-size="14" fill="#2F5597" text-anchor="middle" font-weight="bold">(나) 왕복 두 가닥 → 상쇄</text>
<ellipse cx="510" cy="170" rx="80" ry="70" fill="none" stroke="#2F5597" stroke-width="10"/>
<circle cx="482" cy="170" r="14" fill="#8B4513"/>
<text x="482" y="175" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">L</text>
<circle cx="538" cy="170" r="14" fill="#1F6FD0"/>
<text x="538" y="175" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">N</text>
<text x="482" y="208" font-size="13" fill="#C00000" text-anchor="middle" font-weight="bold">+I 가는</text>
<text x="538" y="208" font-size="13" fill="#C00000" text-anchor="middle" font-weight="bold">−I 오는</text>
<text x="510" y="268" font-size="13" fill="#333" text-anchor="middle">가는 전류와 오는 전류의 자기장이 지운다</text>
<text x="510" y="292" font-size="15" fill="#C00000" text-anchor="middle" font-weight="bold">표시 ≈ 0 (누설 전류만 남음)</text>
<line x1="340" y1="70" x2="340" y2="300" stroke="#ccc" stroke-dasharray="4 3"/>
</svg>
