<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
  <rect x="0" y="0" width="640" height="360" rx="16" fill="#ffffff"/>
  <!-- 기준선 -->
  <line x1="70" y1="300" x2="600" y2="300" stroke="#444" stroke-width="2"/>
  <text x="76" y="322" font-size="14" fill="#444">완전 진공 (절대압 0)</text>
  <line x1="70" y1="190" x2="600" y2="190" stroke="#C55A11" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="76" y="182" font-size="14" fill="#C55A11" font-weight="bold">대기압 ≈ 0.1013 MPa (게이지압 0)</text>

  <!-- A: 대기압보다 높은 경우 -->
  <line x1="360" y1="300" x2="360" y2="70" stroke="#2F5597" stroke-width="10" stroke-linecap="round"/>
  <line x1="400" y1="190" x2="400" y2="70" stroke="#548235" stroke-width="10" stroke-linecap="round"/>
  <circle cx="380" cy="70" r="6" fill="#222"/>
  <text x="380" y="50" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">측정점 A</text>
  <text x="352" y="250" font-size="13" text-anchor="end" fill="#2F5597">절대압</text>
  <text x="412" y="135" font-size="13" fill="#548235">게이지압</text>

  <!-- B: 대기압보다 낮은 경우(진공) -->
  <line x1="490" y1="300" x2="490" y2="245" stroke="#2F5597" stroke-width="10" stroke-linecap="round"/>
  <line x1="530" y1="190" x2="530" y2="245" stroke="#C00000" stroke-width="10" stroke-linecap="round"/>
  <circle cx="510" cy="245" r="6" fill="#222"/>
  <text x="546" y="262" font-size="15" text-anchor="start" fill="#222" font-weight="bold">측정점 B</text>
  <text x="482" y="292" font-size="13" text-anchor="end" fill="#2F5597">절대압</text>
  <text x="542" y="222" font-size="13" fill="#C00000">진공압(부압)</text>

  <text x="320" y="350" font-size="13" text-anchor="middle" fill="#555">절대압 = 게이지압 + 대기압 · 진공압 = 대기압 − 절대압</text>
</svg>
