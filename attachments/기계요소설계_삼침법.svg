<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<rect width="720" height="380" fill="#ffffff"/>
<text x="360" y="28" font-size="17" fill="#548235" text-anchor="middle" font-weight="bold">삼침법 — 침 3개 위로 잰 M에서 유효지름 d₂를 구한다</text>
<polygon points="110.0,120.0 140.0,172.0 170.0,120.0 200.0,172.0 230.0,120.0 260.0,172.0 290.0,120.0 320.0,172.0 350.0,120.0 380.0,172.0 410.0,120.0 410.0,228.0 380.0,280.0 350.0,228.0 320.0,280.0 290.0,228.0 260.0,280.0 230.0,228.0 200.0,280.0 170.0,228.0 140.0,280.0 110.0,228.0" fill="#E2EFDA" stroke="#548235" stroke-width="2"/>
<line x1="90" y1="200" x2="440" y2="200" stroke="#555" stroke-dasharray="10 4 2 4"/>
<text x="96" y="194" font-size="11" fill="#555">축 중심</text>
<line x1="90" y1="146" x2="440" y2="146" stroke="#2F5597" stroke-dasharray="4 3"/>
<line x1="90" y1="254" x2="440" y2="254" stroke="#2F5597" stroke-dasharray="4 3"/>
<circle cx="140.0" cy="137.4" r="17.3" fill="#FFE699" stroke="#BF9000" stroke-width="2"/>
<circle cx="200.0" cy="137.4" r="17.3" fill="#FFE699" stroke="#BF9000" stroke-width="2"/>
<circle cx="170.0" cy="262.6" r="17.3" fill="#FFE699" stroke="#BF9000" stroke-width="2"/>
<rect x="120" y="98.1" width="120" height="22" fill="#BFBFBF" stroke="#555"/>
<rect x="130" y="279.9" width="100" height="22" fill="#BFBFBF" stroke="#555"/>
<text x="114" y="114" font-size="11" text-anchor="end" fill="#333">스핀들</text>
<text x="124" y="296" font-size="11" text-anchor="end" fill="#333">앤빌</text>
<line x1="240" y1="120.1" x2="480" y2="120.1" stroke="#C00000" stroke-dasharray="3 3"/>
<line x1="230" y1="279.9" x2="480" y2="279.9" stroke="#C00000" stroke-dasharray="3 3"/>
<line x1="470" y1="120.1" x2="470" y2="279.9" stroke="#C00000" stroke-width="2"/>
<polygon points="465,129.1 475,129.1 470,120.1" fill="#C00000"/><polygon points="465,270.9 475,270.9 470,279.9" fill="#C00000"/>
<text x="478" y="205" font-size="18" fill="#C00000" font-weight="bold">M</text>
<line x1="430" y1="146" x2="430" y2="254" stroke="#2F5597" stroke-width="2"/>
<text x="424" y="230" font-size="15" text-anchor="end" fill="#2F5597" font-weight="bold">d₂</text>
<line x1="290" y1="114" x2="350" y2="114" stroke="#333"/>
<text x="320.0" y="110" font-size="13" text-anchor="middle" fill="#333">p</text>
<line x1="96" y1="160" x2="130" y2="146" stroke="#BF9000"/><text x="94" y="166" font-size="12" text-anchor="end" fill="#BF9000" font-weight="bold">침(지름 dw)</text>
<rect x="510" y="60" width="200" height="200" rx="8" fill="#F3F8EF" stroke="#548235"/>
<text x="522" y="86" font-size="13" fill="#548235" font-weight="bold" xml:space="preserve">미터·유니파이(60°)</text>
<text x="522" y="106" font-size="13" fill="#C00000" font-weight="bold" xml:space="preserve">d₂ = M − 3dw + 0.866p</text>
<text x="522" y="146" font-size="13" fill="#333" xml:space="preserve">· 같은 지름 침 3개</text>
<text x="522" y="166" font-size="13" fill="#333" xml:space="preserve">  (한쪽 2개, 반대쪽 1개)</text>
<text x="522" y="186" font-size="13" fill="#333" xml:space="preserve">· 침 위로 바깥 치수 M</text>
<text x="522" y="206" font-size="13" fill="#333" xml:space="preserve">  를 마이크로미터로 측정</text>
<text x="522" y="226" font-size="13" fill="#333" xml:space="preserve">· 유효지름 측정 중</text>
<text x="522" y="246" font-size="13" fill="#333" font-weight="bold" xml:space="preserve">  정밀도가 가장 높다</text>
<text x="270" y="360" font-size="12" text-anchor="middle" fill="#2F5597">파란 점선 = 유효지름선 (산 폭 = 골 폭인 가상 원통)</text>
</svg>