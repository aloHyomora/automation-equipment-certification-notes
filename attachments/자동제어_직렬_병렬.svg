<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
  <rect width="640" height="400" rx="16" fill="#fff"/>
  <!-- serial -->
  <text x="30" y="40" font-size="16" font-weight="bold" fill="#2F5597">직렬 전송: 선 1가닥으로 한 비트씩 차례로</text>
  <rect x="30" y="60" width="80" height="50" rx="8" fill="#EAF0FA" stroke="#2F5597"/>
  <text x="70" y="90" font-size="14" text-anchor="middle" fill="#222">송신</text>
  <rect x="530" y="60" width="80" height="50" rx="8" fill="#EAF0FA" stroke="#2F5597"/>
  <text x="570" y="90" font-size="14" text-anchor="middle" fill="#222">수신</text>
  <line x1="110" y1="85" x2="530" y2="85" stroke="#2F5597" stroke-width="3"/>
  <g font-size="14" text-anchor="middle" font-weight="bold">
    <rect x="135" y="70" width="34" height="30" rx="4" fill="#fff" stroke="#2F5597"/><text x="152" y="91">1</text>
    <rect x="184" y="70" width="34" height="30" rx="4" fill="#fff" stroke="#2F5597"/><text x="201" y="91">0</text>
    <rect x="233" y="70" width="34" height="30" rx="4" fill="#fff" stroke="#2F5597"/><text x="250" y="91">1</text>
    <rect x="282" y="70" width="34" height="30" rx="4" fill="#fff" stroke="#2F5597"/><text x="299" y="91">1</text>
    <rect x="331" y="70" width="34" height="30" rx="4" fill="#fff" stroke="#2F5597"/><text x="348" y="91">0</text>
    <rect x="380" y="70" width="34" height="30" rx="4" fill="#fff" stroke="#2F5597"/><text x="397" y="91">0</text>
    <rect x="429" y="70" width="34" height="30" rx="4" fill="#fff" stroke="#2F5597"/><text x="446" y="91">1</text>
    <rect x="478" y="70" width="34" height="30" rx="4" fill="#fff" stroke="#2F5597"/><text x="495" y="91">0</text>
  </g>
  <text x="320" y="130" font-size="12" text-anchor="middle" fill="#555">선이 적어 싸고 멀리 보낸다 → 공장 통신(RS-232C·RS-485)의 기본</text>
  <!-- parallel -->
  <text x="30" y="170" font-size="16" font-weight="bold" fill="#C55A11">병렬 전송: 선 8가닥으로 8비트를 한꺼번에</text>
  <rect x="30" y="185" width="80" height="180" rx="8" fill="#FBEFE6" stroke="#C55A11"/>
  <text x="70" y="280" font-size="14" text-anchor="middle" fill="#222">송신</text>
  <rect x="530" y="185" width="80" height="180" rx="8" fill="#FBEFE6" stroke="#C55A11"/>
  <text x="570" y="280" font-size="14" text-anchor="middle" fill="#222">수신</text>
  <g stroke="#C55A11" stroke-width="2">
    <line x1="110" y1="196" x2="530" y2="196"/><line x1="110" y1="217" x2="530" y2="217"/>
    <line x1="110" y1="238" x2="530" y2="238"/><line x1="110" y1="259" x2="530" y2="259"/>
    <line x1="110" y1="280" x2="530" y2="280"/><line x1="110" y1="301" x2="530" y2="301"/>
    <line x1="110" y1="322" x2="530" y2="322"/><line x1="110" y1="343" x2="530" y2="343"/>
  </g>
  <g font-size="12" text-anchor="middle" font-weight="bold">
    <rect x="304" y="188" width="32" height="16" rx="3" fill="#fff" stroke="#C55A11"/><text x="320" y="201">1</text>
    <rect x="304" y="209" width="32" height="16" rx="3" fill="#fff" stroke="#C55A11"/><text x="320" y="222">0</text>
    <rect x="304" y="230" width="32" height="16" rx="3" fill="#fff" stroke="#C55A11"/><text x="320" y="243">1</text>
    <rect x="304" y="251" width="32" height="16" rx="3" fill="#fff" stroke="#C55A11"/><text x="320" y="264">1</text>
    <rect x="304" y="272" width="32" height="16" rx="3" fill="#fff" stroke="#C55A11"/><text x="320" y="285">0</text>
    <rect x="304" y="293" width="32" height="16" rx="3" fill="#fff" stroke="#C55A11"/><text x="320" y="306">0</text>
    <rect x="304" y="314" width="32" height="16" rx="3" fill="#fff" stroke="#C55A11"/><text x="320" y="327">1</text>
    <rect x="304" y="335" width="32" height="16" rx="3" fill="#fff" stroke="#C55A11"/><text x="320" y="348">0</text>
  </g>
  <text x="320" y="388" font-size="12" text-anchor="middle" fill="#555">빠르지만 선이 많아 비싸고, 선마다 도착 시간이 어긋나 근거리에만 쓴다</text>
</svg>
