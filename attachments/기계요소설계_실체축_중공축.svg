<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<rect width="840" height="400" fill="#ffffff"/>
<text x="420" y="28" font-size="17" fill="#548235" text-anchor="middle" font-weight="bold">실체축 vs 중공축 — 응력이 작은 가운데 재료를 덜어낸다</text>
<!-- solid -->
<text x="170" y="66" font-size="15" fill="#262626" text-anchor="middle" font-weight="bold">실체축 (지름 d)</text>
<circle cx="170" cy="200" r="90" fill="#c5e0b4" stroke="#548235" stroke-width="2"/>
<line x1="80" y1="200" x2="260" y2="200" stroke="#404040"/>
<g stroke="#C00000" stroke-width="2">
<line x1="185" y1="200" x2="185" y2="190"/><line x1="200" y1="200" x2="200" y2="180"/><line x1="215" y1="200" x2="215" y2="170"/><line x1="230" y1="200" x2="230" y2="160"/><line x1="245" y1="200" x2="245" y2="150"/><line x1="260" y1="200" x2="260" y2="140"/>
<line x1="155" y1="200" x2="155" y2="210"/><line x1="140" y1="200" x2="140" y2="220"/><line x1="125" y1="200" x2="125" y2="230"/><line x1="110" y1="200" x2="110" y2="240"/><line x1="95" y1="200" x2="95" y2="250"/><line x1="80" y1="200" x2="80" y2="260"/>
</g>
<line x1="170" y1="200" x2="260" y2="140" stroke="#C00000" stroke-dasharray="4,3"/>
<line x1="170" y1="200" x2="80" y2="260" stroke="#C00000" stroke-dasharray="4,3"/>
<text x="268" y="138" font-size="12" fill="#C00000">τmax</text>
<text x="170" y="315" font-size="12" fill="#262626" text-anchor="middle">비틀림 전단 응력: 중심 0, 표면 최대</text>
<text x="170" y="333" font-size="12" fill="#595959" text-anchor="middle">가운데 재료는 거의 일을 하지 않는다</text>
<!-- hollow -->
<text x="470" y="66" font-size="15" fill="#262626" text-anchor="middle" font-weight="bold">중공축 (바깥 d₂, 안 d₁)</text>
<circle cx="470" cy="200" r="90" fill="#c5e0b4" stroke="#548235" stroke-width="2"/>
<circle cx="470" cy="200" r="45" fill="#ffffff" stroke="#548235" stroke-width="2"/>
<line x1="380" y1="200" x2="560" y2="200" stroke="#404040"/>
<g stroke="#C00000" stroke-width="2">
<line x1="515" y1="200" x2="515" y2="170"/><line x1="530" y1="200" x2="530" y2="160"/><line x1="545" y1="200" x2="545" y2="150"/><line x1="560" y1="200" x2="560" y2="140"/>
<line x1="425" y1="200" x2="425" y2="230"/><line x1="410" y1="200" x2="410" y2="240"/><line x1="395" y1="200" x2="395" y2="250"/><line x1="380" y1="200" x2="380" y2="260"/>
</g>
<line x1="515" y1="170" x2="560" y2="140" stroke="#C00000" stroke-dasharray="4,3"/>
<line x1="425" y1="230" x2="380" y2="260" stroke="#C00000" stroke-dasharray="4,3"/>
<text x="470" y="315" font-size="12" fill="#262626" text-anchor="middle">응력이 큰 바깥쪽만 남겼다</text>
<text x="470" y="333" font-size="12" fill="#595959" text-anchor="middle">내외경비 x = d₁ / d₂</text>
<!-- numbers -->
<rect x="606" y="60" width="220" height="296" rx="8" fill="#f2f2f2" stroke="#548235"/>
<text x="716" y="86" font-size="14" fill="#548235" text-anchor="middle" font-weight="bold">같은 바깥지름, x = 0.5</text>
<text x="716" y="116" font-size="13" fill="#262626" text-anchor="middle">무게(단면적) ∝ 1 − x²</text>
<text x="716" y="138" font-size="13" fill="#262626" text-anchor="middle">= 0.75 → 25 % 가벼움</text>
<text x="716" y="172" font-size="13" fill="#262626" text-anchor="middle">비틀림 강도 ∝ 1 − x⁴</text>
<text x="716" y="194" font-size="13" fill="#262626" text-anchor="middle">= 0.9375 → 약 6 % 감소</text>
<line x1="626" y1="214" x2="806" y2="214" stroke="#a6a6a6"/>
<text x="716" y="240" font-size="12" fill="#262626" text-anchor="middle">Zp = π d₂³ (1 − x⁴) / 16</text>
<text x="716" y="266" font-size="12" fill="#262626" text-anchor="middle">d₂ = ∛[16T / (π τa (1 − x⁴))]</text>
<text x="716" y="300" font-size="12" fill="#C00000" text-anchor="middle">같은 무게라면 바깥지름을</text>
<text x="716" y="318" font-size="12" fill="#C00000" text-anchor="middle">키울 수 있어 굽힘·비틀림에</text>
<text x="716" y="336" font-size="12" fill="#C00000" text-anchor="middle">더 강하다</text>
</svg>
