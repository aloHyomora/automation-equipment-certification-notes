<line x1="420.0" y1="170.0" x2="570.0" y2="170.0" stroke="#7F7F7F" stroke-width="0.8" stroke-dasharray="14 4 2 4"/>
<line x1="545.0" y1="250.0" x2="610.0" y2="250.0" stroke="#C00000" stroke-width="3" marker-end="url(#ar)"/>
<text x="495.0" y="270.0" font-size="12" fill="#C00000" text-anchor="middle" font-weight="bold">헬리컬: 한쪽으로 추력</text>
<text x="495.0" y="286.0" font-size="12" fill="#333" text-anchor="middle">→ 스러스트 베어링 필요</text>
<rect x="620" y="110" width="110" height="120" fill="#F2F8EE" stroke="#000" stroke-width="2"/>
<line x1="626.0" y1="144.0" x2="675.0" y2="122.0" stroke="#548235" stroke-width="2" />
<line x1="675.0" y1="122.0" x2="724.0" y2="144.0" stroke="#548235" stroke-width="2" />
<line x1="626.0" y1="172.0" x2="675.0" y2="150.0" stroke="#548235" stroke-width="2" />
<line x1="675.0" y1="150.0" x2="724.0" y2="172.0" stroke="#548235" stroke-width="2" />
<line x1="626.0" y1="200.0" x2="675.0" y2="178.0" stroke="#548235" stroke-width="2" />
<line x1="675.0" y1="178.0" x2="724.0" y2="200.0" stroke="#548235" stroke-width="2" />
<line x1="626.0" y1="228.0" x2="675.0" y2="206.0" stroke="#548235" stroke-width="2" />
<line x1="675.0" y1="206.0" x2="724.0" y2="228.0" stroke="#548235" stroke-width="2" />
<line x1="675.0" y1="110.0" x2="675.0" y2="230.0" stroke="#7F7F7F" stroke-width="0.8" stroke-dasharray="3 3"/>
<line x1="670.0" y1="250.0" x2="625.0" y2="250.0" stroke="#C00000" stroke-width="3" marker-end="url(#ar)"/>
<line x1="680.0" y1="250.0" x2="725.0" y2="250.0" stroke="#C00000" stroke-width="3" marker-end="url(#ar)"/>
<text x="675.0" y="270.0" font-size="12" fill="#C00000" text-anchor="middle" font-weight="bold">더블 헬리컬(헤링본)</text>
<text x="675.0" y="286.0" font-size="12" fill="#333" text-anchor="middle">좌우 추력이 상쇄</text>
<text x="440.0" y="336.0" font-size="12" fill="#333" text-anchor="start">스퍼보다 물림률이 커서 조용하고 큰 힘,</text>
<text x="440.0" y="354.0" font-size="12" fill="#333" text-anchor="start">대신 잇줄이 비스듬해 축 방향 힘이 생긴다.</text>
</svg>
