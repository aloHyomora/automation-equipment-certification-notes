</defs>
<rect width="760" height="410" fill="#ffffff"/>
<text x="380.0" y="28" font-size="18" fill="#548235" text-anchor="middle" font-weight="bold">헬리컬 기어 — 비틀림각 β, 이직각·축직각 모듈, 축 방향 추력</text>
<text x="210.0" y="66.0" font-size="13" fill="#548235" text-anchor="middle" font-weight="bold">(a) 피치면을 펼쳐 본 잇줄</text>
<rect x="60" y="80" width="300" height="220" fill="#F2F8EE" stroke="#548235" stroke-width="1.5"/>
