<line x1="480.0" y1="300.0" x2="582.6" y2="80.0" stroke="#548235" stroke-width="3" />
<line x1="550.0" y1="300.0" x2="652.6" y2="80.0" stroke="#548235" stroke-width="3" />
</g>
<line x1="144.0" y1="270.0" x2="214.0" y2="270.0" stroke="#C00000" stroke-width="2" marker-start="url(#ar)" marker-end="url(#ar)"/>
<rect x="115.0" y="276" width="128" height="18" fill="#ffffff" fill-opacity="0.9"/>
<text x="179.0" y="290.0" font-size="12" fill="#C00000" text-anchor="middle" font-weight="bold">p_s = πm_s (축직각)</text>
<line x1="260.6" y1="170.0" x2="318.1" y2="196.8" stroke="#2F5597" stroke-width="2" marker-start="url(#ar)" marker-end="url(#ar)"/>
<rect x="282.6" y="146.0" width="128" height="18" fill="#ffffff" fill-opacity="0.9"/>
<text x="286.6" y="160.0" font-size="12" fill="#2F5597" text-anchor="start" font-weight="bold">p_n = πm_n (이직각)</text>
<line x1="270.0" y1="300.0" x2="270.0" y2="230.0" stroke="#333" stroke-width="1" stroke-dasharray="4 3"/>
<path d="M270,245 A55,55 0 0 1 293.2,250.2" fill="none" stroke="#333"/>
<text x="276.0" y="240.0" font-size="14" fill="#333" text-anchor="start" font-weight="bold">β</text>
<line x1="42.0" y1="90.0" x2="42.0" y2="290.0" stroke="#333" stroke-width="1.5" marker-start="url(#dm)" marker-end="url(#dm)"/>
<text x="36.0" y="76.0" font-size="11" fill="#333" text-anchor="start">축 방향</text>
<line x1="70.0" y1="334.0" x2="350.0" y2="334.0" stroke="#333" stroke-width="1.5" marker-start="url(#dm)" marker-end="url(#dm)"/>
<text x="210.0" y="350.0" font-size="11" fill="#333" text-anchor="middle">원주 방향</text>
<text x="30.0" y="370.0" font-size="14" fill="#333" text-anchor="start" font-weight="bold">p_n = p_s cos β  →  m_s = m_n / cos β</text>
<text x="30.0" y="392.0" font-size="14" fill="#C00000" text-anchor="start" font-weight="bold">피치원 지름 D = m_s z = m_n z / cos β</text>
<text x="575.0" y="66.0" font-size="13" fill="#548235" text-anchor="middle" font-weight="bold">(b) 축 방향 추력과 상쇄</text>
<rect x="450" y="110" width="90" height="120" fill="#F2F8EE" stroke="#000" stroke-width="2"/>
<line x1="456.0" y1="144.0" x2="534.0" y2="120.0" stroke="#548235" stroke-width="2" />
