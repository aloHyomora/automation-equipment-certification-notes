<g clip-path="url(#ch)">
<line x1="-220.0" y1="300.0" x2="-117.4" y2="80.0" stroke="#548235" stroke-width="3" />
<line x1="-150.0" y1="300.0" x2="-47.4" y2="80.0" stroke="#548235" stroke-width="3" />
<line x1="-80.0" y1="300.0" x2="22.6" y2="80.0" stroke="#548235" stroke-width="3" />
<line x1="-10.0" y1="300.0" x2="92.6" y2="80.0" stroke="#548235" stroke-width="3" />
