<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
  <rect width="760" height="380" fill="#ffffff"/>
  <text x="380" y="26" font-size="17" font-weight="bold" fill="#2F5597" text-anchor="middle">주파수에 따른 X<tspan font-size="12" dy="4">L</tspan><tspan dy="-4">, X</tspan><tspan font-size="12" dy="4">C</tspan><tspan dy="-4"> 와 RLC 직렬 임피던스 Z</tspan></text>
  <!-- regions -->
  <rect x="80" y="50" width="280" height="250" fill="#F3F6FB"/>
  <rect x="360" y="50" width="290" height="250" fill="#FBF3F0"/>
  <text x="92" y="70" font-size="13" fill="#2F5597" font-weight="bold">용량성 영역 (X<tspan font-size="10" dy="3">C</tspan><tspan dy="-3"> &gt; X</tspan><tspan font-size="10" dy="3">L</tspan><tspan dy="-3">)</tspan></text>
  <text x="92" y="88" font-size="12" fill="#555">전류가 전압보다 앞섬</text>
  <text x="450" y="70" font-size="13" fill="#C55A11" font-weight="bold">유도성 영역 (X<tspan font-size="10" dy="3">L</tspan><tspan dy="-3"> &gt; X</tspan><tspan font-size="10" dy="3">C</tspan><tspan dy="-3">)</tspan></text>
  <text x="450" y="88" font-size="12" fill="#555">전압이 전류보다 앞섬</text>
  <!-- axes -->
  <line x1="80" y1="300" x2="665" y2="300" stroke="#333" stroke-width="2"/>
  <polygon points="672,300 662,295 662,305" fill="#333"/>
  <line x1="80" y1="300" x2="80" y2="45" stroke="#333" stroke-width="2"/>
  <polygon points="80,38 75,48 85,48" fill="#333"/>
  <text x="676" y="305" font-size="14" fill="#333">f</text>
  <text x="60" y="44" font-size="13" fill="#333" text-anchor="end">Ω</text>
  <text x="72" y="316" font-size="12" fill="#333" text-anchor="end">0</text>
  <!-- f0 -->
  <line x1="360" y1="50" x2="360" y2="300" stroke="#C00000" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="360" y="320" font-size="14" fill="#C00000" text-anchor="middle" font-weight="bold">f<tspan font-size="10" dy="3">0</tspan></text>
  <!-- X_L -->
  <line x1="80" y1="300" x2="640" y2="100" stroke="#C55A11" stroke-width="3"/>
  <text x="600" y="102" font-size="14" fill="#C55A11" font-weight="bold" text-anchor="end">X<tspan font-size="10" dy="3">L</tspan><tspan dy="-3"> = 2πfL</tspan></text>
  <!-- X_C -->
  <polyline points="220,100 255,140 290,167 360,200 430,220 500,233 570,243 640,250" fill="none" stroke="#2F5597" stroke-width="3"/>
  <text x="590" y="272" font-size="14" fill="#2F5597" font-weight="bold">X<tspan font-size="10" dy="3">C</tspan><tspan dy="-3"> = 1/(2πfC)</tspan></text>
  <!-- Z -->
  <polyline points="220,147 255,198 290,235 325,262 360,270 395,262 430,246 500,212 570,178 640,147" fill="none" stroke="#C00000" stroke-width="2.5" stroke-dasharray="7 4"/>
  <text x="210" y="160" font-size="14" fill="#C00000" font-weight="bold" text-anchor="end">Z</text>
  <circle cx="360" cy="200" r="5" fill="#333"/>
  <text x="372" y="222" font-size="12" fill="#333">X<tspan font-size="9" dy="3">L</tspan><tspan dy="-3"> = X</tspan><tspan font-size="9" dy="3">C</tspan></text>
  <circle cx="360" cy="270" r="5" fill="#C00000"/>
  <text x="372" y="288" font-size="12" fill="#C00000">Z 최소 = R (전류 최대)</text>
  <!-- legend box -->
  <rect x="110" y="335" width="540" height="34" rx="6" fill="#F7F7F7" stroke="#999"/>
  <text x="380" y="357" font-size="14" fill="#333" text-anchor="middle">직렬 공진 f<tspan font-size="10" dy="3">0</tspan><tspan dy="-3"> = 1 / (2π√LC) 에서 X</tspan><tspan font-size="10" dy="3">L</tspan><tspan dy="-3"> = X</tspan><tspan font-size="10" dy="3">C</tspan><tspan dy="-3">, 전압·전류 동상</tspan></text>
</svg>
