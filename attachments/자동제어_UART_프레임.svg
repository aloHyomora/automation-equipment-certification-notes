<text x="360" y="276" font-size="13" fill="#333" text-anchor="middle">1글자 = 시작 1 + 데이터 8 + 패리티 1 + 정지 1 = 11비트. 데이터의 1이 2개(짝수)라 짝수 패리티 비트는 0</text>
<text x="360" y="298" font-size="13" fill="#C55A11" text-anchor="middle">1비트 시간 = 1 / 통신 속도: 9600 bps → 약 104 μs</text>
