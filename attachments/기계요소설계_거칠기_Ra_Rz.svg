<text x="390.0" y="284.0" font-size="12" fill="#333" text-anchor="middle">샘플링 길이 l (= 컷오프 값). 평가 길이는 보통 이것의 5개분</text>
<rect x="40" y="315" width="340" height="88" rx="6" fill="#F3F7EE" stroke="#548235"/>
<text x="55.0" y="338.0" font-size="13" fill="#2F5597" text-anchor="start" font-weight="bold">Ra 산술 평균 거칠기</text>
<text x="55.0" y="360.0" font-size="12" fill="#333" text-anchor="start">초록 넓이(평균선 위·아래 모두 +)를</text>
<text x="55.0" y="378.0" font-size="12" fill="#333" text-anchor="start">길이 l로 나눈 값 = 높이의 절댓값 평균</text>
<text x="55.0" y="396.0" font-size="12" fill="#333" text-anchor="start">→ 흠집 하나에 둔감, 가장 널리 쓴다</text>
<rect x="400" y="315" width="340" height="88" rx="6" fill="#FBEAEA" stroke="#C00000"/>
<text x="415.0" y="338.0" font-size="13" fill="#C00000" text-anchor="start" font-weight="bold">Rz 최대 높이 거칠기 (ISO)</text>
<text x="415.0" y="360.0" font-size="12" fill="#333" text-anchor="start">Rz = Rp + Rv (최고 산 높이 + 최저 골 깊이)</text>
<text x="415.0" y="378.0" font-size="12" fill="#333" text-anchor="start">옛 KS·교재의 "10점 평균" = RzJIS</text>
<text x="415.0" y="396.0" font-size="12" fill="#333" text-anchor="start">(산 5개 + 골 5개 평균)</text>
