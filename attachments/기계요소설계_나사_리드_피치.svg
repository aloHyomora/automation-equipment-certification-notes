<text x="40.0" y="350.0" font-size="13" fill="#333" text-anchor="start">같은 색 선이 한 가닥의 나사줄이다. 한 바퀴 돌리면 같은 줄의 다음 산까지, 즉 리드 L만큼 나아간다.</text>
<text x="40.0" y="374.0" font-size="13" fill="#C00000" text-anchor="start" font-weight="bold">계산 예: 피치 3 mm, 3줄 → 리드 3 × 3 = 9 mm → 2회전이면 9 × 2 = 18 mm 이동</text>
