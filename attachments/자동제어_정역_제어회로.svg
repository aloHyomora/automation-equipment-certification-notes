<text x="52" y="372" font-size="12.5" fill="#333" text-anchor="start">① PB-F를 누르면 MC-F 코일 ON → MC-F a접점이 자기유지, MC-F b접점은 열려 역회전 줄을 끊는다.</text>
<text x="52" y="390" font-size="12.5" fill="#333" text-anchor="start">② 이 상태에서 PB-R을 눌러도 MC-F b접점이 열려 있어 MC-R은 붙지 않는다 (동시 투입 = 상간 단락 방지).</text>
<text x="52" y="408" font-size="12.5" fill="#333" text-anchor="start">③ 방향을 바꾸려면 PB-STOP으로 먼저 정지 → 그다음 반대 기동 PB.</text>
<text x="52" y="426" font-size="12.5" fill="#333" text-anchor="start">④ THR이 과부하로 동작하면 맨 앞 b접점이 열려 두 코일이 모두 떨어진다.</text>
<text x="52" y="444" font-size="12.5" fill="#333" text-anchor="start">※ 주회로에서는 MC-R이 L1·L3 두 상을 바꿔 연결해 회전 방향이 반대가 된다.</text>
