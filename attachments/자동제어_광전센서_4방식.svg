<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 560" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<defs>
<marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#C00000"/></marker>
</defs>
<rect width="780" height="560" fill="#ffffff"/>
<text x="390" y="28" font-size="17" font-weight="bold" fill="#2F5597" text-anchor="middle">광전센서 검출 방식 4가지 (빨간 선 = 빛의 경로)</text>

<!-- Row 1: 투과형 -->
<text x="20" y="72" font-size="15" font-weight="bold" fill="#2F5597">① 투과형</text>
<text x="20" y="92" font-size="12" fill="#333">거리 가장 김·가장 안정</text>
<rect x="190" y="62" width="60" height="40" rx="4" fill="#DEEBF7" stroke="#2F5597" stroke-width="2"/>
<text x="220" y="87" font-size="12" fill="#2F5597" text-anchor="middle">투광기</text>
<rect x="640" y="62" width="60" height="40" rx="4" fill="#DEEBF7" stroke="#2F5597" stroke-width="2"/>
<text x="670" y="87" font-size="12" fill="#2F5597" text-anchor="middle">수광기</text>
<line x1="250" y1="82" x2="420" y2="82" stroke="#C00000" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="470" y1="82" x2="636" y2="82" stroke="#C00000" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="425" y="58" width="40" height="48" fill="#BFBFBF" stroke="#595959" stroke-width="1.5"/>
<text x="445" y="124" font-size="12" fill="#333" text-anchor="middle">물체가 빛을 가림</text>
<text x="555" y="72" font-size="11" fill="#7F7F7F" text-anchor="middle">(빛 끊김)</text>

<!-- Row 2: 회귀반사형 -->
<line x1="10" y1="145" x2="770" y2="145" stroke="#D9D9D9" stroke-width="1"/>
<text x="20" y="192" font-size="15" font-weight="bold" fill="#2F5597">② 회귀반사형</text>
<text x="20" y="212" font-size="12" fill="#333">한쪽 배선 + 반사판</text>
<rect x="190" y="178" width="70" height="44" rx="4" fill="#DEEBF7" stroke="#2F5597" stroke-width="2"/>
<text x="225" y="198" font-size="12" fill="#2F5597" text-anchor="middle">투광+</text>
<text x="225" y="213" font-size="12" fill="#2F5597" text-anchor="middle">수광기</text>
<line x1="260" y1="190" x2="666" y2="190" stroke="#C00000" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="670" y1="210" x2="264" y2="210" stroke="#C00000" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="670" y="170" width="16" height="60" fill="#FBE5D6" stroke="#C55A11" stroke-width="2"/>
<text x="700" y="196" font-size="12" fill="#C55A11">반사판</text>
<text x="700" y="212" font-size="11" fill="#C55A11">(코너 큐브)</text>
<text x="465" y="245" font-size="12" fill="#333" text-anchor="middle">물체가 왕복 광로를 가리면 검출 · 투명체·거울면은 놓치기 쉽다</text>

<!-- Row 3: 확산반사형 -->
<line x1="10" y1="270" x2="770" y2="270" stroke="#D9D9D9" stroke-width="1"/>
<text x="20" y="312" font-size="15" font-weight="bold" fill="#2F5597">③ 확산반사형</text>
<text x="20" y="332" font-size="12" fill="#333">(직접 반사형)</text>
<rect x="190" y="298" width="70" height="44" rx="4" fill="#DEEBF7" stroke="#2F5597" stroke-width="2"/>
<text x="225" y="318" font-size="12" fill="#2F5597" text-anchor="middle">투광+</text>
<text x="225" y="333" font-size="12" fill="#2F5597" text-anchor="middle">수광기</text>
<line x1="260" y1="310" x2="416" y2="310" stroke="#C00000" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="420" y1="332" x2="264" y2="332" stroke="#C00000" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ar)"/>
<rect x="420" y="294" width="40" height="54" fill="#BFBFBF" stroke="#595959" stroke-width="1.5"/>
<line x1="460" y1="300" x2="490" y2="288" stroke="#C00000" stroke-width="1.2" stroke-dasharray="3 3"/>
<line x1="460" y1="321" x2="495" y2="321" stroke="#C00000" stroke-width="1.2" stroke-dasharray="3 3"/>
<line x1="460" y1="342" x2="490" y2="354" stroke="#C00000" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="520" y="312" font-size="12" fill="#333">물체 표면이 빛을 사방으로 흩뜨림</text>
<text x="520" y="330" font-size="12" fill="#333">→ 일부만 되돌아옴 → 거리 짧음</text>
<text x="520" y="348" font-size="12" fill="#C00000">검은색·무광이면 더 짧아진다</text>

<!-- Row 4: 한정반사형 -->
<line x1="10" y1="380" x2="770" y2="380" stroke="#D9D9D9" stroke-width="1"/>
<text x="20" y="432" font-size="15" font-weight="bold" fill="#2F5597">④ 한정반사형</text>
<text x="20" y="452" font-size="12" fill="#333">정해진 거리 구간만</text>
<rect x="190" y="400" width="60" height="30" rx="4" fill="#DEEBF7" stroke="#2F5597" stroke-width="2"/>
<text x="220" y="420" font-size="12" fill="#2F5597" text-anchor="middle">투광</text>
<rect x="190" y="470" width="60" height="30" rx="4" fill="#DEEBF7" stroke="#2F5597" stroke-width="2"/>
<text x="220" y="490" font-size="12" fill="#2F5597" text-anchor="middle">수광</text>
<line x1="250" y1="415" x2="560" y2="500" stroke="#C00000" stroke-width="2.5"/>
<line x1="250" y1="485" x2="560" y2="400" stroke="#C00000" stroke-width="2.5" stroke-dasharray="6 4"/>
<polygon points="365,450 405,439 445,450 405,461" fill="#FBE5E5" stroke="#C00000" stroke-width="1.5"/>
<line x1="380" y1="395" x2="380" y2="520" stroke="#7F7F7F" stroke-dasharray="3 3"/>
<line x1="430" y1="395" x2="430" y2="520" stroke="#7F7F7F" stroke-dasharray="3 3"/>
<text x="405" y="536" font-size="12" fill="#C00000" text-anchor="middle">검출 구간</text>
<text x="590" y="432" font-size="12" fill="#333">두 광축이 겹치는 구간의</text>
<text x="590" y="450" font-size="12" fill="#333">물체만 반사광이 수광부로</text>
<text x="590" y="468" font-size="12" fill="#333">→ 뒤쪽 배경 영향 적음</text>
</svg>
