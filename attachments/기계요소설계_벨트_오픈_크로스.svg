<text x="560" y="290" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">접촉각이 커지지만 교차점에서 벨트가 마찰·마모</text>
<rect x="90" y="306" width="560" height="34" rx="6" fill="#F2F2F2" stroke="#999"/>
<text x="370" y="329" font-size="14" fill="#222" text-anchor="middle" font-weight="normal">속도비 i = N₂/N₁ = D₁/D₂     전달 동력 H = (Tₜ − Tₛ)·v     v = πDN/(60×1000) [m/s]</text>

