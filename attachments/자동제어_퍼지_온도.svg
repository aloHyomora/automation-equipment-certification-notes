<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
  <rect width="640" height="320" rx="16" fill="#fff"/>
  <!-- axes: x = 60 + T*13 (0..40 C), y: membership 1 -> 60, 0 -> 240 -->
  <line x1="60" y1="240" x2="600" y2="240" stroke="#444" stroke-width="1.5"/>
  <line x1="60" y1="240" x2="60" y2="40" stroke="#444" stroke-width="1.5"/>
  <g font-size="12" fill="#444" text-anchor="middle">
    <text x="60" y="258">0</text><text x="190" y="258">10</text><text x="320" y="258">20</text>
    <text x="450" y="258">30</text><text x="580" y="258">40 ℃</text>
  </g>
  <g font-size="12" fill="#444" text-anchor="end"><text x="52" y="64">1</text><text x="52" y="244">0</text></g>
  <text x="18" y="150" font-size="12" fill="#444" transform="rotate(-90 18 150)">소속도</text>
  <!-- membership functions -->
  <polyline points="60,60 190,60 320,240" fill="none" stroke="#2F5597" stroke-width="3"/>
  <polyline points="190,240 320,60 536.7,240" fill="none" stroke="#548235" stroke-width="3"/>
  <polyline points="320,240 536.7,60 580,60" fill="none" stroke="#C00000" stroke-width="3"/>
  <text x="100" y="52" font-size="14" fill="#2F5597" font-weight="bold">차가움</text>
  <text x="300" y="52" font-size="14" fill="#548235" font-weight="bold">따뜻함</text>
  <text x="520" y="52" font-size="14" fill="#C00000" font-weight="bold">더움</text>
  <!-- 25 C reading -->
  <line x1="385" y1="240" x2="385" y2="70" stroke="#C55A11" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="385" cy="114" r="5" fill="#548235"/>
  <circle cx="385" cy="186" r="5" fill="#C00000"/>
  <text x="393" y="110" font-size="13" fill="#548235" font-weight="bold">따뜻함 0.7</text>
  <text x="393" y="200" font-size="13" fill="#C00000" font-weight="bold">더움 0.3</text>
  <text x="385" y="278" font-size="13" text-anchor="middle" fill="#C55A11" font-weight="bold">25 ℃</text>
  <text x="320" y="306" font-size="13" text-anchor="middle" fill="#222">25 ℃는 '따뜻함'이면서 동시에 조금 '더움' — 경계가 겹치는 것이 퍼지의 핵심</text>
</svg>
