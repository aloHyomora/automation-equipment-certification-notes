<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
  <rect width="720" height="360" fill="#ffffff"/>
  <text x="360" y="28" font-size="17" font-weight="bold" fill="#2F5597" text-anchor="middle">Y-Δ 기동: 직입 기동(Δ 그대로)과 비교한 기동 순간 값</text>

  <!-- axis -->
  <line x1="90" y1="290" x2="660" y2="290" stroke="#333" stroke-width="1.8"/>
  <line x1="90" y1="290" x2="90" y2="60" stroke="#333" stroke-width="1.8"/>
  <g stroke="#eee" stroke-width="1">
    <line x1="91" y1="90" x2="660" y2="90"/><line x1="91" y1="190" x2="660" y2="190"/>
  </g>
  <g font-size="12" fill="#333" text-anchor="end">
    <text x="82" y="294">0</text><text x="82" y="194">50 %</text><text x="82" y="94">100 %</text>
  </g>

  <!-- legend -->
  <rect x="440" y="48" width="16" height="12" fill="#BFBFBF"/><text x="462" y="59" font-size="12" fill="#333">직입 기동 (Δ)</text>
  <rect x="560" y="48" width="16" height="12" fill="#2F5597"/><text x="582" y="59" font-size="12" fill="#333">Y 기동</text>

  <!-- group 1: voltage -->
  <rect x="120" y="90" width="55" height="200" fill="#BFBFBF"/>
  <rect x="180" y="174.5" width="55" height="115.5" fill="#2F5597"/>
  <text x="207" y="166" font-size="14" font-weight="bold" fill="#2F5597" text-anchor="middle">1/√3</text>
  <text x="177" y="314" font-size="14" fill="#333" text-anchor="middle">권선 전압</text>
  <text x="177" y="332" font-size="12" fill="#666" text-anchor="middle">(약 58 %)</text>

  <!-- group 2: current -->
  <rect x="320" y="90" width="55" height="200" fill="#BFBFBF"/>
  <rect x="380" y="223.3" width="55" height="66.7" fill="#C00000"/>
  <text x="407" y="215" font-size="14" font-weight="bold" fill="#C00000" text-anchor="middle">1/3</text>
  <text x="377" y="314" font-size="14" fill="#333" text-anchor="middle">기동(선) 전류</text>
  <text x="377" y="332" font-size="12" fill="#666" text-anchor="middle">(약 33 %)</text>

  <!-- group 3: torque -->
  <rect x="520" y="90" width="55" height="200" fill="#BFBFBF"/>
  <rect x="580" y="223.3" width="55" height="66.7" fill="#C00000"/>
  <text x="607" y="215" font-size="14" font-weight="bold" fill="#C00000" text-anchor="middle">1/3</text>
  <text x="577" y="314" font-size="14" fill="#333" text-anchor="middle">기동 토크</text>
  <text x="577" y="332" font-size="12" fill="#666" text-anchor="middle">(약 33 %, T ∝ V²)</text>

  <text x="360" y="354" font-size="12" fill="#333" text-anchor="middle">전압은 1/√3 이지만 토크는 전압의 제곱(1/3), 선전류는 Y의 상전류가 Δ 선전류의 1/3</text>
</svg>
