<text x="140" y="352" font-size="13" fill="#FF6B6B" text-anchor="middle" font-weight="bold">1주기 = 4칸</text>
<line x1="100" y1="220.0" x2="100" y2="100.0" stroke="#7FD8FF" stroke-width="2" stroke-dasharray="5 3"/>
<text x="108" y="165.0" font-size="13" fill="#7FD8FF" font-weight="bold">최대 3칸</text>
<text x="490" y="90" font-size="15" fill="#2F5597" font-weight="bold">설정</text>
<text x="490" y="120" font-size="14" fill="#333">TIME/DIV = 1 ms</text>
<text x="490" y="150" font-size="14" fill="#333">VOLT/DIV = 2 V</text>
<text x="490" y="210" font-size="15" fill="#2F5597" font-weight="bold">읽기</text>
<text x="490" y="240" font-size="13.5" fill="#333">주기 T = 4칸 × 1 ms = 4 ms</text>
<text x="490" y="270" font-size="14" fill="#C00000" font-weight="bold">주파수 f = 1/T = 250 Hz</text>
<text x="490" y="300" font-size="13.5" fill="#333">최대값 Vm = 3칸 × 2 V = 6 V</text>
<text x="490" y="330" font-size="13.5" fill="#333">피크-피크 Vpp = 6칸 × 2 V = 12 V</text>
<text x="490" y="360" font-size="14" fill="#C00000" font-weight="bold">실효값 ≈ 0.707 × 6 ≈ 4.2 V</text>
<text x="260.0" y="408" font-size="12" fill="#555" text-anchor="middle">가로 1칸 = TIME/DIV, 세로 1칸 = VOLT/DIV (프로브 ×10이면 배율 확인)</text>
