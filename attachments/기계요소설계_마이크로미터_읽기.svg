<text x="534" y="132" font-size="13" fill="#333" xml:space="preserve">   끝 왼쪽 값: 7.5</text>
<text x="534" y="150" font-size="13" fill="#333" xml:space="preserve">② 기준선과 맞는</text>
<text x="534" y="168" font-size="13" fill="#333" xml:space="preserve">   심블 눈금: 28</text>
<text x="534" y="186" font-size="13" fill="#333" xml:space="preserve">   → 0.28 mm</text>
<text x="534" y="204" font-size="13" fill="#333" xml:space="preserve">③ 더하기</text>
<text x="534" y="222" font-size="13" fill="#333" xml:space="preserve">   7.5 + 0.28</text>
<text x="534" y="240" font-size="13" fill="#C00000" font-weight="bold" xml:space="preserve">   = 7.78 mm</text>
<text x="534" y="258" font-size="13" fill="#333" xml:space="preserve"></text>
<text x="534" y="276" font-size="13" fill="#555" xml:space="preserve">최소 눈금 0.5÷50</text>
<text x="534" y="294" font-size="13" fill="#548235" font-weight="bold" xml:space="preserve">= 0.01 mm</text>
