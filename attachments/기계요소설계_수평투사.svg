<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C00000"/></marker>
<marker id="dm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
</defs>
<rect width="760" height="390" fill="#ffffff"/>
<text x="380" y="28" font-size="18" fill="#548235" text-anchor="middle" font-weight="bold">수평으로 던진 물체 — 수평은 등속, 수직은 자유 낙하</text>
<!-- cliff -->
<rect x="30" y="86" width="70" height="254" fill="#D9D9D9" stroke="#7F7F7F"/>
<line x1="20" y1="340" x2="560" y2="340" stroke="#7F7F7F" stroke-width="2"/>
<!-- path: x=100+360s, y=80+260s^2 -->
<path d="M100,80 Q280,80 460,340" fill="none" stroke="#548235" stroke-width="2" stroke-dasharray="6,4"/>
<g fill="#548235"><circle cx="100" cy="80" r="7"/><circle cx="190" cy="96.25" r="7"/><circle cx="280" cy="145" r="7"/><circle cx="370" cy="226.25" r="7"/><circle cx="460" cy="334" r="7"/></g>
<line x1="108" y1="62" x2="170" y2="62" stroke="#C00000" stroke-width="3" marker-end="url(#ar)"/>
<text x="140" y="54" font-size="15" fill="#C00000" font-weight="bold" text-anchor="middle">v₀</text>
<!-- horizontal projections -->
<g stroke="#999" stroke-dasharray="2,3"><line x1="190" y1="96" x2="190" y2="340"/><line x1="280" y1="145" x2="280" y2="340"/><line x1="370" y1="226" x2="370" y2="340"/></g>
<g font-size="11" fill="#555" text-anchor="middle"><text x="145" y="356">같은 간격</text><text x="235" y="356">같은 간격</text><text x="325" y="356">같은 간격</text><text x="415" y="356">같은 간격</text></g>
<!-- vertical projections on right axis x=520 -->
<line x1="520" y1="80" x2="520" y2="340" stroke="#555"/>
<g stroke="#999" stroke-dasharray="2,3"><line x1="100" y1="80" x2="520" y2="80"/><line x1="190" y1="96" x2="520" y2="96"/><line x1="280" y1="145" x2="520" y2="145"/><line x1="370" y1="226" x2="520" y2="226"/></g>
<g fill="#2F5597"><circle cx="520" cy="80" r="4"/><circle cx="520" cy="96" r="4"/><circle cx="520" cy="145" r="4"/><circle cx="520" cy="226" r="4"/><circle cx="520" cy="340" r="4"/></g>
<text x="520" y="362" font-size="12" fill="#2F5597" text-anchor="middle">간격이 점점 커짐</text>
<!-- dims -->
<line x1="15" y1="80" x2="15" y2="340" stroke="#333" marker-start="url(#dm)" marker-end="url(#dm)"/>
<text x="20" y="220" font-size="15" font-weight="bold">h</text>
<line x1="100" y1="374" x2="460" y2="374" stroke="#333" marker-start="url(#dm)" marker-end="url(#dm)"/>
<text x="280" y="388" font-size="13" text-anchor="middle">수평 거리 x</text>
<!-- formulas -->
<g font-size="15">
<text x="580" y="100" font-weight="bold" fill="#548235">떨어지는 시간</text>
<text x="580" y="128" fill="#C00000" font-weight="bold">t = √(2h / g)</text>
<text x="580" y="170" font-weight="bold" fill="#548235">수평 거리</text>
<text x="580" y="198" fill="#C00000" font-weight="bold">x = v₀ · t</text>
<text x="580" y="248" font-size="13">수직: h = ½ g t²</text>
<text x="580" y="270" font-size="13">수평 속도 v₀는</text>
<text x="580" y="290" font-size="13">바닥까지 변하지 않는다</text>
</g>
</svg>
