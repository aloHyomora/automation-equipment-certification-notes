<text x="750.0" y="70.0" font-size="12" fill="#C00000" text-anchor="end" font-weight="bold">담금질 후 A₁ 아래로 재가열</text>
<line x1="440" y1="210" x2="740" y2="210" stroke="#333" stroke-width="1.2" marker-end="url(#ak)"/>
