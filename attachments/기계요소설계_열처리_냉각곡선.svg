<text x="130.0" y="324.0" font-size="10" fill="#555" text-anchor="middle">가열·유지</text>
<text x="265.0" y="385.0" font-size="11" fill="#548235" text-anchor="start" font-weight="bold">아주 천천히</text>
<text x="32.0" y="471.0" font-size="12" fill="#333" text-anchor="start">→ 연화, 가공성 ↑, 내부 응력 제거</text>
<rect x="400" y="275" width="360" height="210" rx="6" fill="#ffffff" stroke="#BFBFBF"/>
