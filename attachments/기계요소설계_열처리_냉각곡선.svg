<text x="552.0" y="198.0" font-size="10" fill="#2F5597" text-anchor="middle">급랭</text>
<text x="412.0" y="246.0" font-size="12" fill="#333" text-anchor="start">→ 인성 회복, 취성·내부 응력 ↓</text>
