<line x1="440" y1="435" x2="440" y2="310" stroke="#333" stroke-width="1.2" marker-end="url(#ak)"/>
<text x="740.0" y="451.0" font-size="11" fill="#555" text-anchor="end">시간</text>
<text x="434.0" y="314.0" font-size="11" fill="#555" text-anchor="end">온도</text>
<line x1="440" y1="355" x2="730" y2="355" stroke="#888" stroke-dasharray="5 3"/>
<text x="732.0" y="351.0" font-size="10" fill="#666" text-anchor="end">A₁ 변태점(약 727 ℃)</text>
<path d="M440,430 L490,330 L530,330 L533.8,349.0 L537.5,364.6 L541.2,377.4 L545.0,387.8 L548.8,396.3 L552.5,403.2 L556.2,408.8 L560.0,413.3 L563.8,417.0 L567.5,419.9 L571.2,422.3 L575.0,424.1 L578.8,425.6 L582.5,426.8 L586.2,427.7 L590.0,428.5 L593.8,429.0 L597.5,429.4 L601.2,429.8 L605.0,430.0 L700,430" fill="none" stroke="#548235" stroke-width="2.6" stroke-linejoin="round"/>
<text x="510.0" y="324.0" font-size="10" fill="#555" text-anchor="middle">가열·유지</text>
<text x="575.0" y="385.0" font-size="11" fill="#548235" text-anchor="start" font-weight="bold">공기 중 냉각</text>
<text x="412.0" y="471.0" font-size="12" fill="#333" text-anchor="start">→ 결정립 미세화, 조직 표준화</text>
<text x="390.0" y="495.0" font-size="13" fill="#C00000" text-anchor="middle" font-weight="bold">냉각 속도: 담금질(급랭) > 불림(공랭) > 풀림(노랭). 담금질 다음에는 반드시 뜨임.</text>
