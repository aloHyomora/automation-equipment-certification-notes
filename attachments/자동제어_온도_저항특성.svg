<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
  <rect x="0" y="0" width="760" height="420" fill="#ffffff"/>
  <text x="360" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2F5597">온도 – 저항 특성 (개념도)</text>
  <!-- axes -->
  <line x1="80" y1="350" x2="580" y2="350" stroke="#333" stroke-width="2"/>
  <line x1="80" y1="350" x2="80" y2="50" stroke="#333" stroke-width="2"/>
  <polygon points="580,350 570,345 570,355" fill="#333"/>
  <polygon points="80,50 75,60 85,60" fill="#333"/>
  <text x="585" y="375" text-anchor="end" font-size="14" fill="#333">온도 T →</text>
  <text x="70" y="45" text-anchor="end" font-size="14" fill="#333">저항 R</text>
  <!-- NTC: decreasing exponential -->
  <path d="M 85 75 C 170 230, 320 290, 560 305" fill="none" stroke="#2F5597" stroke-width="3"/>
  <text x="568" y="310" font-size="14" fill="#2F5597" font-weight="bold">NTC (부특성)</text>
  <text x="568" y="327" font-size="12" fill="#2F5597">오르면 감소</text>
  <!-- Pt100: gentle straight line rising -->
  <line x1="85" y1="250" x2="560" y2="190" stroke="#555" stroke-width="3" stroke-dasharray="10 5"/>
  <text x="568" y="194" font-size="14" fill="#555" font-weight="bold">Pt100 (RTD)</text>
  <text x="568" y="211" font-size="12" fill="#555">거의 직선으로 증가</text>
  <!-- PTC: flat then sharp rise -->
  <path d="M 85 300 L 390 292 C 420 288, 435 110, 470 80 L 560 72" fill="none" stroke="#C00000" stroke-width="3"/>
  <text x="568" y="77" font-size="14" fill="#C00000" font-weight="bold">PTC (정특성)</text>
  <text x="568" y="94" font-size="12" fill="#C00000">특정 온도 이상 급증</text>
  <!-- CTR: flat high then sharp drop -->
  <path d="M 85 125 L 250 130 C 275 135, 280 320, 310 336 L 560 340" fill="none" stroke="#7F6000" stroke-width="3"/>
  <text x="568" y="345" font-size="14" fill="#7F6000" font-weight="bold">CTR</text>
  <text x="604" y="345" font-size="12" fill="#7F6000">특정 온도에서 급감</text>
  <!-- switch temperature markers -->
  <line x1="280" y1="350" x2="280" y2="140" stroke="#7F6000" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="280" y="390" text-anchor="middle" font-size="12" fill="#7F6000">CTR 임계 온도</text>
  <line x1="430" y1="350" x2="430" y2="160" stroke="#C00000" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="430" y="390" text-anchor="middle" font-size="12" fill="#C00000">PTC 스위칭 온도</text>
  <text x="80" y="370" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="360" y="412" text-anchor="middle" font-size="12" fill="#666">세로축은 크기 비교용 개념 눈금 (서미스터 변화폭은 RTD보다 훨씬 크다)</text>
</svg>
