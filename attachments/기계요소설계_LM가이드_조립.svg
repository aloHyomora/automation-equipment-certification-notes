<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C00000"/></marker><marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#548235"/></marker><marker id="ak" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#404040"/></marker></defs>
<rect width="780" height="400" fill="#ffffff"/>
<text x="390.0" y="28" font-size="17" fill="#548235" text-anchor="middle" font-weight="bold">LM 가이드 조립 순서 — 기준 레일을 먼저, 종속 레일은 따라 맞춘다</text>
<rect x="20" y="50" width="115" height="34" rx="5" fill="#e2efda" stroke="#548235"/>
<text x="77.5" y="72" font-size="12" fill="#262626" text-anchor="middle" font-weight="bold">① 기준면 청소</text>
<line x1="135" y1="67" x2="145" y2="67" stroke="#548235" stroke-width="2"/>
<rect x="145" y="50" width="115" height="34" rx="5" fill="#548235" stroke="#548235"/>
<text x="202.5" y="72" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">② 기준 레일 고정</text>
<line x1="260" y1="67" x2="270" y2="67" stroke="#548235" stroke-width="2"/>
<rect x="270" y="50" width="115" height="34" rx="5" fill="#548235" stroke="#548235"/>
<text x="327.5" y="72" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">③ 종속 레일 평행</text>
<line x1="385" y1="67" x2="395" y2="67" stroke="#548235" stroke-width="2"/>
<rect x="395" y="50" width="115" height="34" rx="5" fill="#e2efda" stroke="#548235"/>
<text x="452.5" y="72" font-size="12" fill="#262626" text-anchor="middle" font-weight="bold">④ 블록 장착</text>
<line x1="510" y1="67" x2="520" y2="67" stroke="#548235" stroke-width="2"/>
<rect x="520" y="50" width="115" height="34" rx="5" fill="#e2efda" stroke="#548235"/>
<text x="577.5" y="72" font-size="12" fill="#262626" text-anchor="middle" font-weight="bold">⑤ 테이블 조립</text>
<line x1="635" y1="67" x2="645" y2="67" stroke="#548235" stroke-width="2"/>
<rect x="645" y="50" width="115" height="34" rx="5" fill="#e2efda" stroke="#548235"/>
<text x="702.5" y="72" font-size="12" fill="#262626" text-anchor="middle" font-weight="bold">⑥ 동작 확인</text>
