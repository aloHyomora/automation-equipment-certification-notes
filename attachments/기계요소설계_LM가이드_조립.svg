<text x="340" y="176" font-size="12" fill="#262626" text-anchor="middle">기준 레일 — 기준면 턱에 밀어 붙여 고정</text>
<line x1="140" y1="205" x2="140" y2="186" stroke="#C00000" stroke-width="2" marker-end="url(#ar)"/>
<line x1="260" y1="205" x2="260" y2="186" stroke="#C00000" stroke-width="2" marker-end="url(#ar)"/>
<line x1="380" y1="205" x2="380" y2="186" stroke="#C00000" stroke-width="2" marker-end="url(#ar)"/>
<line x1="500" y1="205" x2="500" y2="186" stroke="#C00000" stroke-width="2" marker-end="url(#ar)"/>
<text x="630" y="200" font-size="12" fill="#C00000" text-anchor="start">밀어 붙이기</text>
<text x="630" y="216" font-size="11" fill="#C00000" text-anchor="start">(누름 볼트·쐐기)</text>
<rect x="90" y="290" width="500" height="22" fill="#bfbfbf" stroke="#7f7f7f"/>
<text x="340" y="306" font-size="12" fill="#262626" text-anchor="middle">종속 레일 — 기준 레일과 평행하게</text>
<line x1="200" y1="186" x2="200" y2="286" stroke="#548235" stroke-width="1.5" marker-start="url(#ag)" marker-end="url(#ag)"/>
<line x1="480" y1="186" x2="480" y2="286" stroke="#548235" stroke-width="1.5" marker-start="url(#ag)" marker-end="url(#ag)"/>
<text x="210" y="240" font-size="12" fill="#548235" text-anchor="start" font-weight="bold">간격 A</text>
<text x="490" y="240" font-size="12" fill="#548235" text-anchor="start" font-weight="bold">간격 A</text>
<text x="340" y="262" font-size="12" fill="#548235" text-anchor="middle">다이얼 게이지로 전 길이 평행도 확인</text>
<text x="630" y="300" font-size="11" fill="#404040" text-anchor="start">가조립 후</text>
<text x="630" y="316" font-size="11" fill="#404040" text-anchor="start">평행을 맞추고</text>
<text x="630" y="332" font-size="11" fill="#404040" text-anchor="start">본 체결</text>
<text x="390.0" y="380" font-size="12" fill="#404040" text-anchor="middle">볼트는 가운데에서 바깥쪽으로, 규정 토크로 차례차례 조인다 · 이물질 하나가 직진도를 망친다</text>
