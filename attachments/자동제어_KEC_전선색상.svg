<text x="390" y="249" fill="#333" font-weight="bold">청색</text>
<text x="30" y="298" font-weight="bold" fill="#C00000">PE</text>
<defs><pattern id="gy" width="24" height="16" patternUnits="userSpaceOnUse" patternTransform="skewX(-30)"><rect width="12" height="16" fill="#2E9B3A"/><rect x="12" width="12" height="16" fill="#F2D21B"/></pattern></defs>
<rect x="80" y="286" width="290" height="16" rx="8" fill="url(#gy)"/>
<text x="390" y="299" fill="#C00000" font-weight="bold">녹색-노란색</text>
</g>
<text x="320" y="340" font-size="12.5" fill="#555" text-anchor="middle">옛 기준의 녹색 접지선과 적·백·흑 상 구분은 KEC(2021)부터 위 색상으로 바뀌었다</text>
</svg>
