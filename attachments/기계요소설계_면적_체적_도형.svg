<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<rect width="900" height="340" fill="#ffffff"/>
<text x="450" y="28" font-size="18" fill="#548235" text-anchor="middle" font-weight="bold">자주 나오는 넓이·부피 — 쪼개서 보면 외울 필요가 줄어든다</text>
<g stroke="#BFBFBF"><line x1="300" y1="45" x2="300" y2="325"/><line x1="600" y1="45" x2="600" y2="325"/></g>
<g font-size="15" text-anchor="middle" font-weight="bold" fill="#548235">
<text x="150" y="64">정육각형 = 정삼각형 6개</text><text x="450" y="64">부채꼴 = 원 × θ/360°</text><text x="750" y="64">원뿔 = 원기둥의 1/3</text>
</g>
<!-- hexagon center (150,175) a=80 -->
<polygon points="230,175 190,244.3 110,244.3 70,175 110,105.7 190,105.7" fill="#E2F0D9" stroke="#548235" stroke-width="2"/>
<polygon points="150,175 230,175 190,105.7" fill="#A9D18E" stroke="#548235" stroke-width="2"/>
<g stroke="#548235" stroke-width="1.5"><line x1="150" y1="175" x2="190" y2="244.3"/><line x1="150" y1="175" x2="110" y2="244.3"/><line x1="150" y1="175" x2="70" y2="175"/><line x1="150" y1="175" x2="110" y2="105.7"/></g>
<text x="214" y="132" font-size="14" fill="#C00000" font-weight="bold">a</text>
<text x="150" y="282" font-size="14" text-anchor="middle">정삼각형 1개 = (√3/4)a²</text>
<text x="150" y="306" font-size="15" text-anchor="middle" fill="#C00000" font-weight="bold">정육각형 = 6 × (√3/4)a² = (3√3/2)a²</text>
<!-- sector center (450,230) r=110 -->
<circle cx="450" cy="230" r="110" fill="none" stroke="#999" stroke-dasharray="4,4"/>
<path d="M450,230 L395,134.7 A110,110 0 0,1 505,134.7 Z" fill="#A9D18E" stroke="#548235" stroke-width="2"/>
<path d="M438,209.2 A24,24 0 0,1 462,209.2" fill="none" stroke="#C00000" stroke-width="1.5"/>
<text x="450" y="200" font-size="14" fill="#C00000" text-anchor="middle" font-weight="bold">θ</text>
<line x1="450" y1="230" x2="560" y2="230" stroke="#333"/><text x="505" y="248" font-size="14" text-anchor="middle">r</text>
<circle cx="450" cy="230" r="3" fill="#000"/>
<text x="450" y="306" font-size="15" text-anchor="middle" fill="#C00000" font-weight="bold">A = πr² × θ/360°</text>
<!-- cylinder + cone -->
<path d="M690,110 L690,240 A60,14 0 0,0 810,240 L810,110" fill="#E2F0D9" stroke="#548235" stroke-width="2"/>
<ellipse cx="750" cy="110" rx="60" ry="14" fill="#E2F0D9" stroke="#548235" stroke-width="2"/>
<path d="M750,110 L690,240 A60,14 0 0,0 810,240 Z" fill="#A9D18E" stroke="#548235" stroke-width="2"/>
<path d="M690,240 A60,14 0 0,1 810,240" fill="none" stroke="#548235" stroke-dasharray="4,3"/>
<line x1="830" y1="110" x2="830" y2="240" stroke="#333"/><text x="838" y="180" font-size="14">h</text>
<text x="750" y="282" font-size="14" text-anchor="middle">원기둥 V = A·h,  원뿔 V = ⅓ A·h</text>
<text x="750" y="306" font-size="15" text-anchor="middle" fill="#C00000" font-weight="bold">구 V = (4/3)πr³ = πD³/6</text>
</svg>
