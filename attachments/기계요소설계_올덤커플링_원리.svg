<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C00000"/></marker><marker id="ars" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#C00000"/></marker></defs>
<rect width="840" height="400" fill="#ffffff"/>
<text x="420" y="28" font-size="17" fill="#548235" text-anchor="middle" font-weight="bold">올덤 커플링 — 가운데 원판이 직각 두 방향으로 미끄러져 편심 e 를 메운다</text>
<!-- left hub -->
<text x="140" y="70" font-size="14" fill="#262626" text-anchor="middle" font-weight="bold">구동축 허브</text>
<circle cx="140" cy="180" r="80" fill="#d9d9d9" stroke="#595959" stroke-width="2"/>
<rect x="60" y="166" width="160" height="28" fill="#ffffff" stroke="#595959"/>
<circle cx="140" cy="180" r="18" fill="#7f7f7f"/>
<text x="140" y="290" font-size="12" fill="#262626" text-anchor="middle">가로 홈</text>
<!-- middle disc -->
<text x="420" y="70" font-size="14" fill="#262626" text-anchor="middle" font-weight="bold">중간 원판</text>
<circle cx="420" cy="180" r="80" fill="#c5e0b4" stroke="#548235" stroke-width="2"/>
<rect x="340" y="168" width="160" height="24" fill="#a9d18e" stroke="#548235" stroke-width="2"/>
<rect x="408" y="100" width="24" height="160" fill="none" stroke="#548235" stroke-width="2" stroke-dasharray="6,4"/>
<text x="420" y="290" font-size="12" fill="#262626" text-anchor="middle">앞면 돌기(실선) 가로 · 뒷면 돌기(점선) 세로</text>
<line x1="330" y1="314" x2="510" y2="314" stroke="#C00000" stroke-width="2.5" marker-end="url(#ar)" marker-start="url(#ars)"/>
<text x="420" y="344" font-size="12" fill="#C00000" text-anchor="middle">왼쪽 허브 홈을 따라 좌우로 미끄럼</text>
<line x1="530" y1="110" x2="530" y2="250" stroke="#C00000" stroke-width="2.5" marker-end="url(#ar)" marker-start="url(#ars)"/>
<text x="542" y="176" font-size="12" fill="#C00000">오른쪽 허브</text><text x="542" y="192" font-size="12" fill="#C00000">홈 따라 상하</text>
<!-- right hub -->
<text x="720" y="70" font-size="14" fill="#262626" text-anchor="middle" font-weight="bold">피동축 허브</text>
<circle cx="720" cy="180" r="80" fill="#d9d9d9" stroke="#595959" stroke-width="2"/>
<rect x="706" y="100" width="28" height="160" fill="#ffffff" stroke="#595959"/>
<circle cx="720" cy="180" r="18" fill="#7f7f7f"/>
<text x="720" y="290" font-size="12" fill="#262626" text-anchor="middle">세로 홈 (왼쪽과 직각)</text>
<rect x="60" y="356" width="720" height="34" rx="6" fill="#f2f2f2" stroke="#548235"/>
<text x="420" y="378" font-size="13" fill="#262626" text-anchor="middle">세 부품이 같은 각속도로 돈다(속도 변동 없음) · 미끄럼 마찰과 원판 원심력 때문에 <tspan fill="#C00000" font-weight="bold">고속 부적합</tspan></text>
</svg>
